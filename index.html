/* ============================================================
   ESPACE DOCUMENTS (mémos, fiches, vidéos par module/thème)
   ============================================================ */
function humanSize(bytes) {
  if (!bytes) return "";
  const units = ["o", "Ko", "Mo", "Go"];
  let i = 0, v = bytes;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
}

function docIcon(doc) {
  if (doc.kind === "link") return "LIEN";
  const m = doc.mime_type || "";
  if (m.includes("pdf")) return "PDF";
  if (m.includes("word") || m.includes("document")) return "DOC";
  if (m.includes("sheet") || m.includes("excel")) return "XLS";
  if (m.includes("presentation") || m.includes("powerpoint")) return "PPT";
  if (m.indexOf("image/") === 0) return "IMG";
  if (m.indexOf("video/") === 0) return "VID";
  return "FIC";
}

function groupLabel(themeId, fonction) {
  if (fonction === "PSE1" || fonction === "PSE2" || fonction === "PSC") return themeLabel(themeId);
  return themeId;
}

// Champ de recherche qui conserve le focus après re-rendu (Phase 5)
function makeSearchInput(id, value, placeholder, onChange) {
  const inp = el(`<input id="${id}" type="search" class="toolbar-search" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off">`);
  inp.oninput = (e) => {
    const pos = e.target.selectionStart;
    onChange(e.target.value);
    render();
    const n = document.getElementById(id);
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
  };
  return inp;
}
function initialsOf(name) {
  const p = String(name || "?").trim().split(/\s+/);
  return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
}

    const acc = docsList.filter(d => vis.includes(d.fonction) || (d.extra_fonctions || []).some(f => vis.includes(f)));
    const nFiles = acc.filter(d => d.kind === "file").length;
    const nCur = docsList.filter(d => d.fonction === state.docFilter.fonction || (d.extra_fonctions || []).includes(state.docFilter.fonction)).length;
    container.appendChild(el(`<div class="kpi-strip" style="margin-bottom:16px;">
      <div class="kpi indigo"><div class="kv">${acc.length}</div><div class="kl">Documents accessibles</div></div>
      <div class="kpi teal"><div class="kv">${nFiles}</div><div class="kl">Fichiers</div></div>
      <div class="kpi"><div class="kv">${acc.length - nFiles}</div><div class="kl">Liens externes</div></div>
      <div class="kpi good"><div class="kv">${nCur}</div><div class="kl">Dans « ${esc(niveauShortLabel(state.docFilter.fonction))} »</div></div>
    </div>`));
  }
  const tabsRow = el(`<div class="choice-row" style="margin-bottom:14px;"></div>`);
  visibleFonctions().forEach(fid => {
    const n = docsList.filter(d => d.fonction === fid || (d.extra_fonctions || []).includes(fid)).length;
    const chip = el(`<div class="chip ${state.docFilter.fonction === fid ? "selected" : ""}">${esc(fonctionLabel(fid))}<span class="cnt">${n}</span></div>`);
    chip.onclick = () => { state.docFilter.fonction = fid; render(); };
    tabsRow.appendChild(chip);
  });
  container.appendChild(tabsRow);
  const searchWrap = el(`<div style="margin-bottom:6px;"></div>`);
  searchWrap.appendChild(makeSearchInput("docSearch", state.docFilter.q || "", "Rechercher un document…", v => { state.docFilter.q = v; }));
  container.appendChild(searchWrap);

  if (state.documents === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement des documents…</div></div>`));
    return container;
  }
  if (!state.documents || state.documents.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger les documents pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToDocuments;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const fonction = state.docFilter.fonction;
  // Point 11 (29/08/2026) : un document est visible sur un onglet s'il y est en fonction principale
  // OU en fonction additionnelle (document_fonctions).
  const q = (state.docFilter.q || "").trim().toLowerCase();
  const docsForFonction = state.documents.filter(d => (d.fonction === fonction || (d.extra_fonctions || []).includes(fonction))
    && (!q || (d.title || "").toLowerCase().includes(q) || (d.description || "").toLowerCase().includes(q)));
  if (docsForFonction.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">${q ? "Aucun document ne correspond à « " + esc(state.docFilter.q) + " »." : "Aucun document disponible pour le moment dans « " + esc(fonctionLabel(fonction)) + " »."}</div></div>`));
    return container;
  }

  // Groupement par dossier : uniquement si au moins un document de cet onglet utilise un dossier —
  // sinon on garde l'affichage d'origine (thématiques seules), pour ne rien changer pour ceux qui
  // n'utilisent pas cette fonctionnalité.
  const usesFolders = docsForFonction.some(d => d.folder_id);
  const folderLabel = (id) => {
    const f = state.docFolders.find(f => f.id === id);
    return f ? f.label : "Dossier supprimé";
  };

  function renderThemeGroups(docs, parent) {
    const groups = {};
    docs.forEach(d => {
      const key = d.theme || "__general";
      (groups[key] = groups[key] || []).push(d);
    });
    const keys = Object.keys(groups).sort((a, b) => {
      if (a === "__general") return 1;
      if (b === "__general") return -1;
      return groupLabel(a, fonction).localeCompare(groupLabel(b, fonction));
    });
    keys.forEach(key => {
      const label = key === "__general" ? "Général" : groupLabel(key, fonction);
      parent.appendChild(el(`<div class="section-label">${esc(label)}<span class="line"></span></div>`));
      groups[key].forEach(doc => parent.appendChild(renderDocCard(doc)));
    });
  }

  if (!usesFolders) {
    renderThemeGroups(docsForFonction, container);
  } else {
    const byFolder = {};
    docsForFonction.forEach(d => {
      const key = d.folder_id || "__none";
      (byFolder[key] = byFolder[key] || []).push(d);
    });
    const folderKeys = Object.keys(byFolder).sort((a, b) => {
      if (a === "__none") return 1;
      if (b === "__none") return -1;
      return folderLabel(a).localeCompare(folderLabel(b));
    });
    folderKeys.forEach(key => {
      const label = key === "__none" ? "Sans dossier" : folderLabel(key);
      container.appendChild(el(`<div class="doc-folder-head">${iconChip("folder", { size: "sm", color: "amber" })}<h3>${esc(label)}</h3><span class="pill">${byFolder[key].length} document${byFolder[key].length > 1 ? "s" : ""}</span></div>`));
      renderThemeGroups(byFolder[key], container);
    });
  }

  return container;
}

// Point 12 (29/08/2026) : détermine si un type de fichier peut être prévisualisé en ligne (PDF, image,
// vidéo) sans le télécharger. Les autres types (Word, Excel, PowerPoint...) restent en téléchargement
// uniquement — pas de visualiseur intégré disponible pour ces formats dans l'application.
function docPreviewKind(mimeType) {
  if (!mimeType) return null;
  if (mimeType === "application/pdf") return "pdf";
  if (mimeType.indexOf("image/") === 0) return "image";
  if (mimeType.indexOf("video/") === 0) return "video";
  return null;
}

function renderDocCard(doc) {
  const previewKind = doc.kind === "file" ? docPreviewKind(doc.mime_type) : null;
  const extraFonctions = doc.extra_fonctions || [];
  const card = el(`<div class="card doc-card" style="padding:14px 16px;margin-bottom:10px;"></div>`);
  const row = el(`<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;"></div>`);
  row.appendChild(el(`<div class="ft-badge ${docIcon(doc).toLowerCase()}">${docIcon(doc)}</div>`));
  const infoCol = el(`<div style="flex:1;min-width:180px;">
    <div style="font-weight:700;font-size:14px;">${esc(doc.title)}</div>
    <div style="font-size:12px;color:var(--text-muted);">${doc.description ? esc(doc.description) + " · " : ""}${doc.kind === "file" ? humanSize(doc.file_size) : "Lien externe"}${doc.uploaded_by_name ? " · Ajouté par " + esc(doc.uploaded_by_name) : ""}</div>
  </div>`);
  if (extraFonctions.length > 0) {
    const tagRow = el(`<div class="tagset" style="margin-top:5px;"></div>`);
    tagRow.appendChild(el(`<span class="tag">${esc(fonctionLabel(doc.fonction))}</span>`));
    extraFonctions.forEach(f => tagRow.appendChild(el(`<span class="tag tag-blue">${esc(fonctionLabel(f))}</span>`)));
    infoCol.appendChild(tagRow);
  }
  row.appendChild(infoCol);

  const actions = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;max-width:100%;"></div>`);
  if (previewKind) {
    const previewBtn = el(`<button class="btn secondary">Aperçu</button>`);
    previewBtn.onclick = () => openDocPreview(doc, previewKind);
    actions.appendChild(previewBtn);
  }
  const openBtn = el(`<button class="btn secondary">${doc.kind === "link" ? "Ouvrir" : "Télécharger"}</button>`);
  openBtn.onclick = () => openDocument(doc);
  actions.appendChild(openBtn);
  if (isFormateur()) {
    const manageBtn = el(`<button class="btn secondary">Gérer</button>`);
    manageBtn.onclick = () => toggleDocMetaEdit(doc);
    actions.appendChild(manageBtn);
    const delBtn = el(`<button class="btn secondary" style="color:var(--critical);">Supprimer</button>`);
    delBtn.onclick = () => deleteDocument(doc);
    actions.appendChild(delBtn);
  }
  row.appendChild(actions);
  card.appendChild(row);

  if (state.docMetaEdit.open === doc.id) {
    card.appendChild(renderDocMetaEditPanel(doc));
  }

  return card;
}

// Panneau d'édition inline (staff) : dossier + fonctions additionnelles d'un document déjà créé.
function renderDocMetaEditPanel(doc) {
  const m = state.docMetaEdit;
  const panel = el(`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"></div>`);

  panel.appendChild(el(`<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;">Dossier</label>`));
  const folderSelect = el(`<select style="width:100%;margin-bottom:12px;padding:8px 10px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);"></select>`);
  folderSelect.appendChild(el(`<option value="">Sans dossier</option>`));
  state.docFolders.forEach(f => folderSelect.appendChild(el(`<option value="${esc(f.id)}">${esc(f.label)}</option>`)));
  folderSelect.value = m.folderId || "";
  folderSelect.onchange = (e) => { m.folderId = e.target.value; };
  panel.appendChild(folderSelect);

  panel.appendChild(el(`<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;">Aussi visible pour</label>`));
  const chipRow = el(`<div class="choice-row" style="margin-bottom:12px;"></div>`);
  FONCTIONS.filter(fo => fo.id !== doc.fonction).forEach(fo => {
    const selected = m.extraFonctions.includes(fo.id);
    const chip = el(`<div class="chip ${selected ? "selected" : ""}">${esc(fo.label)}</div>`);
    chip.onclick = () => {
      if (m.extraFonctions.includes(fo.id)) m.extraFonctions = m.extraFonctions.filter(x => x !== fo.id);
      else m.extraFonctions = m.extraFonctions.concat([fo.id]);
      render();
    };
    chipRow.appendChild(chip);
  });
  panel.appendChild(chipRow);

  if (m.error) panel.appendChild(el(`<p class="help" style="color:var(--critical);margin-bottom:10px;">${esc(m.error)}</p>`));

  const saveBtn = el(`<button class="btn" ${m.busy ? "disabled" : ""}>${m.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
  saveBtn.onclick = () => submitDocMetaEdit(doc);
  panel.appendChild(saveBtn);
  return panel;
}

function toggleDocMetaEdit(doc) {
  if (state.docMetaEdit.open === doc.id) {
    state.docMetaEdit = { open: null, folderId: "", extraFonctions: [], busy: false, error: null };
  } else {
    state.docMetaEdit = { open: doc.id, folderId: doc.folder_id || "", extraFonctions: (doc.extra_fonctions || []).slice(), busy: false, error: null };
  }
  render();
}

async function submitDocMetaEdit(doc) {
  const m = state.docMetaEdit;
  m.busy = true; m.error = null; render();
  const r = await rpc("app_set_document_meta", {
    p_token: state.auth.token, p_document_id: doc.id,
    p_folder_id: m.folderId || null, p_extra_fonctions: m.extraFonctions
  });
  m.busy = false;
  if (!r || r.error) { m.error = "Impossible d'enregistrer ces changements."; render(); return; }
  state.docMetaEdit = { open: null, folderId: "", extraFonctions: [], busy: false, error: null };
  goToDocuments();
}

// Point 12 (29/08/2026) : ouvre l'aperçu en ligne (overlay) plutôt que de forcer un téléchargement.
async function openDocPreview(doc, kind) {
  const r = await documentsFn("download_url", { document_id: doc.id });
  if (!r || r.error || !r.url) { alert("Impossible d'afficher l'aperçu pour le moment."); return; }
  state.docPreview = { title: doc.title, url: r.url, kind };
  render();
}
function closeDocPreview() { state.docPreview = null; render(); }

function renderDocPreviewOverlay() {
  const p = state.docPreview;
  const overlay = el(`<div style="position:fixed;inset:0;background:rgba(6,10,20,0.75);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;"></div>`);
  overlay.onclick = (e) => { if (e.target === overlay) closeDocPreview(); };
  const box = el(`<div style="background:#fff;border-radius:14px;max-width:960px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;"></div>`);
  const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);"><div style="font-weight:700;font-size:14.5px;"></div></div>`);
  header.querySelector("div").textContent = p.title;
  const closeBtn = el(`<button class="btn secondary" style="padding:6px 12px;">Fermer</button>`);
  closeBtn.onclick = closeDocPreview;
  header.appendChild(closeBtn);
  box.appendChild(header);

  const body = el(`<div style="flex:1;overflow:auto;background:#f3f4f6;display:flex;align-items:center;justify-content:center;min-height:300px;"></div>`);
  if (p.kind === "pdf") {
    body.appendChild(el(`<iframe src="${esc(p.url)}" style="width:100%;height:78vh;border:none;"></iframe>`));
  } else if (p.kind === "image") {
    body.appendChild(el(`<img src="${esc(p.url)}" style="max-width:100%;max-height:78vh;object-fit:contain;" />`));
  } else if (p.kind === "video") {
    body.appendChild(el(`<video src="${esc(p.url)}" controls style="max-width:100%;max-height:78vh;"></video>`));
  }
  box.appendChild(body);
  overlay.appendChild(box);
  return overlay;
}

async function openDocument(doc) {
  if (doc.kind === "link") { window.open(doc.url, "_blank", "noopener"); return; }
  const r = await documentsFn("download_url", { document_id: doc.id });
  if (!r || r.error || !r.url) { alert("Impossible d'ouvrir ce document pour le moment."); return; }
  window.open(r.url, "_blank", "noopener");
}

async function deleteDocument(doc) {
  if (!confirm("Supprimer « " + doc.title + " » ? Cette action est définitive.")) return;
  const r = await documentsFn("delete_file", { document_id: doc.id });
  if (!r || r.error) { alert("Impossible de supprimer ce document."); return; }
  goToDocuments();
}

function renderDocFormToggleCard() {
  const wrap = el(`<div></div>`);
  const toggleBtn = el(`<button class="btn" style="margin-bottom:16px;">${state.docForm.open ? "Fermer" : "+ Ajouter un document"}</button>`);
  toggleBtn.onclick = () => { state.docForm.open = !state.docForm.open; render(); };
  wrap.appendChild(toggleBtn);
  if (state.docForm.open) wrap.appendChild(renderDocForm());
  if (state.docFolders.length > 0) wrap.appendChild(renderDocFolderManager());
  return wrap;
}

// Point 11 (29/08/2026) : liste compacte des dossiers existants avec suppression (le dossier
// disparaît, les documents qu'il contenait ne sont PAS supprimés — ils repassent "Sans dossier").
function renderDocFolderManager() {
  const wrap = el(`<div style="margin-bottom:16px;"></div>`);
  const row = el(`<div class="choice-row"></div>`);
  state.docFolders.forEach(f => {
    const chip = el(`<div class="chip" style="display:inline-flex;align-items:center;gap:8px;cursor:default;">${esc(f.label)}</div>`);
    const delX = el(`<span style="cursor:pointer;font-weight:800;color:var(--critical);">×</span>`);
    delX.onclick = () => deleteDocFolder(f);
    chip.appendChild(delX);
    row.appendChild(chip);
  });
  wrap.appendChild(row);
  return wrap;
}

async function deleteDocFolder(folder) {
  if (!confirm("Supprimer le dossier « " + folder.label + " » ? Les documents qu'il contient ne seront pas supprimés, seulement détachés du dossier.")) return;
  const r = await rpc("app_delete_document_folder", { p_token: state.auth.token, p_folder_id: folder.id });
  if (!r || r.error) { alert("Impossible de supprimer ce dossier."); return; }
  goToDocuments();
}

function renderDocForm() {
  const f = state.docForm;
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<h3>Nouveau document</h3>`));
  const inputStyle = "width:100%;margin-bottom:12px;padding:10px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";

  const titleInput = el(`<input type="text" placeholder="Titre" style="${inputStyle}" value="${esc(f.title)}">`);
  titleInput.oninput = (e) => { f.title = e.target.value; };
  card.appendChild(titleInput);

  const descInput = el(`<textarea placeholder="Description (optionnel)" rows="2" style="${inputStyle}resize:vertical;">${esc(f.description)}</textarea>`);
  descInput.oninput = (e) => { f.description = e.target.value; };
  card.appendChild(descInput);

  card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Module concerné</label>`));

  FONCTIONS.forEach(fo => {

    chip.onclick = () => { f.fonction = fo.id; render(); };
    fonctionRow.appendChild(chip);
  });
  card.appendChild(fonctionRow);

  // Point 11 (29/08/2026) : fonctions additionnelles — le document reste rattaché à sa fonction
  // principale ci-dessus, mais peut aussi être visible sur d'autres fonctions.
  card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Aussi visible pour (optionnel)</label>`));
  const extraRow = el(`<div class="choice-row" style="margin-bottom:12px;"></div>`);
  FONCTIONS.filter(fo => fo.id !== f.fonction).forEach(fo => {
    const selected = f.extraFonctions.includes(fo.id);
    const chip = el(`<div class="chip ${selected ? "selected" : ""}">${esc(fo.label)}</div>`);
    chip.onclick = () => {
      if (f.extraFonctions.includes(fo.id)) f.extraFonctions = f.extraFonctions.filter(x => x !== fo.id);
      else f.extraFonctions = f.extraFonctions.concat([fo.id]);
      render();
    };
    extraRow.appendChild(chip);
  });
  card.appendChild(extraRow);

  // Point 11 (29/08/2026) : dossier optionnel, avec création rapide sans quitter le formulaire.
  card.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Dossier (optionnel)</label>`));
  const folderRow = el(`<div style="display:flex;gap:8px;margin-bottom:6px;"></div>`);
  const folderSelect = el(`<select style="${inputStyle}margin-bottom:0;flex:1;"></select>`);
  folderSelect.appendChild(el(`<option value="">Sans dossier</option>`));
  state.docFolders.forEach(fo => folderSelect.appendChild(el(`<option value="${esc(fo.id)}">${esc(fo.label)}</option>`)));
  folderSelect.value = f.folderId || "";
  folderSelect.onchange = (e) => { f.folderId = e.target.value; };
  folderRow.appendChild(folderSelect);
  const newFolderBtn = el(`<button type="button" class="btn secondary" style="flex:none;">+ Dossier</button>`);
  newFolderBtn.onclick = () => { state.docFolderForm.open = !state.docFolderForm.open; render(); };
  folderRow.appendChild(newFolderBtn);

  if (state.docFolderForm.open) card.appendChild(renderDocFolderForm());

    THEMES.filter(t => t.level === f.fonction).forEach(t => {
      themeSelect.appendChild(el(`<option value="${esc(t.id)}">${esc(t.label)}</option>`));

    themeSelect.value = f.theme || "";
    themeSelect.onchange = (e) => { f.theme = e.target.value; };
    card.appendChild(themeSelect);

    themeInput.oninput = (e) => { f.theme = e.target.value; };

    chip.onclick = () => { f.kind = kid; render(); };
    kindRow.appendChild(chip);
  });
  card.appendChild(kindRow);

  if (f.kind === "file") {
    const fileInput = el(`<input type="file" style="${inputStyle}">`);
    fileInput.onchange = (e) => { f.file = e.target.files[0] || null; };
    card.appendChild(fileInput);
    card.appendChild(el(`<p class="help" style="margin:-6px 0 12px;">Taille maximale : 50 Mo (limite du plan gratuit Supabase). Pour une vidéo plus volumineuse, utilisez plutôt un lien externe (YouTube non répertorié, Google Drive…).</p>`));
  } else {
    const urlInput = el(`<input type="url" placeholder="https://..." style="${inputStyle}" value="${esc(f.url)}">`);
    urlInput.oninput = (e) => { f.url = e.target.value; };

    card.appendChild(el(`<div style="height:8px;border-radius:999px;background:var(--gridline);overflow:hidden;margin-bottom:12px;"><div style="height:100%;background:var(--blue);width:${f.progress}%;"></div></div>`));
  }

  submitBtn.onclick = submitDocForm;

  return card;

// Point 11 (29/08/2026) : création rapide d'un dossier depuis le formulaire d'ajout de document.
function renderDocFolderForm() {
  const ff = state.docFolderForm;
  const wrap = el(`<div style="display:flex;gap:8px;margin-bottom:12px;align-items:flex-start;"></div>`);
  const input = el(`<input type="text" placeholder="Nom du dossier" style="flex:1;padding:8px 10px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;" value="${esc(ff.label)}">`);
  input.oninput = (e) => { ff.label = e.target.value; };
  wrap.appendChild(input);
  const createBtn = el(`<button type="button" class="btn" style="flex:none;" ${ff.busy ? "disabled" : ""}>${ff.busy ? "…" : "Créer"}</button>`);
  createBtn.onclick = submitDocFolderForm;
  wrap.appendChild(createBtn);
  if (ff.error) {
    const errWrap = el(`<div style="width:100%;"></div>`);
    errWrap.appendChild(wrap);
    errWrap.appendChild(el(`<p class="help" style="color:var(--critical);">${esc(ff.error)}</p>`));
    return errWrap;
  }
  return wrap;
}

async function submitDocFolderForm() {
  const ff = state.docFolderForm;
  if (!ff.label || !ff.label.trim()) { ff.error = "Merci d'indiquer un nom."; render(); return; }
  ff.busy = true; ff.error = null; render();
  const r = await rpc("app_create_document_folder", { p_token: state.auth.token, p_label: ff.label.trim() });
  ff.busy = false;
  if (!r || r.error || !r.id) { ff.error = "Impossible de créer ce dossier."; render(); return; }
  state.docFolders.push({ id: r.id, label: ff.label.trim() });
  state.docFolders.sort((a, b) => a.label.localeCompare(b.label));
  state.docForm.folderId = r.id;
  state.docFolderForm = { open: false, label: "", busy: false, error: null };
  render();
}

function resetDocForm() {
  const keepFonction = state.docForm.fonction;
  state.docForm = { open: false, kind: "file", title: "", description: "", fonction: keepFonction, theme: "", url: "", file: null, busy: false, error: null, progress: 0, folderId: "", extraFonctions: [] };
}

function uploadFileToSignedUrl(uploadUrl, file, onProgress) {
  return new Promise((resolve, reject) => {
    const fullUrl = uploadUrl.indexOf("http") === 0 ? uploadUrl : SUPABASE_URL + uploadUrl;
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", fullUrl, true);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_ANON_KEY);
    xhr.setRequestHeader("x-upsert", "false");
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => { if (xhr.status >= 200 && xhr.status < 300) resolve(); else reject(new Error("HTTP " + xhr.status + ": " + xhr.responseText)); };
    xhr.onerror = () => reject(new Error("network"));
    xhr.send(file);
  });
}

/* ============================================================
   MÉDIAS DES QUESTIONS (lot 1 — 24/11/2026)
   Une question peut porter jusqu'à 4 médias : photos (espace "question-media") ou vidéos YouTube / Vimeo
   (intégration sans cookies). Chaque média a un crédit obligatoire ; les photos ont un texte alternatif.
   ============================================================ */
const QMEDIA_IMG_PREFIX = SUPABASE_URL + "/storage/v1/object/public/question-media/";
const QMEDIA_MAX_ITEMS = 4;
const QMEDIA_MAX_BYTES = 3145728;

// Double contrôle côté client (le serveur valide aussi) : seules les adresses attendues sont affichées.
function isSafeQuestionMediaUrl(m) {
  if (!m || typeof m.url !== "string") return false;
  if (m.kind === "image") return m.url.indexOf(QMEDIA_IMG_PREFIX) === 0;
  if (m.kind === "video") return /^https:\/\/(www\.youtube-nocookie\.com\/embed\/[A-Za-z0-9_-]{6,20}|player\.vimeo\.com\/video\/[0-9]{5,12})(\?[A-Za-z0-9=&_%.-]*)?$/.test(m.url);
  return false;
}

// Transforme un lien YouTube / Vimeo collé par le formateur en adresse d'intégration sans cookies.
function parseQuestionVideoUrl(raw) {
  const s = String(raw || "").trim();
  let m = s.match(/^https?:\/\/(?:www\.|m\.)?youtube\.com\/watch\?(?:[^#]*&)?v=([A-Za-z0-9_-]{6,20})/);
  if (!m) m = s.match(/^https?:\/\/youtu\.be\/([A-Za-z0-9_-]{6,20})/);
  if (!m) m = s.match(/^https?:\/\/(?:www\.)?youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{6,20})/);
  if (m) return "https://www.youtube-nocookie.com/embed/" + m[1];
  m = s.match(/^https?:\/\/(?:www\.)?vimeo\.com\/(?:video\/)?([0-9]{5,12})/);
  if (!m) m = s.match(/^https?:\/\/player\.vimeo\.com\/video\/([0-9]{5,12})/);
  if (m) return "https://player.vimeo.com/video/" + m[1];
  return null;
}

function openQuestionMediaLightbox(m) {
  const box = document.createElement("div");
  box.className = "q-lightbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-label", "Agrandissement de l'image");
  const img = document.createElement("img");
  img.src = m.url;
  img.alt = m.alt || "";
  box.appendChild(img);
  const capText = [m.caption, m.credit ? "Crédit : " + m.credit : ""].filter(Boolean).join(" — ");
  if (capText) {
    const cap = document.createElement("div");
    cap.className = "q-lb-cap";
    cap.textContent = capText;
    box.appendChild(cap);
  }
  const onKey = (e) => { if (e.key === "Escape") close(); };
  const close = () => {
    document.removeEventListener("keydown", onKey);
    if (box.parentNode) box.parentNode.removeChild(box);
  };
  box.onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.appendChild(box);
}

// Construit le bloc médias d'une question (null s'il n'y a rien d'affichable).
function renderQuestionMedia(media) {
  const wrap = document.createElement("div");
  wrap.className = "q-media-wrap";
  (Array.isArray(media) ? media : []).forEach((m) => {
    if (!isSafeQuestionMediaUrl(m)) return;
    const fig = document.createElement("figure");
    fig.className = "q-media";
    if (m.kind === "image") {
      const img = document.createElement("img");
      img.src = m.url;
      img.alt = m.alt || "";
      img.loading = "lazy";
      img.title = "Cliquer pour agrandir";
      img.onclick = () => openQuestionMediaLightbox(m);
      fig.appendChild(img);
    } else {
      const frameWrap = document.createElement("div");
      frameWrap.className = "q-video-frame";
      const iframe = document.createElement("iframe");
      iframe.src = m.url;
      iframe.title = m.caption || m.alt || "Vidéo de la question";
      iframe.loading = "lazy";
      iframe.setAttribute("allow", "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen");
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      frameWrap.appendChild(iframe);
      fig.appendChild(frameWrap);
    }
    const capText = [m.caption, m.credit ? "Crédit : " + m.credit : ""].filter(Boolean).join(" — ");
    if (capText) {
      const cap = document.createElement("figcaption");
      cap.textContent = capText;
      fig.appendChild(cap);
    }
    wrap.appendChild(fig);
  });
  return wrap.childNodes.length ? wrap : null;
}

// Redimensionne (1600 px max) et convertit en WebP (JPEG en secours) avant envoi pour rester léger.
async function compressQuestionImage(file) {
  if (!window.createImageBitmap) throw new Error("unsupported");
  const bitmap = await createImageBitmap(file);
  const maxSide = 1600;
  const ratio = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * ratio));
  const h = Math.max(1, Math.round(bitmap.height * ratio));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  if (bitmap.close) bitmap.close();
  const toBlob = (type, quality) => new Promise((resolve) => canvas.toBlob(resolve, type, quality));
  let blob = await toBlob("image/webp", 0.85);
  let ext = "webp", mime = "image/webp";
  if (!blob || blob.type !== "image/webp") { blob = await toBlob("image/jpeg", 0.85); ext = "jpg"; mime = "image/jpeg"; }
  if (!blob) throw new Error("compress_failed");
  const base = String(file.name || "photo").replace(/\.[^.]+$/, "");
  return new File([blob], base + "." + ext, { type: mime });
}

// Ajoute le média en préparation à un « porteur » (formulaire de question ou de proposition).
// rerender : fonction qui redessine uniquement la zone concernée.
async function mediaHolderAdd(f, rerender) {
  const d = f.mediaDraft;
  f.mediaError = null;
  if (f.media.length >= QMEDIA_MAX_ITEMS) { f.mediaError = "4 médias maximum par question."; rerender(); return; }
  if (!d.credit.trim()) { f.mediaError = "Le crédit est obligatoire (auteur, source ou accord de l'ASSDCA)."; rerender(); return; }
  let item;
  if (d.kind === "image") {
    if (!d.file) { f.mediaError = "Choisissez une photo (JPEG, PNG ou WEBP)."; rerender(); return; }
    if (!d.alt.trim()) { f.mediaError = "Le texte alternatif est obligatoire : décrivez la photo en une phrase."; rerender(); return; }
    f.mediaBusy = true; rerender();
    let file;
    try {
      file = await compressQuestionImage(d.file);
    } catch (e) {
      f.mediaBusy = false; f.mediaError = "Impossible de préparer cette image. Essayez une autre photo."; rerender(); return;
    }
    if (file.size > QMEDIA_MAX_BYTES) {
      f.mediaBusy = false; f.mediaError = "L'image reste trop lourde (3 Mo maximum) après compression."; rerender(); return;
    }
    const initRes = await mediaFn("init_question_media_upload", { file_name: file.name, mime_type: file.type, file_size: file.size });
    if (!initRes || initRes.error || !initRes.upload_url) {
      f.mediaBusy = false;
      f.mediaError = (initRes && initRes.message) || "Impossible de préparer l'envoi de la photo.";
      rerender(); return;
    }
    try {
      await uploadFileToSignedUrl(initRes.upload_url, file);
    } catch (e) {
      f.mediaBusy = false; f.mediaError = "Échec de l'envoi de la photo. Vérifiez votre connexion et réessayez."; rerender(); return;
    }
    f.mediaUploaded.push(initRes.path);
    item = { kind: "image", url: initRes.public_url, path: initRes.path, alt: d.alt.trim(), caption: d.caption.trim(), credit: d.credit.trim() };
  } else {
    const embed = parseQuestionVideoUrl(d.url);
    if (!embed) { f.mediaError = "Lien vidéo non reconnu : collez un lien YouTube ou Vimeo."; rerender(); return; }
    item = { kind: "video", url: embed, caption: d.caption.trim(), credit: d.credit.trim() };
    if (d.alt.trim()) item.alt = d.alt.trim();
  }
  f.media.push(item);
  f.mediaBusy = false;
  questionFormMediaDraftReset(f);
  rerender();
}

function renderMediaEditor(f, inputStyle, rerender) {

  const d = f.mediaDraft;
  const box = el(`<div style="margin:4px 0 14px;padding:12px;border:1px dashed var(--border);border-radius:10px;"></div>`);

  if (f.mediaError) box.appendChild(el(`<div style="color:var(--critical);font-size:13px;margin-bottom:8px;">${esc(f.mediaError)}</div>`));

  f.media.forEach((m, i) => {
    const row = el(`<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;"></div>`);

      const th = document.createElement("img");

      th.style.cssText = "width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);";
      row.appendChild(th);
    } else {
      row.appendChild(el(`<span class="pill">Vidéo</span>`));
    }
    const txt = document.createElement("div");
    txt.style.cssText = "flex:1;font-size:13px;line-height:1.4;";
    txt.textContent = (m.kind === "image" ? "Photo" : "Vidéo") + " — " + (m.caption || m.alt || "sans légende") + " (crédit : " + m.credit + ")";

    rm.onclick = () => { f.media.splice(i, 1); rerender(); };

  if (f.media.length < QMEDIA_MAX_ITEMS) {
    const kindRow = el(`<div class="choice-row" style="margin:6px 0 10px;"></div>`);
    [["image", "Photo"], ["video", "Vidéo (YouTube / Vimeo)"]].forEach(([k, label]) => {
      const chip = el(`<div class="chip ${d.kind === k ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => { d.kind = k; rerender(); };
      kindRow.appendChild(chip);
    });
    box.appendChild(kindRow);

    if (d.kind === "image") {
      const fileInput = el(`<input type="file" accept="image/jpeg,image/png,image/webp" style="margin-bottom:8px;" />`);
      fileInput.onchange = () => { d.file = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null; d.fileName = d.file ? d.file.name : ""; rerender(); };
      box.appendChild(fileInput);
      if (d.fileName) box.appendChild(el(`<div class="help" style="margin-bottom:8px;">Fichier choisi : ${esc(d.fileName)}</div>`));
      const alt = el(`<input type="text" placeholder="Texte alternatif (décrivez la photo) — obligatoire" maxlength="300" value="${esc(d.alt)}" style="${inputStyle}" />`);
      alt.oninput = (e) => { d.alt = e.target.value; };
      box.appendChild(alt);
    } else {
      const url = el(`<input type="text" placeholder="Lien YouTube ou Vimeo" value="${esc(d.url)}" style="${inputStyle}" />`);
      url.oninput = (e) => { d.url = e.target.value; };
      box.appendChild(url);
    }
    const cap = el(`<input type="text" placeholder="Légende (facultative)" maxlength="300" value="${esc(d.caption)}" style="${inputStyle}" />`);
    cap.oninput = (e) => { d.caption = e.target.value; };
    box.appendChild(cap);
    const cred = el(`<input type="text" placeholder="Crédit : auteur, source ou accord ASSDCA — obligatoire" maxlength="200" value="${esc(d.credit)}" style="${inputStyle}" />`);
    cred.oninput = (e) => { d.credit = e.target.value; };
    box.appendChild(cred);
    const addBtn = el(`<button class="btn secondary" type="button" ${f.mediaBusy ? "disabled" : ""}>${f.mediaBusy ? "Envoi en cours…" : "Ajouter ce média"}</button>`);
    addBtn.onclick = () => mediaHolderAdd(f, rerender);
    box.appendChild(addBtn);
  }
  return box;
}

async function submitDocForm() {
  const f = state.docForm;
  f.error = null;
  if (!f.title || !f.title.trim()) { f.error = "Merci d'indiquer un titre."; render(); return; }

  if (f.kind === "link") {
    if (!f.url || !f.url.trim()) { f.error = "Merci d'indiquer un lien."; render(); return; }
    f.busy = true; render();
    const r = await rpc("app_add_document_link", {
      p_token: state.auth.token, p_title: f.title, p_description: f.description,
      p_fonction: f.fonction, p_theme: f.theme, p_url: f.url,
      p_folder_id: f.folderId || null, p_extra_fonctions: f.extraFonctions
    });
    f.busy = false;
    if (!r || r.error) { f.error = "Impossible d'ajouter ce lien."; render(); return; }
    resetDocForm();
    goToDocuments();
    return;
  }

  if (!f.file) { f.error = "Merci de sélectionner un fichier."; render(); return; }
  if (f.file.size > 52428800) { f.error = "Ce fichier dépasse la limite de 50 Mo. Utilisez un lien externe pour les fichiers plus volumineux."; render(); return; }

  f.busy = true; f.progress = 0; render();
  const initRes = await documentsFn("init_upload", {
    title: f.title, description: f.description, fonction: f.fonction, theme: f.theme,
    file_name: f.file.name, mime_type: f.file.type || "application/octet-stream", file_size: f.file.size,
    folder_id: f.folderId || null, extra_fonctions: f.extraFonctions
  });
  if (!initRes || initRes.error || !initRes.upload_url) {
    f.busy = false;
    f.error = (initRes && initRes.message) || "Impossible de préparer l'envoi de ce fichier.";
    render();
    return;
  }
  try {
    await uploadFileToSignedUrl(initRes.upload_url, f.file, (pct) => { f.progress = pct; render(); });
  } catch (e) {
    f.busy = false;
    f.error = "Échec de l'envoi du fichier. Vérifiez votre connexion et réessayez.";
    render();
    return;
  }
  f.busy = false;
  resetDocForm();
  goToDocuments();
}

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;" id="accActions-${acc.id}"></div>
    </div>`);
    row.querySelector("#roleSelect-" + acc.id).onchange = (e) => changeMergedRole(acc.id, e.target.value);
    const actions = row.querySelector("#accActions-" + acc.id);
    const toggleBtn = el(`<button class="btn secondary" ${isSelf ? "disabled" : ""}>${acc.disabled ? "Réactiver" : "Désactiver"}</button>`);
    toggleBtn.onclick = () => setAccountDisabled(acc.id, !acc.disabled);
    actions.appendChild(toggleBtn);
    if (!isSelf) {
      const resetBtn = el(`<button class="btn secondary">Réinitialiser le mot de passe</button>`);
      resetBtn.onclick = () => resetAccountPassword(acc.id, acc.full_name);
      actions.appendChild(resetBtn);
    }
    card.appendChild(row);
  });

  return card;
}

/* ============================================================
   QUESTIONNAIRES — rendu (thèmes + questions, formateur + administrateur)
   ============================================================ */
function renderQuestionsAdmin() {
  const container = el(`<div class="staff-wide"></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("help", {color: "indigo"})}<div><div class="page-title">Questionnaires</div><div class="page-sub">Créez, modifiez et organisez les thèmes et les questions de la bibliothèque de révision.</div></div></div>`));

  if (state.questionsAdmin.loading) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement…</div></div>`));
    return container;
  }
  if (state.questionsAdmin.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger les questionnaires pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToQuestionsAdmin;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  // Filtres de la page (niveau + recherche), conservés dans state.questionsAdmin
  const qa = state.questionsAdmin;
  if (!qa.level) qa.level = "all";
  if (qa.q == null) qa.q = "";
  const countOf = (tid) => QUESTIONS.filter(q => q.theme === tid).length;
  const emptyThemes = THEMES.filter(t => countOf(t.id) === 0);
  container.appendChild(el(`<div class="kpi-strip" style="margin-bottom:16px;">
    <div class="kpi indigo"><div class="kv">${THEMES.length}</div><div class="kl">Thèmes</div></div>
    <div class="kpi teal"><div class="kv">${QUESTIONS.length}</div><div class="kl">Questions</div></div>
    <div class="kpi ${emptyThemes.length ? "warn" : "good"}"><div class="kv">${emptyThemes.length}</div><div class="kl">Thème${emptyThemes.length > 1 ? "s" : ""} sans question</div></div>
    <div class="kpi"><div class="kv">${["PSC", "PSE1", "PSE2"].map(l => THEMES.filter(t => t.level === l).reduce((n, t) => n + countOf(t.id), 0)).join(" · ")}</div><div class="kl">Questions PSC · PSE1 · PSE2</div></div>
  </div>`));

  container.appendChild(renderProposalsCard());
  const themesCard = el(`<div class="card" style="margin-bottom:16px;"></div>`);
  const themesHeader = el(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px;"></div>`);
  themesHeader.appendChild(el(`<h3 style="margin:0;">Thèmes</h3>`));
  const addThemeBtn = el(`<button class="btn secondary">+ Nouveau thème</button>`);
  addThemeBtn.onclick = () => openThemeForm(null);
  themesHeader.appendChild(addThemeBtn);
  themesCard.appendChild(themesHeader);

  if (state.themeForm.open) themesCard.appendChild(renderThemeForm());

  // Filtre par niveau
  const levelRow = el(`<div class="choice-row" style="margin-top:10px;"></div>`);
  [["all", "Tous les niveaux"], ["PSC", niveauShortLabel("PSC")], ["PSE1", niveauShortLabel("PSE1")], ["PSE2", niveauShortLabel("PSE2")]].forEach(([id, label]) => {
    const c = el(`<div class="chip ${qa.level === id ? "selected" : ""}">${esc(label)}</div>`);
    c.onclick = () => { qa.limit = 40; qa.level = id; if (qa.selectedTheme) { const th = THEMES.find(t => t.id === qa.selectedTheme); if (th && id !== "all" && th.level !== id) qa.selectedTheme = null; } render(); };
    levelRow.appendChild(c);
  });
  themesCard.appendChild(levelRow);

  const themeRow = el(`<div class="choice-row" style="margin-top:10px;"></div>`);
  const themesShown = THEMES.filter(t => qa.level === "all" || t.level === qa.level);
  const totalShown = themesShown.reduce((n, t) => n + countOf(t.id), 0);
  const allChip = el(`<div class="chip ${!state.questionsAdmin.selectedTheme ? "selected" : ""}">Tous les thèmes (${totalShown})</div>`);
  allChip.onclick = () => { qa.limit = 40; state.questionsAdmin.selectedTheme = null; render(); };
  themeRow.appendChild(allChip);
  themesShown.forEach(t => {
    const count = countOf(t.id);
    const chip = el(`<div class="chip ${state.questionsAdmin.selectedTheme === t.id ? "selected" : ""} ${count === 0 ? "is-empty" : ""}">${esc(t.label)} · ${esc(niveauShortLabel(t.level))} (${count})</div>`);
    chip.onclick = () => { qa.limit = 40; state.questionsAdmin.selectedTheme = t.id; render(); };
    themeRow.appendChild(chip);
  });
  themesCard.appendChild(themeRow);
  if (emptyThemes.length) themesCard.appendChild(el(`<p class="help" style="margin-top:10px;">Les thèmes en pointillés rouges ne contiennent encore aucune question.</p>`));

  if (state.questionsAdmin.selectedTheme) {
    const theme = THEMES.find(t => t.id === state.questionsAdmin.selectedTheme);
    if (theme) {
      const actionsRow = el(`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;"></div>`);
      const editBtn = el(`<button class="btn secondary">Modifier ce thème</button>`);
      editBtn.onclick = () => openThemeForm(theme);
      actionsRow.appendChild(editBtn);
      const delBtn = el(`<button class="btn secondary" style="color:var(--critical);">Supprimer ce thème</button>`);
      delBtn.onclick = () => deleteTheme(theme);
      actionsRow.appendChild(delBtn);
      themesCard.appendChild(actionsRow);
    }
  }

  container.appendChild(themesCard);

  const questionsCard = el(`<div class="card"></div>`);
  const qHeader = el(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px;"></div>`);
  qHeader.appendChild(el(`<h3 style="margin:0;">Questions</h3>`));

  addQBtn.onclick = () => openQuestionForm(state.questionsAdmin.selectedTheme, null);
  qHeader.appendChild(addQBtn);
  questionsCard.appendChild(qHeader);
  if (THEMES.length === 0) questionsCard.appendChild(el(`<p class="help">Créez d'abord un thème pour pouvoir y ajouter des questions.</p>`));

  if (state.questionForm.open) questionsCard.appendChild(renderQuestionForm());

  const searchWrap = el(`<div style="margin:6px 0 4px;"></div>`);
  searchWrap.appendChild(makeSearchInput("qaSearch", qa.q, "Rechercher dans les questions…", v => { qa.q = v; }));
  questionsCard.appendChild(searchWrap);

  const qNeedle = (qa.q || "").trim().toLowerCase();
  const visibleQuestions = QUESTIONS.filter(q => {
    if (qa.selectedTheme) { if (q.theme !== qa.selectedTheme) return false; }
    else if (qa.level !== "all" && themeLevel(q.theme) !== qa.level) return false;
    if (qNeedle && !String((q.type === "order" ? q.scenario : q.q) || "").toLowerCase().includes(qNeedle)) return false;
    return true;
  });
  questionsCard.appendChild(el(`<p class="help" style="margin:2px 0 0;">${visibleQuestions.length} question${visibleQuestions.length > 1 ? "s" : ""} affichée${visibleQuestions.length > 1 ? "s" : ""}.</p>`));

    questionsCard.appendChild(el(`<div class="empty-state" style="margin-top:10px;">Aucune question${qNeedle ? " ne correspond à la recherche" : (state.questionsAdmin.selectedTheme ? " dans ce thème" : "")} pour le moment.</div>`));
  } else {
    const TYPE_LABELS = { qcm: "QCM", vf: "Vrai/Faux", short: "Réponse courte", order: "Mise en situation" };
    if (!qa.limit) qa.limit = 40;
    visibleQuestions.slice(0, qa.limit).forEach(q => {
      const summary = q.type === "order" ? q.scenario : q.q;
      const row = el(`<div class="card qa-q">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
          <div style="flex:1;min-width:200px;">
            <div class="qa-meta"><span>${esc(themeLabel(q.theme))}</span><span class="pill">${esc(TYPE_LABELS[q.type] || q.type)}</span><span class="pill diff-${esc(q.difficulty)}">${esc(q.difficulty)}</span>${q.media && q.media.length ? '<span class="pill">📷 ' + q.media.length + "</span>" : ""}</div>
            <div style="font-weight:600;font-size:14px;">${esc(summary)}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;" id="qActions-${q.id}"></div>
        </div>
      </div>`);
      const actions = row.querySelector("#qActions-" + q.id);
      const editBtn = el(`<button class="btn secondary">Modifier</button>`);
      editBtn.onclick = () => openQuestionForm(q.theme, q);
      actions.appendChild(editBtn);
      const delBtn = el(`<button class="btn secondary" style="color:var(--critical);">Supprimer</button>`);
      delBtn.onclick = () => deleteQuestion(q);
      actions.appendChild(delBtn);
      questionsCard.appendChild(row);
    });
    if (visibleQuestions.length > qa.limit) {
      const more = el(`<button class="btn secondary block" style="margin-top:12px;">Afficher 40 questions de plus (${visibleQuestions.length - qa.limit} restantes)</button>`);
      more.onclick = () => { qa.limit += 40; render(); };
      questionsCard.appendChild(more);
    }
  }

  container.appendChild(questionsCard);
  return container;
}

function renderQuestionForm() {
  const f = state.questionForm;
  const wrap = el(`<div class="card" style="margin:10px 0;background:var(--surface-1);"></div>`);
  wrap.id = "questionFormCard";
  wrap.appendChild(el(`<h3 style="margin-top:0;">${f.editingId ? "Modifier la question" : "Nouvelle question"}</h3>`));
  if (f.error) wrap.appendChild(el(`<div class="empty-state" style="color:var(--critical);">${esc(f.error)}</div>`));
  const inputStyle = "width:100%;margin-bottom:12px;padding:10px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";
  const smallInputStyle = "flex:1;padding:8px 10px;font-size:13.5px;border-radius:7px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;";

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Thème</label>`));
  const themeSelect = el(`<select style="${inputStyle}"></select>`);
  THEMES.forEach(t => themeSelect.appendChild(el(`<option value="${esc(t.id)}">${esc(t.label)} (${esc(niveauShortLabel(t.level))})</option>`)));
  themeSelect.value = f.themeId;
  themeSelect.onchange = (e) => { f.themeId = e.target.value; };
  wrap.appendChild(themeSelect);

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Difficulté</label>`));
  const diffRow = el(`<div class="choice-row" style="margin-bottom:12px;"></div>`);
  [["facile", "Facile"], ["moyen", "Moyen"], ["difficile", "Difficile"]].forEach(([did, label]) => {
    const chip = el(`<div class="chip ${f.difficulty === did ? "selected" : ""}">${label}</div>`);
    chip.onclick = () => { f.difficulty = did; render(); };
    diffRow.appendChild(chip);
  });
  wrap.appendChild(diffRow);

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Type de question</label>`));
  const typeRow = el(`<div class="choice-row" style="margin-bottom:14px;"></div>`);
  [["qcm", "QCM"], ["vf", "Vrai / Faux"], ["short", "Réponse courte"], ["order", "Mise en situation (ordre)"]].forEach(([tid, label]) => {
    const chip = el(`<div class="chip ${f.type === tid ? "selected" : ""}">${label}</div>`);
    chip.onclick = () => {
      f.type = tid;
      if (tid === "vf") f.choices = ["Vrai", "Faux"];
      else if (tid === "qcm" && f.choices.length < 2) f.choices = ["", ""];
      render();
    };
    typeRow.appendChild(chip);
  });
  wrap.appendChild(typeRow);

  if (f.type === "qcm" || f.type === "vf") {
    const qInput = el(`<textarea placeholder="Intitulé de la question" rows="2" style="${inputStyle}resize:vertical;">${esc(f.q)}</textarea>`);
    qInput.oninput = (e) => { f.q = e.target.value; };
    wrap.appendChild(qInput);

    wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Choix (cochez la/les bonne(s) réponse(s))</label>`));
    f.choices.forEach((c, i) => {
      const choiceRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"></div>`);
      const checkbox = el(`<input type="checkbox" ${f.correct.includes(i) ? "checked" : ""} style="flex:none;width:18px;height:18px;">`);
      checkbox.onchange = () => questionFormToggleCorrect(i);
      choiceRow.appendChild(checkbox);
      const choiceInput = el(`<input type="text" placeholder="Choix ${i + 1}" style="${smallInputStyle}" value="${esc(c)}" ${f.type === "vf" ? "disabled" : ""}>`);
      choiceInput.oninput = (e) => { f.choices[i] = e.target.value; };
      choiceRow.appendChild(choiceInput);
      if (f.type === "qcm" && f.choices.length > 2) {
        const rmBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">✕</button>`);
        rmBtn.onclick = () => questionFormRemoveChoice(i);
        choiceRow.appendChild(rmBtn);
      }
      wrap.appendChild(choiceRow);
    });
    if (f.type === "qcm") {
      const addChoiceBtn = el(`<button class="btn secondary" style="margin-bottom:12px;">+ Ajouter un choix</button>`);
      addChoiceBtn.onclick = questionFormAddChoice;
      wrap.appendChild(addChoiceBtn);
    }
  } else if (f.type === "order") {
    const scenarioInput = el(`<textarea placeholder="Mise en situation" rows="2" style="${inputStyle}resize:vertical;">${esc(f.scenario)}</textarea>`);
    scenarioInput.oninput = (e) => { f.scenario = e.target.value; };
    wrap.appendChild(scenarioInput);

    wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Étapes, dans le bon ordre</label>`));
    f.actions.forEach((a, i) => {
      const actionRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"></div>`);
      actionRow.appendChild(el(`<span style="flex:none;font-weight:700;font-size:12.5px;color:var(--text-muted);">${i + 1}.</span>`));
      const actionInput = el(`<input type="text" placeholder="Étape ${i + 1}" style="${smallInputStyle}" value="${esc(a)}">`);
      actionInput.oninput = (e) => { f.actions[i] = e.target.value; };
      actionRow.appendChild(actionInput);
      if (f.actions.length > 2) {
        const rmBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">✕</button>`);
        rmBtn.onclick = () => questionFormRemoveAction(i);
        actionRow.appendChild(rmBtn);
      }
      wrap.appendChild(actionRow);
    });
    const addActionBtn = el(`<button class="btn secondary" style="margin-bottom:12px;">+ Ajouter une étape</button>`);
    addActionBtn.onclick = questionFormAddAction;
    wrap.appendChild(addActionBtn);
  } else if (f.type === "short") {
    const qInput = el(`<textarea placeholder="Intitulé de la question" rows="2" style="${inputStyle}resize:vertical;">${esc(f.q)}</textarea>`);
    qInput.oninput = (e) => { f.q = e.target.value; };
    wrap.appendChild(qInput);

    wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Réponses acceptées (insensible aux accents/majuscules)</label>`));
    f.answers.forEach((a, i) => {
      const ansRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"></div>`);
      const ansInput = el(`<input type="text" placeholder="Réponse acceptée ${i + 1}" style="${smallInputStyle}" value="${esc(a)}">`);
      ansInput.oninput = (e) => { f.answers[i] = e.target.value; };
      ansRow.appendChild(ansInput);
      if (f.answers.length > 1) {
        const rmBtn = el(`<button class="btn secondary" style="padding:4px 10px;font-size:12px;">✕</button>`);
        rmBtn.onclick = () => questionFormRemoveAnswer(i);
        ansRow.appendChild(rmBtn);
      }
      wrap.appendChild(ansRow);
    });
    const addAnswerBtn = el(`<button class="btn secondary" style="margin-bottom:12px;">+ Ajouter une réponse acceptée</button>`);
    addAnswerBtn.onclick = questionFormAddAnswer;
    wrap.appendChild(addAnswerBtn);
  }

  wrap.appendChild(renderQuestionFormMedia(f, inputStyle));

  wrap.appendChild(el(`<label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;">Explication (affichée après la réponse)</label>`));
  const explInput = el(`<textarea placeholder="Explication pédagogique" rows="2" style="${inputStyle}resize:vertical;">${esc(f.explanation)}</textarea>`);
  explInput.oninput = (e) => { f.explanation = e.target.value; };
  wrap.appendChild(explInput);

  const btnRow = el(`<div style="display:flex;gap:8px;"></div>`);
  const saveBtn = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
  saveBtn.onclick = submitQuestionForm;
  btnRow.appendChild(saveBtn);
  const cancelBtn = el(`<button class="btn secondary">Annuler</button>`);
  cancelBtn.onclick = closeQuestionForm;
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

// Ajoutée le 29/08/2026 pour "Gestion du personnel" : formate une date simple (YYYY-MM-DD, ex. date de
// naissance) en jj/mm/aaaa. Distincte de formatSessionDate ci-dessus, qui inclut l'heure.
function formatDateFR(isoDate) {
  if (!isoDate) return "";
  const parts = String(isoDate).split("-");
  if (parts.length !== 3) return isoDate;
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

// Module entraînements (11/10/2026) : statuts de séance et plage horaire.
const SESSION_STATUS_LABELS = { prevue: "Prévue", realisee: "Réalisée", annulee: "Annulée", reportee: "Reportée" };
function sessionStatusTag(status) {
  const st = status || "prevue";
  const colors = {
    prevue: "background:var(--blue-light);color:var(--blue-dark);",
    realisee: "background:var(--good-light);color:var(--good);",
    annulee: "background:var(--critical-light);color:var(--critical);",
    reportee: "background:var(--warning-light);color:var(--amber-dark);"
  };
  return `<span class="tag" style="${colors[st] || ""}border-color:transparent;">${esc(SESSION_STATUS_LABELS[st] || st)}</span>`;
}
function formatSessionRange(s) {
  const base = formatSessionDate(s.starts_at);
  if (!s.ends_at) return base;
  const a = new Date(s.starts_at), b = new Date(s.ends_at);
  const time = (d) => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (a.toDateString() === b.toDateString()) return base + " – " + time(b);
  return base + " → " + formatSessionDate(s.ends_at);
}

function formatSessionDate(iso) {
  const d = new Date(iso);
  const dateStr = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const timeStr = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return dateStr.charAt(0).toUpperCase() + dateStr.slice(1) + " à " + timeStr;
}

// Ajouté le 20/08/2026 (soir) : convertit une date ISO (venant de Supabase) vers le format attendu par
// un input HTML <input type="datetime-local">, en heure locale — nécessaire pour pré-remplir le
// formulaire d'entraînement en mode édition (point 15 de la liste du porteur de projet).
function toDatetimeLocalValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function toggleSessionQuizDifficulty(id) {
  const f = state.sessionForm;
  if (f.quizDifficulties.includes(id)) {
    if (f.quizDifficulties.length > 1) f.quizDifficulties = f.quizDifficulties.filter(d => d !== id);
  } else {
    f.quizDifficulties = f.quizDifficulties.concat([id]);
  }
  render();
}
function setSessionQuizMode(mode) { state.sessionForm.quizMode = mode; render(); }
function setSessionQuizCount(n) { state.sessionForm.quizCount = n; render(); }

function renderSessions() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("calendar", {color: "teal"})}<div><div class="page-title">Calendrier des entraînements</div><div class="page-sub">Prochaines séances, thématiques et quiz associés.</div></div></div>`));

  if (isFormateur()) container.appendChild(renderSessionFormToggleCard());
  const attPanel = isFormateur() ? renderAttendancePanel() : null;
  if (attPanel) container.appendChild(attPanel);

  if (state.sessions === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement des entraînements…</div></div>`));
    return container;
  }
  if (!state.sessions || state.sessions.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger le calendrier pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToSessions;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const visible = visibleFonctions();
  const now = Date.now();
  const upcoming = state.sessions
    .filter(s => visible.includes(s.fonction) && new Date(s.starts_at).getTime() >= now - 3600000)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));

  if (upcoming.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Aucun entraînement prévu pour le moment.</div></div>`));
    appendPastSessions(container);
    return container;
  }

  let curMonth = "";
  upcoming.forEach(s => {
    const mk = new Date(s.starts_at).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    if (mk !== curMonth) { curMonth = mk; container.appendChild(el(`<div class="section-title" style="text-transform:capitalize;">${esc(mk)}</div>`)); }
    container.appendChild(renderSessionCard(s));
  });
  appendPastSessions(container);
  return container;
}

function renderSessionCard(s) {
  const card = renderSessionCardBody(s);
  const d = new Date(s.starts_at);
  const wrap = el(`<div class="sess-row"></div>`);
  const days = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 86400000);
  wrap.appendChild(el(`<div class="sess-date"><div class="sd-w">${esc(d.toLocaleDateString("fr-FR", { weekday: "short" }))}</div><div class="sd-d">${d.getDate()}</div><div class="sd-m">${esc(d.toLocaleDateString("fr-FR", { month: "short" }).replace(".", ""))}</div></div>`));
  if (days >= 0 && days <= 7 && s.status !== "annulee") {
    const lbl = days === 0 ? "Aujourd'hui" : days === 1 ? "Demain" : "Dans " + days + " jours";
    card.insertBefore(el(`<div style="margin-bottom:6px;"><span class="pill soon">${lbl}</span></div>`), card.firstChild);
  }
  wrap.appendChild(card);
  return wrap;
}

function renderSessionFormToggleCard() {

  toggleBtn.onclick = () => {

const TSTATS_UI = { sort: "name" };

async function goToTrainingStats() {
  state.view = "trainingStats";
  state.trainingStats = "loading";
  render();
  const [r, al] = await Promise.all([
    rpc("app_formateur_training_stats", { p_token: state.auth.token }),
    rpc("app_formateur_parcours_alerts", { p_token: state.auth.token })
  ]);
  state.trainingStats = (r && !r.error && Array.isArray(r.learners))
    ? { data: r, alerts: (al && Array.isArray(al.steps)) ? al.steps : [] }
    : { error: true };
  render();
}

function pctText(x) { return x == null ? "–" : Math.round(Number(x) * 100) + "%"; }
function hoursText(h) { return String(Math.round(Number(h || 0) * 10) / 10).replace(".", ",") + " h"; }
function rateColor(x) {
  if (x == null) return "var(--text-muted)";
  x = Number(x);
  return x >= 0.75 ? "var(--good)" : (x >= 0.5 ? "var(--amber)" : "var(--critical)");
}
function rateBar(x) {
  const w = x == null ? 0 : Math.max(0, Math.min(100, Math.round(Number(x) * 100)));
  return `<span style="display:inline-block;width:90px;height:8px;border-radius:999px;background:var(--gridline);overflow:hidden;vertical-align:middle;"><span style="display:block;height:100%;width:${w}%;background:${rateColor(x)};border-radius:999px;"></span></span>`;
}

function exportTrainingStatsCsv(d) {
  const lines = [
    ["Suivi des entraînements MyPSE", "Saison depuis le " + formatDateFR(d.season_start)],
    ["Séances réalisées", d.sessions.realisee],
    ["Séances prévues", d.sessions.prevue],
    ["Heures dispensées", d.hours_delivered],
    ["Assiduité moyenne %", d.avg_attendance_rate == null ? "" : Math.round(Number(d.avg_attendance_rate) * 100)],
    [],
    ["Nom", "Fonction", "Présent", "Absent", "Excusé", "Heures suivies", "Assiduité %"]
  ].concat(d.learners.map(l => [l.full_name, l.niveau, l.present, l.absent, l.excuse, l.hours, l.rate == null ? "" : Math.round(Number(l.rate) * 100)]));
  const csv = "﻿" + lines.map(l => l.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "suivi-entrainements-" + localISO(new Date()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

   app_my_notifications, app_mark_notifications_read ; envoi d'image : profile-api / init_background_upload.
   ============================================================ */
const CUSTOM_CACHE_KEY = "demo_mypse_custom_cache_v1";
const BG_PRESETS = [
  { id: "default", label: "Classique" },
  { id: "soft", label: "Doux" },
  { id: "grid", label: "Quadrillé" },

];

  { id: "steel", label: "Bleu acier", color: "#415A77" },
  { id: "charcoal", label: "Anthracite", color: "#1c2029" }
];
const MODE_OPTIONS = [{ id: "light", label: "Clair" }, { id: "dark", label: "Sombre" }, { id: "auto", label: "Automatique" }];
const SCALE_OPTIONS = [{ id: 100, label: "Normale" }, { id: 110, label: "Grande" }, { id: 120, label: "Très grande" }];

state.custom = {

};
state.notifs = { items: [], unread: 0, open: false, loaded: false, timer: null };

function isHttpsUrl(u) { return typeof u === "string" && /^https:\/\/[A-Za-z0-9._~:\/?#@!$&*+,;=%-]+$/.test(u) && u.length <= 500; }

function customEffective() {
  const org = state.custom.org || {};
  const p = state.custom.prefs || {};
  const allowBg = org.allow_user_bg !== false;
  let bg = org.bg_preset || "default";
  let bgUrl = org.bg_url || "";
  if (allowBg && p.bg_preset && p.bg_preset !== "org") { bg = p.bg_preset; bgUrl = p.bg_url || ""; }
  if (bg === "image" && !isHttpsUrl(bgUrl)) bg = "default";
  return {
    mode: p.mode || org.default_mode || "light",
    sidebar: org.sidebar_theme || "navy",
    bg: bg, bgUrl: bgUrl,
    scale: p.font_scale || 100,
    reduce: !!p.reduce_motion
  };
}

function applyCustomization() {
  const eff = customEffective();
  const root = document.documentElement;
  const dark = eff.mode === "dark" || (eff.mode === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-mode", dark ? "dark" : "light");
  root.setAttribute("data-sidebar", eff.sidebar);
  root.setAttribute("data-bg", eff.bg);
  root.setAttribute("data-scale", String(eff.scale));
  root.setAttribute("data-motion", eff.reduce ? "reduce" : "normal");
  if (eff.bg === "image") root.style.setProperty("--app-bg-url", 'url("' + eff.bgUrl.replace(/"/g, "%22") + '")');
  else root.style.removeProperty("--app-bg-url");
  try { localStorage.setItem(CUSTOM_CACHE_KEY, JSON.stringify({ dark: dark, sidebar: eff.sidebar, bg: eff.bg, bgUrl: eff.bgUrl, scale: eff.scale, reduce: eff.reduce })); } catch (e) {}
}

// En mode « Automatique », suit le réglage du système en direct.
if (window.matchMedia) {
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (customEffective().mode === "auto") applyCustomization();
    });
  } catch (e) {}
}

function resetCustomization() {
  state.custom = { org: {}, prefs: {}, loaded: false, busy: false, msg: null, err: null, bgUrlDraft: "", orgForm: null };
  try { localStorage.removeItem(CUSTOM_CACHE_KEY); } catch (e) {}
  const root = document.documentElement;
  root.setAttribute("data-mode", "light"); root.setAttribute("data-sidebar", "navy"); root.setAttribute("data-bg", "default");
  root.setAttribute("data-scale", "100"); root.setAttribute("data-motion", "normal"); root.style.removeProperty("--app-bg-url");
}

async function loadCustomization() {
  if (!state.auth || !state.auth.token) return;
  const r = await rpc("app_get_customization", { p_token: state.auth.token });
  if (r && !r.error && r.org) {
    state.custom.org = r.org || {};
    state.custom.prefs = r.prefs || {};
    state.custom.loaded = true;
    applyCustomization();
    if (state.view === "personalisation") { initOrgForm(); render(); }
  }
}

/* ---------- préférences personnelles ---------- */
async function savePrefs(patch) {
  const c = state.custom;
  c.err = null; c.msg = null;
  const prev = JSON.parse(JSON.stringify(c.prefs || {}));
  Object.keys(patch).forEach(k => {
    if (patch[k] === null) delete c.prefs[k];
    else if (k === "notif_inapp") c.prefs.notif_inapp = Object.assign({}, c.prefs.notif_inapp || {}, patch[k]);
    else c.prefs[k] = patch[k];
  });
  applyCustomization(); render();
  const r = await rpc("app_set_my_preferences", { p_token: state.auth.token, p_prefs: patch });
  if (!r || r.error) {
    c.prefs = prev; applyCustomization();
    c.err = "Impossible d'enregistrer ce réglage pour le moment.";
    render(); return;
  }
  c.prefs = r.prefs || c.prefs;
  applyCustomization(); render();
}

function checkBackgroundFile(file) {
  const allowed = ["image/png", "image/jpeg", "image/webp", "image/gif"];
  if (!allowed.includes(file.type)) return "Formats acceptés : PNG, JPEG, WEBP, GIF.";
  if (file.size > 5242880) return "L'image dépasse la limite de 5 Mo.";
  return null;
}

// Envoie l'image et renvoie son adresse publique (lève une erreur lisible en cas d'échec).
async function uploadBackgroundFile(file) {
  const initRes = await profileFn("init_background_upload", { file_name: file.name, mime_type: file.type, file_size: file.size });
  if (!initRes || initRes.error || !initRes.upload_url) throw new Error((initRes && initRes.message) || "Impossible de préparer l'envoi de l'image.");
  try { await uploadFileToSignedUrl(initRes.upload_url, file, null); }
  catch (e) { throw new Error("Échec de l'envoi de l'image. Vérifiez votre connexion et réessayez."); }
  return initRes.public_url;
}

async function onMyBackgroundFile(file) {
  if (!file) return;
  const c = state.custom;
  const problem = checkBackgroundFile(file);
  if (problem) { c.err = problem; c.msg = null; render(); return; }
  c.busy = true; c.err = null; c.msg = null; render();
  try {
    const url = await uploadBackgroundFile(file);
    c.busy = false;
    await savePrefs({ bg_preset: "image", bg_url: url });
  } catch (e) { c.busy = false; c.err = e.message; render(); }
}

function applyMyBackgroundUrl() {
  const c = state.custom;
  const u = (c.bgUrlDraft || "").trim();
  if (!isHttpsUrl(u)) { c.err = "Indiquez une adresse d'image valide commençant par https://"; c.msg = null; render(); return; }
  savePrefs({ bg_preset: "image", bg_url: u });
}

/* ---------- réglages d'organisation (administrateur) ---------- */
function initOrgForm() {
  const o = state.custom.org || {};
  const rules = o.notification_rules || {};
  const qi = rules.quiz_inactivity || {};
  const ev = rules.event_reminder || {};
  state.custom.orgForm = {
    sidebar_theme: o.sidebar_theme || "navy",
    default_mode: o.default_mode || "light",
    allow_user_bg: o.allow_user_bg !== false,
    bg_preset: o.bg_preset || "default",
    bg_url: o.bg_url || "",
    qi_enabled: qi.enabled !== false, qi_days: qi.days || 14,
    ev_enabled: ev.enabled !== false, ev_hours: ev.hours || 48,
    busyId: null, msgId: null, errId: null, msg: null, err: null
  };
}

async function onOrgBackgroundFile(file) {
  if (!file) return;
  const f = state.custom.orgForm;
  const problem = checkBackgroundFile(file);
  if (problem) { f.err = problem; f.errId = "identity"; f.msg = null; render(); return; }
  f.busyId = "upload"; f.err = null; f.msg = null; render();
  try {
    const url = await uploadBackgroundFile(file);
    f.bg_url = url; f.bg_preset = "image"; f.busyId = null; render();
  } catch (e) { f.busyId = null; f.err = e.message; f.errId = "identity"; render(); }
}

async function saveOrgIdentity() {
  const f = state.custom.orgForm;
  f.err = null; f.msg = null;
  const settings = { sidebar_theme: f.sidebar_theme, default_mode: f.default_mode, allow_user_bg: !!f.allow_user_bg, bg_preset: f.bg_preset };
  if (f.bg_preset === "image") {
    if (!isHttpsUrl((f.bg_url || "").trim())) { f.err = "Indiquez une adresse d'image valide (https://) ou envoyez un fichier."; f.errId = "identity"; render(); return; }
    settings.bg_url = f.bg_url.trim();
  }
  f.busyId = "identity"; render();
  const r = await rpc("app_admin_set_customization", { p_token: state.auth.token, p_settings: settings });
  f.busyId = null;
  if (!r || r.error) { f.err = "Impossible d'enregistrer les réglages pour le moment."; f.errId = "identity"; render(); return; }
  await loadCustomization();
  state.custom.orgForm.msg = "Réglages de l'organisation enregistrés."; state.custom.orgForm.msgId = "identity";
  render();
}

async function saveOrgRules() {
  const f = state.custom.orgForm;
  f.err = null; f.msg = null;
  const days = parseInt(f.qi_days, 10), hours = parseInt(f.ev_hours, 10);
  if (!(days >= 1 && days <= 90)) { f.err = "Le délai de relance doit être compris entre 1 et 90 jours."; f.errId = "rules"; render(); return; }
  if (!(hours >= 1 && hours <= 168)) { f.err = "Le délai de rappel doit être compris entre 1 et 168 heures."; f.errId = "rules"; render(); return; }
  f.busyId = "rules"; render();
  const r = await rpc("app_admin_set_customization", {
    p_token: state.auth.token,
    p_settings: { notification_rules: { quiz_inactivity: { enabled: !!f.qi_enabled, days: days }, event_reminder: { enabled: !!f.ev_enabled, hours: hours } } }
  });
  f.busyId = null;
  if (!r || r.error) { f.err = "Impossible d'enregistrer les règles pour le moment."; f.errId = "rules"; render(); return; }
  await loadCustomization();
  state.custom.orgForm.msg = "Règles d'automatisation enregistrées."; state.custom.orgForm.msgId = "rules";
  render();
}

/* ---------- notifications ---------- */
function updateNotifBadges() {
  const n = state.notifs.unread || 0;
  document.querySelectorAll(".notif-badge").forEach(b => { b.textContent = n > 9 ? "9+" : String(n); b.style.display = n > 0 ? "inline-flex" : "none"; });
}

async function loadNotifications() {
  if (!state.auth || !state.auth.token) return;
  const r = await rpc("app_my_notifications", { p_token: state.auth.token });
  if (r && !r.error && Array.isArray(r.items)) {
    state.notifs.items = r.items; state.notifs.unread = r.unread || 0; state.notifs.loaded = true;
    updateNotifBadges();
    if (state.notifs.open) render();
  }
}

function startNotifications() {
  stopNotifications();
  loadNotifications();
  state.notifs.timer = setInterval(loadNotifications, 300000);
}

function stopNotifications() {
  if (state.notifs.timer) clearInterval(state.notifs.timer);
  state.notifs = { items: [], unread: 0, open: false, loaded: false, timer: null };
}

function toggleNotifPanel() {
  state.notifs.open = !state.notifs.open;
  render();
  if (state.notifs.open) loadNotifications();
}

async function markNotifsRead(ids) {
  const now = new Date().toISOString();
  state.notifs.items.forEach(n => { if (!n.read_at && (!ids || ids.includes(n.id))) n.read_at = now; });
  state.notifs.unread = state.notifs.items.filter(n => !n.read_at).length;
  updateNotifBadges();
  await rpc("app_mark_notifications_read", { p_token: state.auth.token, p_ids: ids || null });
}

function openNotifLink(n) {
  if (!n.read_at) markNotifsRead([n.id]);
  state.notifs.open = false;
  closeMobileSidebar();
  if (n.link && n.link.indexOf("messages:") === 0) goToMessages(n.link.slice(9));
  else if (n.link && n.link.indexOf("tickets:") === 0) goToTickets(n.link.slice(8));
  else if (n.link === "sessions") goToSessions();
  else if (n.link === "questionnaires") {
    const lvl = ["PSC", "PSE1", "PSE2"].filter(isLevelUnlocked).pop();
    if (lvl) goToQuestionnaires(lvl); else render();
  } else render();
}

function notifAgo(iso) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 3600) return "il y a " + Math.max(1, Math.floor(s / 60)) + " min";
  if (s < 86400) return "il y a " + Math.floor(s / 3600) + " h";
  const d = Math.floor(s / 86400);
  return d === 1 ? "hier" : "il y a " + d + " jours";
}

function renderNotifPanel() {
  const wrap = el(`<div></div>`);
  const back = el(`<div class="notif-backdrop"></div>`);
  back.onclick = () => { state.notifs.open = false; render(); };
  const panel = el(`<div class="notif-panel" role="dialog" aria-label="Notifications"><div class="np-head"><h3>Notifications</h3></div><div class="np-list"></div><div class="np-foot"></div></div>`);
  const head = panel.querySelector(".np-head");
  if (state.notifs.unread > 0) {
    const all = el(`<button class="btn secondary" style="font-size:12px;padding:6px 10px;">Tout marquer comme lu</button>`);
    all.onclick = async () => { await markNotifsRead(null); render(); };
    head.appendChild(all);
  }
  const close = el(`<button class="btn secondary" style="font-size:12px;padding:6px 10px;" aria-label="Fermer">✕</button>`);
  close.onclick = () => { state.notifs.open = false; render(); };
  head.appendChild(close);
  const list = panel.querySelector(".np-list");
  if (!state.notifs.items.length) {
    list.appendChild(el(`<div class="empty-state" style="padding:26px 16px;">${state.notifs.loaded ? "Aucune notification pour le moment." : "Chargement…"}</div>`));
  }
  state.notifs.items.forEach(n => {
    const row = el(`<div class="notif-item ${n.read_at ? "" : "unread"}"><span class="dot"></span><div><div class="nt">${esc(n.title)}</div><div class="nb">${esc(n.body)}</div><div class="nd">${esc(notifAgo(n.created_at))}</div></div></div>`);
    row.onclick = () => openNotifLink(n);
    list.appendChild(row);
  });
  const link = el(`<a>Gérer mes notifications</a>`);
  link.onclick = () => { state.notifs.open = false; goToPersonalisation(); };
  panel.querySelector(".np-foot").appendChild(link);
  wrap.appendChild(back); wrap.appendChild(panel);
  return wrap;
}

  state.view = "personalisation";

function customChips(options, current, onPick) {
  const row = el(`<div class="chip-row"></div>`);
  options.forEach(o => {

   (avec ou sans compte MyPSE) et génération des documents administratifs imprimables.
   S'appuie sur les fonctions Supabase app_fs_* (réservées formateur / administrateur, par organisation).
   ============================================================ */
const FS_TYPES = [
  { id: "PSC", label: "Prévention et Secours Civiques de niveau 1 (PSC)" },
  { id: "PSE1", label: "Premiers Secours en Équipe de niveau 1 (PSE1)" },

  { id: "GQS", label: "Gestes Qui Sauvent (GQS)" },
  { id: "AUTRE", label: "Autre formation" }
];
const FS_STATUS = { preparation: "En préparation", en_cours: "En cours", terminee: "Terminée" };
const FS_RESULT = { en_attente: "En attente", valide: "Validé", non_valide: "Non validé", absent: "Absent" };
const FS_CRITERIA = [
  ["organisation", "Organisation de la formation"],
  ["contenu", "Contenu et clarté des enseignements"],
  ["pedagogie", "Qualité de l'animation / pédagogie"],
  ["materiel", "Matériel et conditions pratiques"],

];

function fsTypeLabel(s) { const t = FS_TYPES.find(x => x.id === s.formation_type); return s.formation_type === "AUTRE" && s.type_label ? s.type_label : (t ? t.label : s.formation_type); }
function fsFmtDate(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : ""; }
function fsSlotHours(sl) { const a = sl.start.split(":"), b = sl.end.split(":"); return ((+b[0] * 60 + +b[1]) - (+a[0] * 60 + +a[1])) / 60; }
function fsTotalHours(slots) { return (slots || []).reduce((n, sl) => n + fsSlotHours(sl), 0); }
function fsHoursText(h) { return String(Math.round(h * 10) / 10).replace(".", ",") + " h"; }
function fsSlotKey(sl) { return sl.date + "|" + sl.start; }
function fsDatesText(slots) {
  const d = Array.from(new Set((slots || []).map(s => s.date))).sort();
  if (!d.length) return "dates à définir";
  return d.length === 1 ? "le " + fsFmtDate(d[0]) : "du " + fsFmtDate(d[0]) + " au " + fsFmtDate(d[d.length - 1]);
}
function fsErrText(r) {
  if (!r) return "Erreur inconnue.";
  if (r.error === "forbidden") return "Action non autorisée pour votre rôle.";
  if (r.error === "invalid_value") return "Valeur invalide (" + (r.key || "?") + "). Vérifiez le champ.";
  if (r.error === "not_found") return "Élément introuvable (déjà archivé ?).";
  if (r.error === "network" || r.error === "server") return r.message || "Erreur réseau.";
  return "Opération impossible (" + r.error + ").";
}

function fsEdit(t) { if (!FS.edits[t.id]) FS.edits[t.id] = { presence: Object.assign({}, t.presence || {}), result: t.result, comment: t.comment || "" }; return FS.edits[t.id]; }

    [!!iss, "Organisme émetteur choisi"],

function renderFsAddAccounts(sid, trs) {

function renderFsTraineeTable(s, trs) {

  const body = document.createElement("tbody");

    td(`<b>${esc(t.full_name)}</b><br><span class="mini-help">${esc(info)}</span>`);
    (s.slots || []).forEach(sl => {

    td(cm);
    const act = document.createElement("div"); act.style.cssText = "display:flex;gap:6px;white-space:nowrap;";
    const ev = el(`<button class="btn secondary" style="padding:5px 9px;font-size:12px;">${t.hot_eval ? "Éval. ✓" : "Éval. à chaud"}</button>`);
