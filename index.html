/* ============================================================
   QUESTIONNAIRES (nouvelle section, 29/08/2026)
   Page dédiée avec un onglet par fonction (PSC / Secouriste / Équipier Secouriste / Conduite),
   même verrouillage visuel (cadenas) que le reste de l'application. Chaque onglet liste les
   thématiques de la fonction avec leur barre de maîtrise colorée, cliquables pour réviser.
   ============================================================ */
const QUESTIONNAIRES_TABS_META = {
  PSC: { label: "Premiers Secours Citoyen", icon: "cross" },
  PSE1: { label: "Secouriste", icon: "book" },
  PSE2: { label: "Équipier Secouriste", icon: "layers" },
  CONDUITE: { label: "Conduite", icon: "star" }
};
function renderQuestionnaires() {
  const container = el(`<div></div>`);
  const tab = state.questionnairesTab || "PSC";
  const meta = QUESTIONNAIRES_TABS_META[tab] || QUESTIONNAIRES_TABS_META.PSC;
  container.appendChild(el(`<div class="page-header">${iconChip(meta.icon, { color: "" })}<div><div class="page-title">Questionnaires</div><div class="page-sub">Parcourez les thématiques par fonction avant de lancer une révision.</div></div></div>`));

  // Barre d'onglets : PSC / Secouriste / Équipier Secouriste / Conduite, avec cadenas pour les
  // fonctions non accessibles au compte connecté (même logique que la barre latérale).
  const tabBar = el(`<div class="qtab-bar"></div>`);
  Object.keys(QUESTIONNAIRES_TABS_META).forEach(id => {
    const m = QUESTIONNAIRES_TABS_META[id];
    const ok = id === "CONDUITE" ? visibleFonctions().includes("CONDUITE") : isLevelUnlocked(id);
    const isActive = tab === id;
    const btn = el(`<button class="qtab ${isActive ? "active" : ""} ${ok ? "" : "locked"}" ${ok ? "" : "disabled"}>${svgIcon(ok ? m.icon : "lock", 15)}${esc(m.label)}${ok ? "" : " 🔒"}</button>`);
    if (ok) btn.onclick = () => goToQuestionnaires(id);
    tabBar.appendChild(btn);
  });
  container.appendChild(tabBar);

  const okCurrent = tab === "CONDUITE" ? visibleFonctions().includes("CONDUITE") : isLevelUnlocked(tab);
  if (!okCurrent) {
    container.appendChild(el(`<div class="card" style="margin-top:16px;"><div class="empty-state">🔒 Cette fonction n'est pas encore accessible à votre niveau actuel. Contactez votre formateur si vous pensez qu'elle doit être mise à jour.</div></div>`));
    return container;
  }

  const themesForTab = THEMES.filter(t => t.level === tab);
  if (themesForTab.length === 0) {
    container.appendChild(el(`<div class="card" style="margin-top:16px;"><div class="empty-state">Contenu de révision en cours de préparation pour cette fonction. En attendant, consultez la rubrique Documents pour les ressources déjà disponibles.</div></div>`));
    return container;
  }
  if (state.myProgress === "loading") {
    container.appendChild(el(`<div class="card" style="margin-top:16px;"><div class="empty-state">Chargement…</div></div>`));
    return container;
  }

  const statsByTheme = {};
  ((state.myProgress && state.myProgress.by_theme) || []).forEach(t => { statsByTheme[t.theme] = t; });
  const started = themesForTab.filter(t => statsByTheme[t.id] && statsByTheme[t.id].total > 0);
  let tot = 0, cor = 0; started.forEach(t => { tot += statsByTheme[t.id].total; cor += statsByTheme[t.id].correct; });
  const avg = tot ? Math.round(cor / tot * 100) : 0;
  container.appendChild(el(`<div class="sum-strip" style="margin-top:16px;">
    <div class="stat-tile"><div class="val">${started.length}/${themesForTab.length}</div><div class="lbl">Thématiques travaillées</div></div>
    <div class="stat-tile"><div class="val">${tot ? avg + "%" : "—"}</div><div class="lbl">Réussite sur cette fonction</div></div>
  </div>`));

  container.appendChild(el(`<div class="section-title">Choisir une thématique</div>`));
  const grid = el(`<div class="theme-grid"></div>`);
  themesForTab.forEach(t => {
    const s = statsByTheme[t.id];
    const has = s && s.total > 0;
    const pct = has ? Math.round(s.correct / s.total * 100) : 0;
    const tile = el(`<div class="theme-tile" role="button" tabindex="0">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><span class="tn">${esc(t.label)}</span>${has ? (pct >= 80 ? '<span class="pill ok">Maîtrisé</span>' : "") : '<span class="pill new">Nouveau</span>'}</div>
      <span class="bar-outer" style="display:block;"><span class="bar-inner ${progressBarClass(pct)}" style="width:${pct}%"></span></span>
      <div class="tm"><span>${has ? s.correct + " / " + s.total + " bonnes réponses · " + pct + " %" : "Pas encore commencée"}</span><span class="tgo">${has ? "Continuer →" : "Commencer →"}</span></div>
    </div>`);
    tile.onclick = () => quickStartTheme(tab, t.id);
    tile.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); quickStartTheme(tab, t.id); } };
    grid.appendChild(tile);
  });
  container.appendChild(grid);
  container.appendChild(el(`<p class="help" style="margin-top:12px;">Un clic sur une thématique lance un entraînement de 15 questions.</p>`));

  const actions = el(`<div class="page-actions"></div>`);
  const fullBtn = el(`<button class="btn secondary">Configurer une séance complète (thèmes, difficulté, mode…)</button>`);
  fullBtn.onclick = () => goToLevelWizard(tab);
  actions.appendChild(fullBtn);
  container.appendChild(actions);
  return container;
}

/* ============================================================
   ASSISTANT (WIZARD) DE PARAMÈTRES DE SÉANCE
   ============================================================ */
function renderWizard() {
  const s = state.settings;
  const container = el(`<div></div>`);
  const subtitles = { PSE1: "Premiers Secours en Équipe niveau 1 (PSE1)", PSE2: "Premiers Secours en Équipe niveau 2 (PSE2)", PSC: "Premiers Secours Citoyen (PSC)" };
  const wizLevelMeta = HOME_LEVEL_META[s.level] || { icon: "book" };
  const wizColor = s.level === "PSC" ? "teal" : s.level === "PSE2" ? "indigo" : "";
  container.appendChild(el(`<div class="page-header">${iconChip(wizLevelMeta.icon, {color: `${wizColor}`})}<div><div class="page-title">${esc(niveauShortLabel(s.level))}</div><div class="page-sub">${esc(subtitles[s.level] || "")}</div></div></div>`));

  if (s.level === "PSC" && THEMES.filter(t => t.level === "PSC").length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Le contenu d'entraînement PSC (Premiers Secours Citoyen) est en cours de préparation et sera ajouté prochainement. En attendant, consultez la rubrique Documents pour les ressources déjà disponibles.</div></div>`));
    const btn = el(`<button class="btn block" style="margin-top:4px;">Retour à l'accueil</button>`);
    btn.onclick = goToHome;
    container.appendChild(btn);
    return container;
  }

  const card = el(`<div class="card"></div>`);
  const stepper = el(`<div class="stepper"></div>`);
  WIZARD_STEPS.forEach((st, i) => {
    if (i > 0) stepper.appendChild(el(`<div class="step-line"></div>`));
    const cls = i === state.wizard.step ? "current" : (i < state.wizard.step ? "done" : "");
    const dot = el(`<div class="step-dot ${cls}"><span class="n">${i < state.wizard.step ? "✓" : (i + 1)}</span><span class="lbl">${st.label}</span></div>`);
    if (i <= state.wizard.maxStepSeen) dot.onclick = () => wizardGoTo(i);
    stepper.appendChild(dot);
  });
  card.appendChild(stepper);

  const body = el(`<div></div>`);
  renderWizardStepBody(body, WIZARD_STEPS[state.wizard.step].id);
  card.appendChild(body);

  const nav = el(`<div class="actions-row" style="margin-top:20px;justify-content:space-between;"></div>`);
  const backBtn = el(`<button class="btn secondary" ${state.wizard.step === 0 ? "disabled" : ""}>Précédent</button>`);
  backBtn.onclick = wizardBack;
  nav.appendChild(backBtn);
  if (state.wizard.step < WIZARD_STEPS.length - 1) {
    const nextBtn = el(`<button class="btn">Suivant</button>`);
    nextBtn.onclick = wizardNext;
    nav.appendChild(nextBtn);
  } else {
    const pool = filterPool();
    const startBtn = el(`<button class="btn" ${pool.length === 0 ? "disabled" : ""}>Commencer (${pool.length} question${pool.length > 1 ? "s" : ""})</button>`);
    startBtn.onclick = beginQuiz;
    nav.appendChild(startBtn);
  }
  card.appendChild(nav);
  container.appendChild(card);
  return container;
}

function renderWizardStepBody(container, stepId) {
  const s = state.settings;

  if (stepId === "themes") {
    container.appendChild(el(`<label class="field-label">Choisissez un ou plusieurs thèmes</label>`));
    const grid = el(`<div class="theme-grid" style="margin-top:8px;"></div>`);
    const allChip = el(`<div class="chip ${s.themes === "all" ? "selected" : ""}">Tous les thèmes</div>`);
    allChip.onclick = selectAllThemes;
    grid.appendChild(allChip);
    THEMES.filter(t => t.level === s.level).forEach(t => {
      const active = s.themes !== "all" && s.themes.includes(t.id);
      const chip = el(`<div class="chip ${active ? "selected" : ""}">${t.label}</div>`);
      chip.onclick = () => toggleTheme(t.id);
      grid.appendChild(chip);
    });
    container.appendChild(grid);
    container.appendChild(el(`<p class="help" style="margin-top:10px;">Aucune sélection = tous les thèmes.</p>`));

  } else if (stepId === "difficulty") {
    // Correction du 20/08/2026 (soir) : la sélection de la difficulté n'est plus jamais verrouillée
    // (tous les rôles peuvent choisir librement un ou plusieurs niveaux) — voir applyAccountDefaults().
    container.appendChild(el(`<label class="field-label">Niveau de difficulté</label>`));
    const row = el(`<div class="choice-row"></div>`);
    [["facile", "Facile"], ["moyen", "Moyen"], ["difficile", "Difficile"]].forEach(([id, label]) => {
      const chip = el(`<div class="chip ${s.difficulties.includes(id) ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => toggleDifficulty(id);
      row.appendChild(chip);
    });
    container.appendChild(row);
    const recommended = !isFormateur() && state.auth.account && state.auth.account.difficulty;
    const help = recommended
      ? "Niveau recommandé par votre formateur : " + recommended + ". Vous pouvez librement choisir un ou plusieurs autres niveaux."
      : "Choisissez librement un ou plusieurs niveaux de difficulté.";
    container.appendChild(el(`<p class="help" style="margin-top:10px;">${help}</p>`));

  } else if (stepId === "mode") {
    container.appendChild(el(`<label class="field-label">Mode de séance</label>`));
    const modes = [
      ["entrainement", "Entraînement libre", "QCM et mises en situation mélangés, avec correction immédiate après chaque question."],
      ["situation", "Mise en situation", "Uniquement des scénarios à remettre en ordre, avec correction immédiate."],
      ["examen", "Examen chronométré", "QCM et mises en situation mélangés, temps limité, corrections affichées à la fin."]
    ];
    const row = el(`<div class="choice-row"></div>`);
    modes.forEach(([id, label]) => {
      const chip = el(`<div class="chip ${s.mode === id ? "selected" : ""}">${label}</div>`);
      chip.onclick = () => setMode(id);
      row.appendChild(chip);
    });
    container.appendChild(row);
    container.appendChild(el(`<p class="help" style="margin-top:10px;">${modes.find(m => m[0] === s.mode)[2]}</p>`));

  } else if (stepId === "count") {
    container.appendChild(el(`<label class="field-label">Nombre de questions</label>`));
    const row = el(`<div class="choice-row"></div>`);
    [10, 15, 20, "toutes"].forEach(n => {
      const chip = el(`<div class="chip ${s.count === n ? "selected" : ""}">${n === "toutes" ? "Toutes" : n}</div>`);
      chip.onclick = () => setCount(n);
      row.appendChild(chip);
    });
    container.appendChild(row);

  } else if (stepId === "review") {
    const pool = filterPool();
    const themesLabelTxt = s.themes === "all" ? "Tous les thèmes" : s.themes.map(themeLabel).join(", ");
    const modeLabelTxt = { entrainement: "Entraînement libre", situation: "Mise en situation", examen: "Examen chronométré" }[s.mode];
    const rows = [
      ["Fonction", niveauShortLabel(s.level) + " (" + s.level + ")"],
      ["Thèmes", themesLabelTxt],
      ["Difficulté", s.difficulties.map(x => x[0].toUpperCase() + x.slice(1)).join(", ")],
      ["Mode", modeLabelTxt],
      ["Nombre de questions", s.count === "toutes" ? "Toutes (" + pool.length + ")" : String(s.count)]
    ];
    const table = el(`<div></div>`);
    rows.forEach(([k, v]) => {
      table.appendChild(el(`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--gridline);font-size:13.5px;"><span style="color:var(--text-secondary);font-weight:600;">${k}</span><span style="font-weight:700;">${v}</span></div>`));
    });
    container.appendChild(table);
    container.appendChild(el(`<p class="help" style="margin-top:12px;">${pool.length} question(s) disponible(s) avec ces réglages.</p>`));
  }
}

/* ============================================================
   QUIZ / RÉSULTATS
   ============================================================ */
function renderQuiz() {
  const quiz = state.quiz;
  const q = quiz.questions[quiz.index];
  const container = el(`<div></div>`);
  const card = el(`<div class="card"></div>`);

  const meta = el(`<div class="quiz-meta">
    <div class="tagset">
      <span class="tag tag-blue">${q.level}</span>
      <span class="tag">${themeLabel(q.theme)}</span>
      <span class="tag">${q.difficulty}</span>
    </div>
    <div>${quiz.mode === "examen" ? '<span class="timer" id="timerDisplay"></span>' : ("Question " + (quiz.index + 1) + "/" + quiz.questions.length)}</div>
  </div>`);
  card.appendChild(meta);

  if (quiz.mode === "examen") {
    card.appendChild(el(`<p class="help" style="margin:-4px 0 10px;">Question ${quiz.index + 1}/${quiz.questions.length}</p>`));
  }

  card.appendChild(el(`<div class="progressbar-outer"><div class="progressbar-inner" style="width:${(quiz.index / quiz.questions.length * 100)}%"></div></div>`));

  const qMediaEl = renderQuestionMedia(q.media);
  if (qMediaEl) card.appendChild(qMediaEl);

  if (q.type === "order") {
    card.appendChild(el(`<div class="scenario-box"><strong>Situation :</strong> ${q.scenario}</div>`));
    card.appendChild(el(`<p class="qtext" style="font-size:14px;font-weight:600;color:var(--text-secondary);">Remettez les actions dans le bon ordre (utilisez les flèches) :</p>`));
    const ol = el(`<ol class="order-list"></ol>`);
    quiz.currentOrder.forEach((originalIdx, pos) => {
      const li = el(`<li>
        <span class="rank">${pos + 1}</span>
        <span class="txt">${q.actions[originalIdx]}</span>
        <span class="moves">
          <button data-dir="-1" ${pos === 0 ? "disabled" : ""}>▲</button>
          <button data-dir="1" ${pos === quiz.currentOrder.length - 1 ? "disabled" : ""}>▼</button>
        </span>
      </li>`);
      if (quiz.validated) {
        li.classList.add(originalIdx === pos ? "correct" : "incorrect-pos");
        li.querySelectorAll("button").forEach(b => b.disabled = true);
      } else {
        li.querySelectorAll("button").forEach(b => b.onclick = () => moveOrderItem(pos, parseInt(b.dataset.dir)));
      }
      ol.appendChild(li);
    });
    card.appendChild(ol);
  } else if (q.type === "short") {
    card.appendChild(el(`<p class="qtext">${q.q}</p>`));
    const input = el(`<input type="text" class="text-input" placeholder="Votre réponse…" style="width:100%;font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);" value="${esc(quiz.shortAnswer || "")}">`);
    if (quiz.validated) {
      input.disabled = true;
      const result = quiz.results[quiz.results.length - 1];
      input.classList.add(result.correct ? "correct" : "incorrect");
    } else {
      input.oninput = (e) => { quiz.shortAnswer = e.target.value; };
    }
    card.appendChild(input);
    if (quiz.validated) {
      card.appendChild(el(`<p class="help" style="margin-top:8px;">Réponse(s) acceptée(s) : ${(q.answers || []).join(", ")}</p>`));
    }
  } else {
    card.appendChild(el(`<p class="qtext">${q.q}</p>`));
    if (isMultiAnswer(q)) card.appendChild(el(`<p class="help" style="margin-top:-10px;margin-bottom:14px;">Plusieurs réponses possibles.</p>`));
    const ul = el(`<ul class="options"></ul>`);
    q.displayChoices.forEach(originalIdx => {
      const li = el(`<li><span class="box"></span><span>${q.choices[originalIdx]}</span></li>`);
      const isSelected = quiz.selected.includes(originalIdx);
      if (quiz.validated) {
        const isCorrectChoice = q.correct.includes(originalIdx);
        if (isCorrectChoice) li.classList.add("correct");
        else if (isSelected) li.classList.add("incorrect");
      } else {
        if (isSelected) li.classList.add("selected");
        li.onclick = () => selectChoice(originalIdx);
      }
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  if (quiz.validated && quiz.mode !== "examen") {
    const result = quiz.results[quiz.results.length - 1];
    card.appendChild(el(`<div class="feedback ${result.correct ? "ok" : "ko"}">
      <div class="fb-title">${result.correct ? "✅ Bonne réponse" : "❌ Réponse incorrecte"}</div>
      <div>${q.explanation}</div>
    </div>`));
  }

  const actionsRow = el(`<div class="actions-row"></div>`);
  if (!quiz.validated) {
    const canValidate = q.type === "order" || q.type === "short" || quiz.selected.length > 0;
    const btn = el(`<button class="btn" ${canValidate ? "" : "disabled"}>Valider</button>`);
    btn.onclick = validateAnswer;
    actionsRow.appendChild(btn);
  } else {
    const btn = el(`<button class="btn">${quiz.index < quiz.questions.length - 1 ? "Question suivante" : "Voir les résultats"}</button>`);
    btn.onclick = nextQuestion;
    actionsRow.appendChild(btn);
  }
  card.appendChild(actionsRow);

  container.appendChild(card);
  return container;
}

    <h2>Résultats de la séance</h2>

function renderProgress() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("chart", {color: "teal"})}<div><div class="page-title">Ma progression</div><div class="page-sub">Votre historique, tous modules confondus.</div></div></div>`));

  if (state.myProgress === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement de votre progression…</div></div>`));
    return container;
  }
  if (!state.myProgress || state.myProgress.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger votre progression pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToProgress;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const ov = state.myProgress.overall || { total: 0, correct: 0 };
  const pct = ov.total ? Math.round(ov.correct / ov.total * 100) : 0;
  const byTheme = state.myProgress.by_theme || [];
  const worked = byTheme.filter(t => t.total > 0);

  container.appendChild(el(`<div class="sum-strip">
    <div class="stat-tile"><div class="val">${ov.total}</div><div class="lbl">Questions répondues</div></div>
    <div class="stat-tile"><div class="val">${ov.total ? pct + "%" : "—"}</div><div class="lbl">Taux de réussite global</div></div>
    <div class="stat-tile"><div class="val">${worked.length}</div><div class="lbl">Thématiques travaillées</div></div>
  </div>`));

  if (byTheme.length === 0) {
    const c = el(`<div class="card" style="margin-top:16px;"><div class="empty-state">Aucune question répondue pour l'instant. Lancez une séance d'entraînement pour voir apparaître vos statistiques ici.</div></div>`);
    container.appendChild(c);
  } else {
    // À renforcer : les 3 thématiques les plus faibles (au moins 1 question répondue)
    const weak = worked.map(t => Object.assign({}, t, { p: Math.round(t.correct / t.total * 100) })).filter(t => t.p < 80).sort((x, y) => x.p - y.p).slice(0, 3);
    if (weak.length) {
      container.appendChild(el(`<div class="section-title">À renforcer en priorité</div>`));
      const wg = el(`<div class="theme-grid"></div>`);
      weak.forEach(t => {
        const tile = el(`<div class="theme-tile" role="button" tabindex="0"><span class="tn">${esc(themeLabel(t.theme))}</span>
          <span class="bar-outer" style="display:block;"><span class="bar-inner ${progressBarClass(t.p)}" style="width:${t.p}%"></span></span>
          <div class="tm"><span>${t.correct} / ${t.total} · ${t.p} %</span><span class="tgo">Réviser →</span></div></div>`);
        tile.onclick = () => quickStartTheme(themeLevel(t.theme), t.theme);
        wg.appendChild(tile);
      });
      container.appendChild(wg);
    }
    // Détail par fonction
    const levelsSeen = [];
    byTheme.forEach(t => { const l = themeLevel(t.theme); if (levelsSeen.indexOf(l) < 0) levelsSeen.push(l); });
    levelsSeen.sort((x, y) => HOME_LEVEL_ORDER.indexOf(x) - HOME_LEVEL_ORDER.indexOf(y));
    levelsSeen.forEach(l => {
      container.appendChild(el(`<div class="section-title">Détail — ${esc(niveauShortLabel(l))}</div>`));
      const card2 = el(`<div class="card"></div>`);
      byTheme.filter(t => themeLevel(t.theme) === l).sort((x, y) => themeLabel(x.theme).localeCompare(themeLabel(y.theme))).forEach(st => {
        const p = st.total ? Math.round(st.correct / st.total * 100) : 0;
        card2.appendChild(el(`<div class="theme-row">
          <span class="name">${esc(themeLabel(st.theme))}</span>
          <span class="bar-outer"><span class="bar-inner ${progressBarClass(p)}" style="width:${p}%"></span></span>
          <span class="pct">${p}%</span>
        </div>`));
      });
      container.appendChild(card2);
    });
  }

  const actions = el(`<div class="page-actions"></div>`);
  const btn = el(`<button class="btn">Lancer une nouvelle séance</button>`);
  btn.onclick = goToHome;
  actions.appendChild(btn);
  const pdfBtn = el(`<button class="btn secondary">Imprimer / enregistrer mon relevé (PDF)</button>`);
  pdfBtn.onclick = () => printProgressReport(byTheme, ov, pct);
  actions.appendChild(pdfBtn);
  container.appendChild(actions);

  return container;
}

async function goToSuiviPedago() {

  render();

    rpc("app_list_secouristes", { p_token: state.auth.token }),
    rpc("app_formateur_training_overview", { p_token: state.auth.token }),
    rpc("app_formateur_fma_overview", { p_token: state.auth.token }),

  ]);

  } else {
    state.suiviPedago = { error: true };
  }
  render();

// Calcule, pour chaque secouriste, les indicateurs du tableau de bord.
function computeSuiviRows(data) {
  const now = Date.now();
  const ov = data.overview;
  const prog = {};
  if (ov) ov.progress.forEach(p => { prog[p.account_id + "::" + p.submodule_id] = p.status; });
  const fma = data.fma;
  const fprog = {};
  if (fma) fma.progress.forEach(p => { fprog[p.account_id + "::" + p.submodule_id] = p.status; });
  return data.secouristes.map(x => {
    const total = x.total || 0, correct = x.correct || 0;
    const pct = total ? Math.round(correct / total * 100) : null;
    const days = x.last_activity ? Math.floor((now - new Date(x.last_activity).getTime()) / 86400000) : null;
    let fiPct = null;
    if (ov) {
      const rank = NIVEAU_RANK[x.niveau] != null ? NIVEAU_RANK[x.niveau] : 1;
      let n = 0, v = 0;
      ov.structure.forEach(m => m.submodules.forEach(sm => {
        if ((NIVEAU_RANK[sm.level] != null ? NIVEAU_RANK[sm.level] : 0) <= rank) {
          n++; if (prog[x.id + "::" + sm.id] === "valide") v++;
        }
      }));
      fiPct = n ? Math.round(v / n * 100) : null;
    }
    let fmaPct = null;
    if (fma) {
      const rank = NIVEAU_RANK[x.niveau] != null ? NIVEAU_RANK[x.niveau] : 1;
      let n = 0, v = 0;
      fma.structure.forEach(m => m.submodules.forEach(sm => {
        if ((NIVEAU_RANK[sm.level] != null ? NIVEAU_RANK[sm.level] : 0) <= rank) {
          n++; if (fprog[x.id + "::" + sm.id] === "valide") v++;
        }
      }));
      fmaPct = n ? Math.round(v / n * 100) : null;
    }
    const flags = [];
    if (total === 0) flags.push({ k: "jamais", t: "Jamais entraîné" });
    else if (days !== null && days >= 30) flags.push({ k: "inactif", t: "Inactif depuis " + days + " jours" });
    if (total >= 10 && pct !== null && pct < 50) flags.push({ k: "difficulte", t: "Réussite " + pct + " %" });
    if (fiPct !== null && fiPct < 25) flags.push({ k: "formation", t: "Formation initiale " + fiPct + " %" });
    return Object.assign({}, x, { pct, days, fiPct, fmaPct, flags });
  });
}

function exportSuiviCsv(rows) {
  const head = ["Nom", "E-mail", "Fonction", "Réponses", "Réussite %", "Dernière activité", "Formation initiale %", "Recyclage FMA %", "Alertes"];
  const lines = [head].concat(rows.map(r => [
    r.full_name, r.email, niveauShortLabel(r.niveau), r.total, r.pct == null ? "" : r.pct,
    r.last_activity ? new Date(r.last_activity).toLocaleDateString("fr-FR") : "",
    r.fiPct == null ? "" : r.fiPct, r.fmaPct == null ? "" : r.fmaPct, r.flags.map(f => f.t).join(" ; ")
  ]));
  const csv = "﻿" + lines.map(l => l.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "suivi-pedagogique-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

  const container = el(`<div class="staff-wide"></div>`);

  const base = all.filter(r => ui.niveau === "all" || r.niveau === ui.niveau);

  const avgFi = fiVals.length ? Math.round(fiVals.reduce((a, b) => a + b, 0) / fiVals.length) : null;

  const watchAll = base.filter(r => r.flags.length);

  // À surveiller

function renderFormateur() {
  const container = el(`<div class="staff-wide"></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("chart", {color: "indigo"})}<div><div class="page-title">Mes statistiques</div><div class="page-sub">Suivi de progression des secouristes, en lecture seule.</div></div></div>`));

  if (state.secouristes === "loading") {
    container.appendChild(el(`<div class="card"><div class="empty-state">Chargement de la liste des secouristes…</div></div>`));
    return container;
  }
  if (!state.secouristes || state.secouristes.error) {
    const c = el(`<div class="card"><div class="empty-state">Impossible de charger la liste pour le moment.</div></div>`);
    const retry = el(`<button class="btn block">Réessayer</button>`);
    retry.onclick = goToFormateur;
    c.appendChild(retry);
    container.appendChild(c);
    return container;
  }

  const list = state.secouristes;
  const totalAttempts = list.reduce((s, x) => s + x.total, 0);
  const totalCorrect = list.reduce((s, x) => s + x.correct, 0);
  const overallPct = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;
  const activeCount = list.filter(x => x.total > 0).length;

  container.appendChild(el(`<div class="kpi-strip" style="margin-bottom:16px;">
    <div class="kpi teal"><div class="kv">${list.length}</div><div class="kl">Comptes secouristes</div></div>
    <div class="kpi indigo"><div class="kv">${activeCount}</div><div class="kl">Ayant déjà pratiqué</div></div>
    <div class="kpi good"><div class="kv">${totalAttempts ? overallPct + "%" : "—"}</div><div class="kl">Taux de réussite moyen</div></div>
  </div>`));

  // Thèmes à renforcer sur l'ensemble des secouristes (au moins 10 réponses cumulées).
  (function () {
    const agg = {};
    list.forEach(x => (x.by_theme || []).forEach(t => {
      if (!agg[t.theme]) agg[t.theme] = { total: 0, correct: 0, learners: 0 };
      agg[t.theme].total += t.total; agg[t.theme].correct += t.correct; agg[t.theme].learners += 1;
    }));
    const weak = Object.keys(agg).filter(k => agg[k].total >= 10)
      .map(k => ({ id: k, pct: Math.round(agg[k].correct / agg[k].total * 100), total: agg[k].total, learners: agg[k].learners }))
      .sort((a, b) => a.pct - b.pct).slice(0, 5);
    if (!weak.length) return;
    const c = el(`<div class="card" style="margin-top:16px;"><h3 style="margin:0 0 10px;">Thèmes à renforcer (tous secouristes)</h3></div>`);
    weak.forEach(w => {
      c.appendChild(el(`<div class="theme-row"><span class="name">${esc(themeLabel(w.id))} <span style="font-size:11px;color:var(--text-muted);">· ${w.learners} secouriste${w.learners > 1 ? "s" : ""}, ${w.total} réponses</span></span><span class="bar-outer"><span class="bar-inner ${progressBarClass(w.pct)}" style="width:${w.pct}%"></span></span><span class="pct">${w.pct}%</span></div>`));
    });
    container.appendChild(c);
  })();

  if (list.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Aucun secouriste n'a encore créé de compte. Partagez-leur le lien de l'application pour qu'ils s'inscrivent.</div></div>`));
    return container;
  }

  // 29/08/2026 : page recentrée sur les statistiques pures (lecture seule) — les réglages de compte
  // (fonction, difficulté recommandée, qualifications) ont été déplacés vers "Gestion du personnel",
  // à la demande du porteur de projet, pour ne pas mélanger pilotage de compte et suivi de progression.
  const tableWrap = el(`<div class="stats-table-wrap"><table class="stats-table">
    <thead><tr>
      <th>Secouriste</th><th>Fonction</th><th>Progression</th><th></th>
    </tr></thead>
    <tbody></tbody>
  </table></div>`);
  const tbody = tableWrap.querySelector("tbody");
  list.forEach(sr => appendStatsRow(tbody, sr));
  container.appendChild(tableWrap);

  return container;
}

// 29/08/2026 : passage de "Mes statistiques" en tableau (demande du porteur de projet — la vue en
// cartes empilées, avec tous les contrôles toujours dépliés, devenait lourde à parcourir dès qu'il y a
// plusieurs secouristes). Un seul en-tête de tableau, une ligne compacte par secouriste, et le détail
// (progression par thématique + actions) se déplie au clic plutôt que d'être toujours affiché.
// Recentré sur les statistiques pures le 29/08/2026 (suite) : les réglages de compte (fonction,
// difficulté, qualifications) ont été déplacés vers "Gestion du personnel" — voir appendPersonnelRow.
function appendStatsRow(tbody, sr) {
  const pct = sr.total ? Math.round(sr.correct / sr.total * 100) : null;
  const expanded = state.statsExpandedId === sr.id;

  const row = elRow(`<tr class="stats-row"></tr>`);
  row.appendChild(elCell(`<td class="who-cell" style="cursor:pointer;">
    <div class="name">${esc(sr.full_name)}</div>
    <div class="email">${esc(sr.email)}</div>
  </td>`));
  row.appendChild(elCell(`<td>${esc(niveauShortLabel(sr.niveau))}</td>`));

  const progTd = elCell(`<td style="white-space:nowrap;"></td>`);
  if (pct === null) {
    progTd.appendChild(el(`<span style="color:var(--text-muted);font-size:12.5px;">Pas encore pratiqué</span>`));
  } else {
    progTd.appendChild(el(`<span class="mini-bar-outer" style="margin-right:8px;"><span class="mini-bar-inner ${progressBarClass(pct)}" style="width:${pct}%;"></span></span><span style="font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;">${pct}%</span> <span style="color:var(--text-muted);font-size:11.5px;">(${sr.total})</span>`));
  }
  row.appendChild(progTd);

  const expandTd = elCell(`<td style="text-align:right;"></td>`);
  const expandBtn = el(`<button class="expand-btn">${expanded ? "Réduire ▴" : "Détails ▾"}</button>`);
  expandTd.appendChild(expandBtn);
  row.appendChild(expandTd);

  const toggleExpand = () => { state.statsExpandedId = expanded ? null : sr.id; render(); };
  row.querySelector(".who-cell").onclick = toggleExpand;
  expandBtn.onclick = toggleExpand;

  tbody.appendChild(row);

  if (expanded) {
    const detailRow = elRow(`<tr class="stats-detail-row"><td colspan="4"></td></tr>`);
    const cell = detailRow.querySelector("td");
    if (sr.by_theme && sr.by_theme.length) {
      const themesWrap = el(`<div style="margin-bottom:14px;"></div>`);
      sr.by_theme.slice().sort((a, b) => themeLabel(a.theme).localeCompare(themeLabel(b.theme))).forEach(st => {
        const p = Math.round(st.correct / st.total * 100);
        themesWrap.appendChild(el(`<div class="theme-row">
          <span class="name">${esc(themeLabel(st.theme))}</span>
          <span class="bar-outer"><span class="bar-inner ${progressBarClass(p)}" style="width:${p}%"></span></span>
          <span class="pct">${p}%</span>
        </div>`));
      });
      cell.appendChild(themesWrap);
    } else {
      cell.appendChild(el(`<p class="help" style="margin:0 0 14px;">Pas encore de progression par thématique.</p>`));
    }
    const actionsRow = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;"></div>`);
    const trainBtn = el(`<button class="btn secondary">Suivi de formation initiale</button>`);
    trainBtn.onclick = () => goToLearnerTraining(sr.id);
    actionsRow.appendChild(trainBtn);
    const parcoursBtn = el(`<button class="btn secondary">Mon parcours</button>`);
    parcoursBtn.onclick = () => goToLearnerParcours(sr.id);
    actionsRow.appendChild(parcoursBtn);
    cell.appendChild(actionsRow);
    tbody.appendChild(detailRow);
  }
}

/* ============================================================
   AUTO-FORMATION (lot 2, 24/11/2026) — l'apprenant avance seul, module par module, avec un quiz noté
   côté serveur (seuil 80 %, reprises illimitées). "Terminé" = quiz réussi (automatique) ; "Validé" =
   décision du formateur (table training_progress, inchangée). Parcours "Bases" recommandé, jamais
   bloquant. Les modules courts sont verrouillés dans l'ordre. Chapitre pilote : Urgences vitales.
   ============================================================ */
const SS = {
  data: null,        // null | "loading" | { niveau, modules } | { error }
  quiz: null,        // null | { moduleId, submoduleId, title, questions, idx, answers, busy, error, result }
  track: null,       // null | "loading" | { modules, learners, attempts, progress } | { error }
  trackFilter: "all",
  trackOpen: null,   // id d'apprenant dont le détail est ouvert
  trackBusy: false,
  msg: null
};

async function goToSelfStudy() {
  state.view = "selfStudy";
  SS.quiz = null; SS.msg = null;
  SS.data = "loading";
  render();
  const r = await rpc("app_selfstudy_overview", { p_token: state.auth.token });
  SS.data = (r && r.modules) ? r : { error: true };
  render();
}

async function goToSelfStudyTrack() {
  state.view = "selfStudyTrack";
  SS.track = "loading"; SS.msg = null;
  render();
  const r = await rpc("app_formateur_selfstudy_overview", { p_token: state.auth.token });
  SS.track = (r && r.modules) ? r : { error: true };
  render();
}

function ssPct(score, total) { return total ? Math.round(score / total * 100) : 0; }

async function ssStartQuiz(moduleId, submoduleId, title) {
  SS.msg = null;
  const r = await rpc("app_selfstudy_start_quiz", { p_token: state.auth.token, p_module_id: moduleId, p_submodule_id: submoduleId || null });
  if (!r || !r.ok) {
    const map = { locked: "Terminez d'abord le module précédent.", no_questions: "Le quiz de ce module n'est pas encore disponible.", not_found: "Module introuvable.", invalid_session: "Session expirée, reconnectez-vous." };
    SS.msg = (r && map[r.error]) || (r && r.message) || "Impossible de démarrer le quiz.";
    render();
    return;
  }
  const answers = {};
  r.questions.forEach(q => {
    if (q.type === "order") answers[q.id] = (q.items || []).map(x => x.i);
  });
  SS.quiz = { moduleId, submoduleId: submoduleId || null, title, questions: r.questions, idx: 0, answers, busy: false, error: null, result: null };
  render();
}

function ssAnswered(q) {
  const a = SS.quiz.answers[q.id];
  if (q.type === "short") return typeof a === "string" && a.trim() !== "";
  if (q.type === "order") return Array.isArray(a) && a.length > 0;
  return Array.isArray(a) && a.length > 0;
}

async function ssSubmitQuiz() {
  const z = SS.quiz;
  if (!z || z.busy) return;
  z.busy = true; z.error = null; render();
  const answers = z.questions.map(q => ({ id: q.id, answer: z.answers[q.id] === undefined ? null : z.answers[q.id] }));
  const r = await rpc("app_selfstudy_submit_quiz", { p_token: state.auth.token, p_module_id: z.moduleId, p_submodule_id: z.submoduleId, p_answers: answers });
  z.busy = false;
  if (!r || !r.ok) {
    z.error = (r && r.error === "locked") ? "Terminez d'abord le module précédent." : ((r && r.message) || "Envoi impossible. Réessayez.");
    render();
    return;
  }
  z.result = r;
  render();
}

async function ssMarkRead(moduleId, submoduleId) {
  const r = await rpc("app_selfstudy_mark_read", { p_token: state.auth.token, p_module_id: moduleId, p_submodule_id: submoduleId });
  if (!r || !r.ok) { SS.msg = (r && r.error === "locked") ? "Terminez d'abord le module précédent." : ((r && r.message) || "Action impossible."); render(); return; }
  goToSelfStudy();
}

function ssStatusPill(sm) {
  if (sm.validated) return '<span class="pill ok" style="background:var(--blue);color:#fff;">Validé par le formateur</span>';
  if (sm.passed) return '<span class="pill ok">Terminé</span>' + (sm.question_count === 0 ? ' <span class="pill">sans quiz</span>' : "");
  if (sm.locked) return '<span class="pill">🔒 Verrouillé</span>';
  if (sm.attempts > 0) return '<span class="pill warn">Quiz à repasser</span>';
  return '<span class="pill">À faire</span>';
}

function renderSelfStudy() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("cap", {color: "teal"})}<div><div class="page-title">Auto-formation</div><div class="page-sub">Avancez à votre rythme : lisez chaque fiche, puis réussissez le quiz (80 % minimum) pour terminer le module.</div></div></div>`));

  if (SS.quiz) { container.appendChild(renderSelfStudyQuiz()); return container; }

  if (SS.data === "loading" || SS.data === null) { container.appendChild(el(`<div class="card"><div class="empty-state">Chargement…</div></div>`)); return container; }
  if (SS.data.error) { container.appendChild(el(`<div class="card"><div class="empty-state">Auto-formation indisponible pour le moment.</div></div>`)); return container; }
  if (!SS.data.modules.length) { container.appendChild(el(`<div class="card"><div class="empty-state">Aucun module d'auto-formation n'est encore disponible pour votre niveau.</div></div>`)); return container; }

  if (SS.msg) container.appendChild(el(`<div class="card" style="border-left:3px solid var(--critical);"><div class="help" style="color:var(--critical);">${esc(SS.msg)}</div></div>`));

  SS.data.modules.forEach(m => {

    const card = el(`<div class="card accent-teal">
      <div class="mod-head"><h3>${esc(m.label)}</h3><span class="help">${done}/${total} terminés</span></div>
      <span class="bar-outer" style="display:block;"><span class="bar-inner ${progressBarClass(pct)}" style="width:${pct}%"></span></span>
    </div>`);

    // Parcours "Bases" : recommandé, non bloquant
    const b = m.bases || {};
    const basesRow = el(`<div class="mod-row" style="margin-top:12px;border:1px dashed var(--border);border-radius:10px;padding:10px;">
      <div class="mr-top"><span><b>Parcours « Bases »</b> <span class="help">· lecture guidée des ${total} fiches puis quiz de synthèse (10 questions)</span></span>
      <span>${b.done ? '<span class="pill ok">Terminé</span>' : '<span class="pill">Recommandé pour démarrer</span>'}</span></div>
      ${b.attempts ? `<div class="help" style="margin-top:4px;">${b.done ? "Meilleur score : " + b.best_score + "/" + b.best_total : "Tentatives : " + b.attempts}${b.last_at ? " · dernière le " + fmtDateFR(b.last_at) : ""}</div>` : ""}
    </div>`);
    const readDet = el(`<details style="margin-top:8px;"><summary style="font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;">Lire les fiches du chapitre</summary><div style="margin-top:6px;"></div></details>`);
    const readBody = readDet.querySelector("div");
    m.submodules.forEach((sm, i) => {
      if (!sm.content) return;
      readBody.appendChild(el(`<div style="margin-bottom:10px;"><div style="font-weight:700;font-size:13px;">${i + 1}. ${esc(sm.label)}</div><div class="help" style="white-space:pre-wrap;line-height:1.5;margin-top:3px;">${esc(sm.content)}</div></div>`));
    });
    basesRow.appendChild(readDet);
    const bBtn = el(`<button class="btn secondary" style="margin-top:8px;font-size:12px;padding:6px 12px;">${b.done ? "Refaire le quiz de synthèse" : "Passer le quiz de synthèse"}</button>`);
    bBtn.onclick = () => ssStartQuiz(m.id, null, m.label + " — Bases");
    basesRow.appendChild(bBtn);
    card.appendChild(basesRow);

    // Modules courts, dans l'ordre
    const list = el(`<div style="margin-top:12px;"></div>`);
    m.submodules.forEach((sm, i) => {
      const row = el(`<div class="mod-row" ${sm.locked ? 'style="opacity:.7;"' : ""}>
        <div class="mr-top"><span><b>${i + 1}.</b> ${esc(sm.label)}</span><span>${ssStatusPill(sm)}</span></div>
      </div>`);
      if (sm.attempts > 0 && sm.best_total) row.appendChild(el(`<div class="help" style="margin-top:3px;">Meilleur score : ${sm.best_score}/${sm.best_total} (${ssPct(sm.best_score, sm.best_total)} %) · ${sm.attempts} tentative${sm.attempts > 1 ? "s" : ""}${sm.last_at ? " · dernière le " + fmtDateFR(sm.last_at) : ""}</div>`));
      if (sm.locked) {
        row.appendChild(el(`<div class="help" style="margin-top:3px;">Se débloque quand le module précédent est terminé.</div>`));
      } else {
        const cb = renderSubmoduleContentBlock(sm.content);
        if (cb) row.appendChild(cb);
        if (!sm.done || sm.question_count > 0) {
          if (sm.question_count > 0) {
            const qb = el(`<button class="btn" style="margin-top:8px;font-size:12px;padding:6px 12px;">${sm.passed ? "Refaire le quiz" : (sm.attempts > 0 ? "Repasser le quiz" : "Passer le quiz")} (${sm.question_count} question${sm.question_count > 1 ? "s" : ""})</button>`);
            qb.onclick = () => ssStartQuiz(m.id, sm.id, sm.label);
            row.appendChild(qb);
          } else if (!sm.done) {
            row.appendChild(el(`<div class="help" style="margin-top:3px;">Le quiz de ce module n'est pas encore disponible.</div>`));
            const rb = el(`<button class="btn secondary" style="margin-top:8px;font-size:12px;padding:6px 12px;">J'ai lu cette fiche</button>`);
            rb.onclick = () => ssMarkRead(m.id, sm.id);
            row.appendChild(rb);
          }
        }
      }
      list.appendChild(row);
    });
    card.appendChild(list);
    container.appendChild(card);
  });
  return container;
}

function ssQuestionText(q) { return q.type === "order" ? (q.scenario || q.q || "") : (q.q || ""); }

function renderSelfStudyQuiz() {
  const z = SS.quiz;
  const wrap = el(`<div></div>`);
  const back = el(`<button class="btn secondary" style="margin-bottom:10px;font-size:12px;padding:6px 12px;">← Retour au parcours</button>`);
  back.onclick = () => { SS.quiz = null; goToSelfStudy(); };
  wrap.appendChild(back);

  if (z.result) { wrap.appendChild(renderSelfStudyResult()); return wrap; }

  const q = z.questions[z.idx];
  const last = z.idx === z.questions.length - 1;
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="mod-head"><h3>${esc(z.title)}</h3><span class="help">Question ${z.idx + 1} / ${z.questions.length}</span></div>`));
  const pct = Math.round(z.idx / z.questions.length * 100);
  card.appendChild(el(`<span class="bar-outer" style="display:block;margin-bottom:10px;"><span class="bar-inner" style="width:${pct}%"></span></span>`));
  if (q.media && q.media.length && typeof renderQuestionMedia === "function") { const mm = renderQuestionMedia(q.media); if (mm) card.appendChild(mm); }
  card.appendChild(el(`<div style="font-weight:600;font-size:14.5px;margin:6px 0 10px;white-space:pre-wrap;">${esc(ssQuestionText(q))}</div>`));
  if (q.type === "order") card.appendChild(el(`<div class="help" style="margin-bottom:6px;">Remettez les actions dans le bon ordre avec les flèches.</div>`));
  if (q.type === "qcm" && q.multi) card.appendChild(el(`<div class="help" style="margin-bottom:6px;">Plusieurs réponses possibles.</div>`));

  const body = el(`<div></div>`);
  const cur = z.answers[q.id];
  if (q.type === "qcm" || q.type === "vf") {
    (q.choices || []).forEach((c, i) => {
      const checked = Array.isArray(cur) && cur.indexOf(i) >= 0;
      const row = el(`<label style="display:flex;gap:8px;align-items:flex-start;padding:8px 10px;margin:0 0 6px;border:1px solid ${checked ? "var(--blue)" : "var(--border)"};border-radius:10px;cursor:pointer;background:${checked ? "var(--surface-1)" : "transparent"};"><input type="${q.multi ? "checkbox" : "radio"}" name="ssq" ${checked ? "checked" : ""} style="margin-top:3px;"><span>${esc(c)}</span></label>`);
      row.querySelector("input").onchange = () => {
        if (q.multi) {
          const a = Array.isArray(z.answers[q.id]) ? z.answers[q.id].slice() : [];
          const p = a.indexOf(i);
          if (p >= 0) a.splice(p, 1); else a.push(i);
          z.answers[q.id] = a;
        } else {
          z.answers[q.id] = [i];
        }
        z.error = null; render();
      };
      body.appendChild(row);
    });
  } else if (q.type === "short") {
    const inp = el(`<input type="text" id="ssShort" autocomplete="off" placeholder="Votre réponse" style="width:100%;" value="${esc(typeof cur === "string" ? cur : "")}">`);
    inp.oninput = () => { z.answers[q.id] = inp.value; z.error = null; };
    body.appendChild(inp);
  } else if (q.type === "order") {
    const textOf = {};
    (q.items || []).forEach(x => { textOf[x.i] = x.t; });
    const ord = Array.isArray(cur) ? cur : (q.items || []).map(x => x.i);
    ord.forEach((idx, pos) => {
      const row = el(`<div style="display:flex;gap:8px;align-items:center;padding:8px 10px;margin:0 0 6px;border:1px solid var(--border);border-radius:10px;"><span style="font-weight:700;min-width:18px;">${pos + 1}</span><span style="flex:1;">${esc(textOf[idx])}</span></div>`);
      const up = el(`<button class="btn secondary" style="padding:2px 9px;font-size:13px;" aria-label="Monter" ${pos === 0 ? "disabled" : ""}>↑</button>`);
      const dn = el(`<button class="btn secondary" style="padding:2px 9px;font-size:13px;" aria-label="Descendre" ${pos === ord.length - 1 ? "disabled" : ""}>↓</button>`);
      const swap = (a, b) => { const n = ord.slice(); const t = n[a]; n[a] = n[b]; n[b] = t; z.answers[q.id] = n; render(); };
      up.onclick = () => swap(pos, pos - 1);
      dn.onclick = () => swap(pos, pos + 1);
      row.appendChild(up); row.appendChild(dn);
      body.appendChild(row);
    });
  }
  card.appendChild(body);
  if (z.error) card.appendChild(el(`<div class="help" style="color:var(--critical);margin-top:6px;">${esc(z.error)}</div>`));

  const nav = el(`<div class="actions-row" style="margin-top:12px;"></div>`);
  if (z.idx > 0) {
    const prev = el(`<button class="btn secondary">Précédente</button>`);
    prev.onclick = () => { z.idx--; z.error = null; render(); };
    nav.appendChild(prev);
  }
  const nxt = el(`<button class="btn" ${z.busy ? "disabled" : ""}>${last ? (z.busy ? "Correction…" : "Terminer le quiz") : "Suivante"}</button>`);
  nxt.onclick = () => {
    if (!ssAnswered(q)) { z.error = "Répondez à la question avant de continuer."; render(); return; }
    if (!last) { z.idx++; z.error = null; render(); return; }
    const missing = z.questions.findIndex(x => !ssAnswered(x));
    if (missing >= 0) { z.idx = missing; z.error = "Il reste une question sans réponse."; render(); return; }
    ssSubmitQuiz();
  };
  nav.appendChild(nxt);
  card.appendChild(nav);
  wrap.appendChild(card);
  return wrap;
}

function ssCorrectText(q, r) {
  if (q.type === "qcm" || q.type === "vf") return (r.correct || []).map(i => (q.choices || [])[i]).filter(Boolean).join(" · ");
  if (q.type === "short") return (r.correct || []).join(" / ");
  if (q.type === "order") return (r.correct || []).map((t, i) => (i + 1) + ". " + t).join("  ");
  return "";
}

function renderSelfStudyResult() {
  const z = SS.quiz, r = z.result;
  const pct = ssPct(r.score, r.total);
  const card = el(`<div class="card ${r.passed ? "accent-teal" : ""}">
    <div class="mod-head"><h3>${esc(z.title)}</h3>${r.passed ? '<span class="pill ok">Module terminé</span>' : '<span class="pill warn">Seuil non atteint</span>'}</div>
    <div style="font-size:26px;font-weight:800;margin:6px 0;">${r.score}/${r.total} <span class="help">(${pct} %)</span></div>
    <div class="help">${r.passed ? "Bravo, le module est terminé. Votre formateur pourra le valider." : "Il faut au moins " + r.threshold + " % de bonnes réponses. Relisez la fiche puis repassez le quiz : les reprises sont illimitées."}</div>
  </div>`);
  const byId = {};
  (r.results || []).forEach(x => { byId[x.id] = x; });
  z.questions.forEach((q, i) => {
    const x = byId[q.id];
    if (!x) return;
    const ok = x.ok;
    const row = el(`<div class="mod-row" style="margin-top:8px;"><div class="mr-top"><span><b>${i + 1}.</b> ${esc(ssQuestionText(q))}</span><span class="pill ${ok ? "ok" : "warn"}">${ok ? "Juste" : "À revoir"}</span></div>
      ${ok ? "" : `<div class="help" style="margin-top:4px;"><b>Bonne réponse :</b> ${esc(ssCorrectText(q, x))}</div>`}
      ${x.explanation ? `<div class="help" style="margin-top:4px;white-space:pre-wrap;">${esc(x.explanation)}</div>` : ""}</div>`);
    card.appendChild(row);
  });
  const act = el(`<div class="actions-row" style="margin-top:12px;"></div>`);
  if (!r.passed) {
    const again = el(`<button class="btn">Repasser le quiz</button>`);
    again.onclick = () => ssStartQuiz(z.moduleId, z.submoduleId, z.title);
    act.appendChild(again);
  }
  const done = el(`<button class="btn secondary">Retour au parcours</button>`);
  done.onclick = () => { SS.quiz = null; goToSelfStudy(); };
  act.appendChild(done);
  card.appendChild(act);
  return card;
}

/* ---------- Suivi formateur ---------- */
async function ssSetValidation(learnerId, submoduleId, status) {
  if (SS.trackBusy) return;
  SS.trackBusy = true;
  const r = await rpc("app_formateur_set_progress", { p_token: state.auth.token, p_target_id: learnerId, p_submodule_id: submoduleId, p_status: status });
  SS.trackBusy = false;
  if (!r || !r.ok) { SS.msg = (r && r.message) || "Action impossible."; render(); return; }
  const r2 = await rpc("app_formateur_selfstudy_overview", { p_token: state.auth.token });
  if (r2 && r2.modules) SS.track = r2;
  render();
}

function renderSelfStudyTrack() {
  const container = el(`<div></div>`);
  container.appendChild(el(`<div class="page-header">${iconChip("users", {color: "teal"})}<div><div class="page-title">Suivi de l'auto-formation</div><div class="page-sub">Modules terminés automatiquement (quiz réussi) et validation par le formateur.</div></div></div>`));
  const t = SS.track;
  if (t === "loading" || t === null) { container.appendChild(el(`<div class="card"><div class="empty-state">Chargement…</div></div>`)); return container; }
  if (t.error) { container.appendChild(el(`<div class="card"><div class="empty-state">Suivi indisponible pour le moment.</div></div>`)); return container; }
  if (SS.msg) container.appendChild(el(`<div class="card" style="border-left:3px solid var(--critical);"><div class="help" style="color:var(--critical);">${esc(SS.msg)}</div></div>`));

  const attBySub = {}, basesByMod = {}, validated = {};
  t.attempts.forEach(a => {
    if (a.kind === "bases") basesByMod[a.account_id + "::" + a.module_id] = a;
    else if (a.submodule_id) {
      const k = a.account_id + "::" + a.submodule_id;
      const prev = attBySub[k];
      attBySub[k] = prev ? { attempts: prev.attempts + a.attempts, passed: prev.passed || a.passed, best_score: Math.max(prev.best_score, a.best_score), best_total: Math.max(prev.best_total, a.best_total), last_at: prev.last_at > a.last_at ? prev.last_at : a.last_at, kind: prev.kind } : a;
    }
  });
  t.progress.forEach(p => { if (p.status === "valide") validated[p.account_id + "::" + p.submodule_id] = true; });

  const nowMs = Date.now();
  const rows = t.learners.map(l => {
    let done = 0, valid = 0, toValidate = 0, total = 0;
    t.modules.forEach(m => m.submodules.forEach(sm => {
      total++;
      const a = attBySub[l.id + "::" + sm.id];
      const isV = !!validated[l.id + "::" + sm.id];
      if (isV) valid++;
      if ((a && a.passed) || isV) done++;
      if (a && a.passed && !isV) toValidate++;
    }));
    const bases = t.modules.some(m => { const b = basesByMod[l.id + "::" + m.id]; return b && b.passed; });
    const last = l.last_activity ? new Date(l.last_activity).getTime() : null;
    const idle = (last === null) || ((nowMs - last) > 14 * 86400000);
    return { l, done, valid, toValidate, total, bases, idle, hasStarted: last !== null };
  });
  const cWait = rows.filter(r => r.toValidate > 0).length;
  const cIdle = rows.filter(r => r.idle).length;

  const bar = el(`<div class="card" style="padding:10px 14px;"><div style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>`);
  const barIn = bar.firstChild;
  [["all", "Tous (" + rows.length + ")"], ["wait", "À valider (" + cWait + ")"], ["idle", "Sans activité 14 j (" + cIdle + ")"]].forEach(([k, lab]) => {
    const b = el(`<button class="btn ${SS.trackFilter === k ? "" : "secondary"}" style="font-size:12px;padding:6px 12px;">${esc(lab)}</button>`);
    b.onclick = () => { SS.trackFilter = k; render(); };
    barIn.appendChild(b);
  });
  container.appendChild(bar);

  const shown = rows.filter(r => SS.trackFilter === "all" || (SS.trackFilter === "wait" && r.toValidate > 0) || (SS.trackFilter === "idle" && r.idle));
  if (!shown.length) { container.appendChild(el(`<div class="card"><div class="empty-state">Aucun apprenant dans cette liste.</div></div>`)); return container; }

  shown.forEach(r => {
    const open = SS.trackOpen === r.l.id;
    const card = el(`<div class="card"><div class="mod-head" style="cursor:pointer;"><div><b>${esc(r.l.full_name)}</b> <span class="help">${esc(r.l.niveau || "")}</span><div class="help">Dernière activité : ${r.l.last_activity ? fmtDateFR(r.l.last_activity) : "aucune"}</div></div>
      <div style="text-align:right;"><div class="help">${r.bases ? "Bases ✓" : "Bases –"} · ${r.done}/${r.total} terminés · ${r.valid} validés</div>${r.toValidate > 0 ? `<span class="pill warn" style="background:#FAEEDA;color:#633806;">${r.toValidate} à valider</span>` : ""}</div></div></div>`);
    card.querySelector(".mod-head").onclick = () => { SS.trackOpen = open ? null : r.l.id; render(); };
    if (open) {
      t.modules.forEach(m => {
        card.appendChild(el(`<div style="font-weight:700;font-size:13px;margin:10px 0 4px;">${esc(m.label)}</div>`));
        m.submodules.forEach(sm => {
          const a = attBySub[r.l.id + "::" + sm.id];
          const isV = !!validated[r.l.id + "::" + sm.id];
          const pill = isV ? '<span class="pill ok" style="background:var(--blue);color:#fff;">Validé</span>' : (a && a.passed ? '<span class="pill ok">Terminé</span>' : (a ? '<span class="pill warn">Quiz non réussi</span>' : '<span class="pill">Non commencé</span>'));
          const score = a && a.best_total ? `${a.best_score}/${a.best_total} · ${a.attempts} essai${a.attempts > 1 ? "s" : ""}` : (a && a.passed ? "lu, sans quiz" : (sm.question_count === 0 ? "pas de quiz" : ""));
          const row = el(`<div class="mod-row"><div class="mr-top"><span>${sm.order_index}. ${esc(sm.label)} <span class="help">${esc(score)}${a && a.last_at ? " · " + fmtDateFR(a.last_at) : ""}</span></span><span style="display:flex;gap:6px;align-items:center;">${pill}</span></div></div>`);
          const holder = row.querySelector(".mr-top > span:last-child");
          const btn = el(`<button class="btn ${isV ? "secondary" : ""}" style="font-size:11.5px;padding:4px 10px;">${isV ? "Retirer la validation" : "Valider"}</button>`);
          btn.onclick = (ev) => { ev.stopPropagation(); ssSetValidation(r.l.id, sm.id, isV ? "a_faire" : "valide"); };
          holder.appendChild(btn);
          card.appendChild(row);
        });
      });
    }
    container.appendChild(card);
  });
  return container;
}

/* ============================================================
   SUIVI DE FORMATION INITIALE (espace "apprenant") — module par module, d'après le référentiel
   national. Statuts fixés manuellement par le formateur, annotations privées ou visibles par
   l'apprenant selon le choix du formateur à chaque annotation.
   ============================================================ */
const TRAINING_STATUS_META = {
  a_faire: { label: "À faire", color: "var(--text-muted)" },
  en_cours: { label: "En cours", color: "var(--warning)" },
  valide: { label: "Validé", color: "var(--good)" }
};

// Bloc de contenu détaillé (issu du référentiel national) d'un sous-module, replié par défaut.
function renderSubmoduleContentBlock(content) {
  if (!content) return null;
  return el(`<details style="margin-top:6px;">
    <summary style="font-size:11.5px;font-weight:700;color:var(--blue);cursor:pointer;">Voir le contenu du référentiel</summary>
    <div class="help" style="margin-top:6px;white-space:pre-wrap;line-height:1.5;">${esc(content)}</div>
  </details>`);
}

async function goToMyTraining() {
  state.view = "myTraining";
  state.myTraining = "loading";
  render();
  const r = await rpc("app_learner_my_training", { p_token: state.auth.token });
  state.myTraining = (r && r.structure) ? r : { error: true };
  render();
}

async function goToMyFma() {
  state.view = "myFma";
  state.myFma = "loading";
  render();
  const r = await rpc("app_learner_my_fma", { p_token: state.auth.token });
  state.myFma = (r && r.structure) ? r : { error: true };
  render();
}

async function goToLearnerTraining(targetId) {
  state.view = "learnerTraining";
  state.learnerTraining = "loading";
  state.annotationForm = { open: false, moduleId: null, submoduleId: null, text: "", visibleToLearner: false, busy: false, error: null };
  render();
  const r = await rpc("app_formateur_get_learner_training", { p_token: state.auth.token, p_target_id: targetId });
  state.learnerTraining = (r && r.structure) ? Object.assign({ targetId }, r) : { error: true };
  render();
}

async function setLearnerProgress(submoduleId, status) {
  const t = state.learnerTraining;
  if (!t || t === "loading") return;
  await rpc("app_formateur_set_progress", { p_token: state.auth.token, p_target_id: t.targetId, p_submodule_id: submoduleId, p_status: status });
  goToLearnerTraining(t.targetId);
}

function openAnnotationForm(moduleId, submoduleId) {
  state.annotationForm = { open: true, moduleId, submoduleId, text: "", visibleToLearner: false, busy: false, error: null };
  render();
}
function closeAnnotationForm() { state.annotationForm.open = false; render(); }

async function submitAnnotation() {
  const f = state.annotationForm;
  const t = state.learnerTraining;
  if (!f.text.trim()) { f.error = "Le texte de l'annotation est obligatoire."; render(); return; }
  f.busy = true; f.error = null; render();
  const r = await rpc("app_formateur_add_annotation", {
    p_token: state.auth.token, p_target_id: t.targetId,
    p_module_id: f.moduleId, p_submodule_id: f.submoduleId,
    p_text: f.text.trim(), p_visible_to_learner: f.visibleToLearner
  });
  if (!r || r.error) { f.busy = false; f.error = "Impossible d'enregistrer l'annotation."; render(); return; }
  await goToLearnerTraining(t.targetId);
}

async function deleteAnnotation(annotationId) {
  const t = state.learnerTraining;
  if (!confirm("Supprimer cette annotation ?")) return;
  await rpc("app_formateur_delete_annotation", { p_token: state.auth.token, p_annotation_id: annotationId });
  goToLearnerTraining(t.targetId);
}

// Rendu commun "Ma formation" / "Recyclage (FMA)" (lecture seule) — Phase 2b
function renderTrainingBody(container, t, emptyMsg) {
  const progressBySub = {};
  t.progress.forEach(p => { progressBySub[p.submodule_id] = p.status; });
  const annotByModule = {}, annotBySub = {};
  t.annotations.forEach(a => {
    if (a.submodule_id) { (annotBySub[a.submodule_id] = annotBySub[a.submodule_id] || []).push(a); }
    else if (a.module_id) { (annotByModule[a.module_id] = annotByModule[a.module_id] || []).push(a); }
  });
  if (t.structure.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">${esc(emptyMsg)}</div></div>`));
    return container;
  }
  let totalSub = 0, totalValid = 0;
  t.structure.forEach(m => { totalSub += m.submodules.length; totalValid += m.submodules.filter(sm => progressBySub[sm.id] === "valide").length; });
  const gp = totalSub ? Math.round(totalValid / totalSub * 100) : 0;
  container.appendChild(el(`<div class="card accent-teal"><div class="mod-head"><h3>Avancement global</h3><span class="help">${totalValid}/${totalSub} validés · ${gp} %</span></div>
    <span class="bar-outer" style="display:block;"><span class="bar-inner ${progressBarClass(gp)}" style="width:${gp}%"></span></span></div>`));

  t.structure.forEach(m => {
    const validCount = m.submodules.filter(sm => progressBySub[sm.id] === "valide").length;
    const mp = m.submodules.length ? Math.round(validCount / m.submodules.length * 100) : 0;
    const card = el(`<div class="card">
      <div class="mod-head"><h3>${esc(m.label)}</h3>${mp === 100 ? '<span class="pill ok">Module validé</span>' : '<span class="help">' + validCount + "/" + m.submodules.length + " validés</span>"}</div>
      <span class="bar-outer" style="display:block;"><span class="bar-inner ${progressBarClass(mp)}" style="width:${mp}%"></span></span>
    </div>`);
    (annotByModule[m.id] || []).forEach(a => {
      card.appendChild(el(`<div class="help" style="margin-top:8px;padding:8px;background:var(--surface-1);border-radius:8px;">💬 ${esc(a.text)}</div>`));
    });
    const list = el(`<div style="margin-top:10px;"></div>`);
    m.submodules.forEach(sm => {
      const status = progressBySub[sm.id] || "a_faire";
      const meta = TRAINING_STATUS_META[status];
      const row = el(`<div class="mod-row"><div class="mr-top"><span>${esc(sm.label)}</span><span style="font-size:11.5px;font-weight:700;color:${meta.color};white-space:nowrap;">● ${meta.label}</span></div></div>`);
      (annotBySub[sm.id] || []).forEach(a => {
        row.appendChild(el(`<div class="help" style="margin-top:4px;padding:6px 8px;background:var(--surface-1);border-radius:7px;">💬 ${esc(a.text)}</div>`));
      });
      const contentBlock = renderSubmoduleContentBlock(sm.content);
      if (contentBlock) row.appendChild(contentBlock);
      list.appendChild(row);
    });
    card.appendChild(list);
    container.appendChild(card);
  });
  return container;
}

// Vue apprenant (lecture seule) : sa progression + uniquement les annotations qui le concernent et
// que le formateur a choisi de rendre visibles.
function renderMyTraining() {
  const container = el(`<div></div>`);

function renderLearnerTraining() {
  const container = el(`<div></div>`);
  const t = state.learnerTraining;

  const backLink = el(`<a style="font-size:12.5px;font-weight:700;color:var(--blue);cursor:pointer;">← Retour à Mes secouristes</a>`);
  backLink.onclick = goToFormateur;
  container.appendChild(backLink);

  if (t === "loading") {
    container.appendChild(el(`<div class="card" style="margin-top:10px;"><div class="empty-state">Chargement…</div></div>`));
    return container;
  }
  if (!t || t.error) {
    container.appendChild(el(`<div class="card" style="margin-top:10px;"><div class="empty-state">Suivi indisponible pour le moment.</div></div>`));
    return container;
  }

  container.appendChild(el(`<div class="page-header">${iconChip("clipboard", {color: "indigo"})}<div><div class="page-title" style="margin-top:8px;">Suivi de formation — ${esc(t.target.full_name)}</div><div class="page-sub">${esc(t.target.email)} · Fonction : ${esc(niveauShortLabel(t.target.niveau))}</div></div></div>`));

  const progressBySub = {};
  t.progress.forEach(p => { progressBySub[p.submodule_id] = p.status; });
  const annotByModule = {}, annotBySub = {};
  t.annotations.forEach(a => {
    if (a.submodule_id) { (annotBySub[a.submodule_id] = annotBySub[a.submodule_id] || []).push(a); }
    else if (a.module_id) { (annotByModule[a.module_id] = annotByModule[a.module_id] || []).push(a); }
  });

  function renderAnnotationList(list) {
    const wrap = el(`<div></div>`);
    list.forEach(a => {
      const row = el(`<div class="help" style="margin-top:6px;padding:8px;background:var(--surface-1);border-radius:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <span>${a.visible_to_learner ? "👁 Visible par l'apprenant" : "🔒 Note privée"} — ${esc(a.text)} <span style="color:var(--text-muted);">(${esc(a.author_name || "formateur")})</span></span>
      </div>`);
      const delBtn = el(`<a style="font-size:11px;color:var(--critical);cursor:pointer;white-space:nowrap;">Supprimer</a>`);
      delBtn.onclick = () => deleteAnnotation(a.id);
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function renderInlineForm(moduleId, submoduleId) {
    const f = state.annotationForm;
    if (!f.open || f.moduleId !== moduleId || f.submoduleId !== submoduleId) return null;
    const box = el(`<div style="margin-top:8px;padding:10px;background:var(--surface-1);border-radius:8px;border:1px solid var(--border);"></div>`);
    const ta = el(`<textarea placeholder="Annotation…" style="width:100%;min-height:60px;font-family:inherit;font-size:13px;padding:8px;border-radius:7px;border:1px solid var(--border);">${esc(f.text)}</textarea>`);
    ta.oninput = (e) => { f.text = e.target.value; };
    box.appendChild(ta);
    const label = el(`<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-top:6px;cursor:pointer;">
      <input type="checkbox" ${f.visibleToLearner ? "checked" : ""}> Visible par l'apprenant (sinon note privée au formateur)
    </label>`);
    label.querySelector("input").onchange = (e) => { f.visibleToLearner = e.target.checked; };
    box.appendChild(label);
    if (f.error) box.appendChild(el(`<div class="empty-state" style="color:var(--critical);margin-top:6px;">${esc(f.error)}</div>`));
    const row = el(`<div style="display:flex;gap:8px;margin-top:8px;"></div>`);
    const saveBtn = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
    saveBtn.onclick = submitAnnotation;
    const cancelBtn = el(`<button class="btn secondary">Annuler</button>`);
    cancelBtn.onclick = closeAnnotationForm;
    row.appendChild(saveBtn); row.appendChild(cancelBtn);
    box.appendChild(row);
    return box;
  }

  if (t.structure.length === 0) {
    container.appendChild(el(`<div class="card"><div class="empty-state">Le suivi de formation initiale n'est pas encore disponible pour la fonction de cet apprenant.</div></div>`));
    return container;
  }

  t.structure.forEach(m => {
    const validCount = m.submodules.filter(sm => progressBySub[sm.id] === "valide").length;
    const card = el(`<div class="card" style="margin-bottom:12px;"></div>`);
    const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;"></div>`);
    header.appendChild(el(`<h3 style="margin:0;">${esc(m.label)} <span class="help" style="font-weight:400;">(${validCount}/${m.submodules.length} validés)</span></h3>`));
    const addNoteBtn = el(`<a style="font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;">+ Note sur ce module</a>`);
    addNoteBtn.onclick = () => openAnnotationForm(m.id, null);
    header.appendChild(addNoteBtn);
    card.appendChild(header);
    card.appendChild(renderAnnotationList(annotByModule[m.id] || []));
    const inlineModuleForm = renderInlineForm(m.id, null);
    if (inlineModuleForm) card.appendChild(inlineModuleForm);

    const list = el(`<div style="margin-top:10px;"></div>`);
    m.submodules.forEach(sm => {
      const status = progressBySub[sm.id] || "a_faire";
      const row = el(`<div style="padding:8px 0;border-top:1px solid var(--border);"></div>`);
      const top = el(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;"></div>`);
      top.appendChild(el(`<span style="font-size:13.5px;">${esc(sm.label)}</span>`));
      const btnGroup = el(`<div style="display:flex;gap:4px;"></div>`);
      Object.keys(TRAINING_STATUS_META).forEach(key => {
        const meta = TRAINING_STATUS_META[key];
        const b = el(`<button style="font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:${status === key ? meta.color : "var(--surface-1)"};color:${status === key ? "#fff" : "var(--text-secondary)"};font-weight:700;">${meta.label}</button>`);
        b.onclick = () => setLearnerProgress(sm.id, key);
        btnGroup.appendChild(b);
      });
      top.appendChild(btnGroup);
      row.appendChild(top);
      const noteLink = el(`<a style="font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;">+ note</a>`);
      noteLink.onclick = () => openAnnotationForm(null, sm.id);
      row.appendChild(noteLink);
      row.appendChild(renderAnnotationList(annotBySub[sm.id] || []));
      const inlineSubForm = renderInlineForm(null, sm.id);
      if (inlineSubForm) row.appendChild(inlineSubForm);
      const contentBlock = renderSubmoduleContentBlock(sm.content);
      if (contentBlock) row.appendChild(contentBlock);
      list.appendChild(row);
    });
    card.appendChild(list);
    container.appendChild(card);
  });

  return container;
}

/* ============================================================
   MON PARCOURS — frise du parcours du secouriste (arrivée dans
   l'association, obtention PSE1/PSE2, recyclages FC…). Saisie
   manuelle par le formateur, sur le même principe que le suivi de
   formation initiale ci-dessus, mais sous forme d'une liste ordonnée
   et non d'un arbre modules/sous-modules.
   ============================================================ */
const PARCOURS_STATUS_META = {
  a_venir: { label: "À venir", color: "var(--text-muted)" },
  en_cours: { label: "En cours", color: "var(--warning)" },
  valide: { label: "Validé", color: "var(--good)" }
};
const PARCOURS_TYPE_LABELS = {
  arrivee: "Arrivée",
  formation_initiale: "Formation initiale",
  recyclage_fc: "Recyclage (FC)",
  autre: "Étape"
};
function formatParcoursDate(d) {
  if (!d) return "";
  const parts = String(d).split("-");
  if (parts.length !== 3) return d;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

// Frise horizontale réutilisée à l'identique côté apprenant (accueil, lecture seule) et côté
// formateur (aperçu en tête de la vue de gestion). La première étape non validée rencontrée est mise
// en avant visuellement (halo bleu) comme "prochaine étape".
function renderParcoursFriseFromSteps(steps) {
  const frise = el(`<div class="parcours-frise"></div>`);
  let currentMarked = false;
  steps.forEach((s, i) => {
    const isCurrent = !currentMarked && s.status !== "valide";
    if (isCurrent) currentMarked = true;
    const dateLine = s.status === "valide" && s.validated_date
      ? formatParcoursDate(s.validated_date)
      : (s.target_date ? formatParcoursDate(s.target_date) : "");
    const node = el(`<div class="parcours-node ${s.status}${isCurrent ? " current" : ""}">
      <div class="pn-dot">${s.status === "valide" ? "✓" : (i + 1)}</div>
      <div class="pn-label">${esc(s.label)}</div>
      ${dateLine ? `<div class="pn-date">${esc(dateLine)}</div>` : ""}
    </div>`);
    frise.appendChild(node);
    if (i < steps.length - 1) {
      frise.appendChild(el(`<div class="parcours-connector ${s.status === "valide" ? "done" : ""}"></div>`));
    }
  });
  return frise;
}

// Carte "Mon parcours" affichée sur l'accueil de l'apprenant (jamais côté formateur, qui a sa propre
// vue de gestion accessible depuis "Mes secouristes").
function renderHomeParcoursCard() {
  const card = el(`<div class="card" style="margin-top:22px;"></div>`);
  card.appendChild(el(`<h3 style="margin:0 0 4px;">🧭 Mon parcours</h3>`));
  card.appendChild(el(`<p class="help" style="margin:0 0 6px;">De votre arrivée dans l'association jusqu'à l'obtention du PSE2, recyclages (FC) inclus. Tenu à jour par votre formateur.</p>`));

  if (state.myParcours === "loading") {
    card.appendChild(el(`<div class="empty-state">Chargement…</div>`));
    return card;
  }
  if (!state.myParcours || state.myParcours.error) {
    card.appendChild(el(`<div class="empty-state">Parcours indisponible pour le moment.</div>`));
    return card;
  }
  const steps = state.myParcours.steps || [];
  if (steps.length === 0) {
    card.appendChild(el(`<div class="empty-state">Votre formateur n'a pas encore renseigné votre parcours.</div>`));

async function goToLearnerParcours(targetId) {
  state.view = "learnerParcours";
  state.learnerParcours = "loading";
  state.parcoursStepForm = { open: false, targetId, editingId: null, label: "", step_type: "autre", niveau: "", status: "a_venir", target_date: "", validated_date: "", notes: "", busy: false, error: null };
  render();
  const r = await rpc("app_formateur_get_learner_parcours", { p_token: state.auth.token, p_target_id: targetId });
  state.learnerParcours = (r && r.target) ? Object.assign({ targetId }, r) : { error: true };
  render();
}

function openParcoursStepForm(targetId, step) {
  state.parcoursStepForm = {
    open: true, targetId, editingId: step ? step.id : null,
    label: step ? step.label : "", step_type: step ? step.step_type : "autre",
    niveau: step ? (step.niveau || "") : "", status: step ? step.status : "a_venir",
    target_date: step ? (step.target_date || "") : "", validated_date: step ? (step.validated_date || "") : "",
    notes: step ? (step.notes || "") : "", busy: false, error: null
  };
  render();
}
function closeParcoursStepForm() { state.parcoursStepForm.open = false; render(); }

async function saveParcoursStep() {
  const f = state.parcoursStepForm;
  if (!f.label.trim()) { f.error = "Le libellé est obligatoire."; render(); return; }
  f.busy = true; f.error = null; render();
  const params = {
    p_token: state.auth.token,
    p_label: f.label.trim(), p_step_type: f.step_type, p_niveau: f.niveau || null,
    p_status: f.status, p_target_date: f.target_date || null, p_validated_date: f.validated_date || null,
    p_notes: f.notes || null
  };
  const r = f.editingId
    ? await rpc("app_formateur_update_parcours_step", Object.assign({ p_step_id: f.editingId }, params))
    : await rpc("app_formateur_add_parcours_step", Object.assign({ p_target_id: f.targetId }, params));
  if (!r || r.error) { f.busy = false; f.error = "Impossible d'enregistrer cette étape."; render(); return; }
  await goToLearnerParcours(f.targetId);
}

async function deleteParcoursStep(targetId, stepId) {
  if (!confirm("Supprimer cette étape du parcours ?")) return;
  await rpc("app_formateur_delete_parcours_step", { p_token: state.auth.token, p_step_id: stepId });
  await goToLearnerParcours(targetId);
}

async function moveParcoursStep(targetId, steps, stepId, direction) {
  const ids = steps.map(s => s.id);
  const idx = ids.indexOf(stepId);
  const swapWith = direction === "up" ? idx - 1 : idx + 1;
  if (swapWith < 0 || swapWith >= ids.length) return;
  const tmp = ids[idx]; ids[idx] = ids[swapWith]; ids[swapWith] = tmp;
  await rpc("app_formateur_reorder_parcours_steps", { p_token: state.auth.token, p_target_id: targetId, p_step_ids: ids });
  await goToLearnerParcours(targetId);
}

    if (f.error) box.appendChild(el(`<div class="empty-state" style="color:var(--critical);margin-bottom:10px;">${esc(f.error)}</div>`));

    const saveBtn = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
    saveBtn.onclick = saveParcoursStep;
    const cancelBtn = el(`<button class="btn secondary">Annuler</button>`);
    cancelBtn.onclick = closeParcoursStepForm;
    actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
    box.appendChild(actions);

    return box;
  }

  if (f.open && f.targetId === t.targetId) {
    listCard.appendChild(renderStepForm());
  }

  if (steps.length === 0) {
    listCard.appendChild(el(`<div class="empty-state">Aucune étape pour le moment. Ajoutez la première (ex. « Arrivée dans l'association »).</div>`));
  } else {
    steps.forEach((s, i) => {
      const meta = PARCOURS_STATUS_META[s.status] || PARCOURS_STATUS_META.a_venir;
      const row = el(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap;">

          ${s.validated_date ? `<div class="help" style="margin-top:2px;">Validé le : ${esc(formatParcoursDate(s.validated_date))}</div>` : ""}
          ${s.notes ? `<div class="help" style="margin-top:2px;">${esc(s.notes)}</div>` : ""}
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;" id="stepActions-${s.id}"></div>
      </div>`);
      const actionsWrap = row.querySelector("#stepActions-" + s.id);
      const upBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;" ${i === 0 ? "disabled" : ""}>↑</button>`);
      upBtn.onclick = () => moveParcoursStep(t.targetId, steps, s.id, "up");
      const downBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;" ${i === steps.length - 1 ? "disabled" : ""}>↓</button>`);
      downBtn.onclick = () => moveParcoursStep(t.targetId, steps, s.id, "down");
      const editBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;">Modifier</button>`);

      const delBtn = el(`<button class="btn secondary" style="font-size:11px;padding:4px 8px;color:var(--critical);">Supprimer</button>`);
      delBtn.onclick = () => deleteParcoursStep(t.targetId, s.id);
      [upBtn, downBtn, editBtn, delBtn].forEach(b => actionsWrap.appendChild(b));
      listCard.appendChild(row);
    });
  }

  container.appendChild(listCard);
  return container;
}

// Phase 3 : statistiques de vue d'ensemble (formation initiale / FMA) — apprenants éligibles = fonction >= niveau du point
function overviewCellStats(t, progressMap, sm) {
  const eligible = t.learners.filter(l => niveauRank(l.niveau) >= niveauRank(sm.level));
  const v = eligible.filter(l => progressMap[l.id + "::" + sm.id] === "valide").length;
  return { n: eligible.length, v };
}
function renderOverviewSummary(t, progressMap) {
  let N = 0, V = 0, full = 0;
  t.structure.forEach(m => m.submodules.forEach(sm => { const c = overviewCellStats(t, progressMap, sm); N += c.n; V += c.v; if (c.n && c.v === c.n) full++; }));
  const pct = N ? Math.round(V / N * 100) : 0;
  const totalSub = t.structure.reduce((a, m) => a + m.submodules.length, 0);
  return el(`<div class="kpi-strip" style="margin-bottom:16px;">
    <div class="kpi teal"><div class="kv">${t.learners.length}</div><div class="kl">Apprenants suivis</div></div>
    <div class="kpi indigo"><div class="kv">${pct}%</div><div class="kl">Validation globale</div></div>
    <div class="kpi good"><div class="kv">${full}/${totalSub}</div><div class="kl">Points validés par tous</div></div>
  </div>`);
}
