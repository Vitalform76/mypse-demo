async function messagesFn(action, params) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + "/functions/v1/messages-api", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify(Object.assign({ action: action, token: state.auth.token }, params || {}))
    });
  } catch (e) { return { error: "network", message: "Impossible de contacter le serveur." }; }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok && !data.error) return { error: "server", message: "Erreur serveur (" + res.status + ")." };
  return data;
}

function msgBadges() {

function tkReadImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Choisissez un fichier image."));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Lecture de l'image impossible."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image illisible."));
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        let q = 0.75, d = c.toDataURL("image/jpeg", q);
        while (d.length > 800000 && q > 0.3) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
        if (d.length > 800000) return reject(new Error("Image trop lourde."));
        resolve(d);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function tkSubmit() {

  f.busy = true; render();

}

function renderTkNew() {
  const f = TK.form;
  const card = el(`<div class="card" style="max-width:640px;"><h3>Signaler un problème</h3></div>`);
  card.appendChild(el(`<label class="field-label" style="display:block;font-size:13px;font-weight:700;margin-bottom:8px;">Type de problème</label>`));
  const row = el(`<div class="choice-row" style="margin-bottom:14px;"></div>`);
  Object.keys(TK_CATS).forEach(k => {
    const ch = el(`<div class="chip ${f.category === k ? "selected" : ""}">${esc(TK_CATS[k])}</div>`);
    ch.onclick = () => { f.category = k; render(); };
    row.appendChild(ch);
  });
  card.appendChild(row);
  card.appendChild(el(`<label class="field-label" style="display:block;font-size:13px;font-weight:700;margin-bottom:6px;">Titre</label>`));
  const subj = el(`<input class="tk-input" type="text" maxlength="120" placeholder="Ex. : la page Documents ne s'ouvre pas" value="${esc(f.subject)}">`);
  subj.oninput = (e) => { f.subject = e.target.value; };
  card.appendChild(subj);
  card.appendChild(el(`<label class="field-label" style="display:block;font-size:13px;font-weight:700;margin-bottom:6px;">Description</label>`));
  const desc = el(`<textarea class="tk-input" rows="6" maxlength="4000" placeholder="Que s'est-il passé ? Sur quelle page ? Que faisiez-vous juste avant ?" style="resize:vertical;">${esc(f.description)}</textarea>`);
  desc.oninput = (e) => { f.description = e.target.value; };
  card.appendChild(desc);
  card.appendChild(el(`<label class="field-label" style="display:block;font-size:13px;font-weight:700;margin-bottom:6px;">Capture d'écran (facultatif)</label>`));
  if (f.attachment) {
    card.appendChild(el(`<img class="tk-shot" alt="Capture jointe" src="${esc(f.attachment)}" style="max-height:200px;margin:0 0 8px;">`));
    const rm = el(`<button class="btn secondary" style="margin-bottom:12px;">Retirer la capture</button>`);
    rm.onclick = () => { f.attachment = null; f.attName = ""; render(); };
    card.appendChild(rm);
  } else {
    const file = el(`<input type="file" accept="image/*" style="margin-bottom:12px;display:block;">`);
    file.onchange = async (e) => {
      try { f.attachment = await tkReadImage(e.target.files[0]); f.attName = e.target.files[0].name; TK.err = ""; }
      catch (err) { TK.err = err.message || "Image invalide."; }
      render();
    };
    card.appendChild(file);
  }
  const actions = el(`<div class="actions-row"></div>`);
  const cancel = el(`<button class="btn secondary">Annuler</button>`);
  cancel.onclick = () => { TK.mode = "list"; TK.err = ""; render(); if (!TK.list) tkLoadList().then(render); };
  const send = el(`<button class="btn" ${f.busy ? "disabled" : ""}>${f.busy ? "Envoi…" : "Envoyer le ticket"}</button>`);
  send.onclick = tkSubmit;
  actions.appendChild(cancel); actions.appendChild(send);
  card.appendChild(actions);
  return card;
}

function renderTkDetail() {
  const wrap = el(`<div></div>`);
  const back = el(`<button class="btn secondary" style="margin-bottom:14px;">← Tous les tickets</button>`);
  back.onclick = async () => { TK.mode = "list"; TK.detail = null; TK.err = ""; TK.ok = ""; render(); await tkLoadList(); render(); };
  wrap.appendChild(back);
  const d = TK.detail;
  if (!d || d === "loading") { wrap.appendChild(el(`<div class="card"><p class="mini-help" style="margin:0;">Chargement…</p></div>`)); return wrap; }
  const t = d.ticket;
  const card = el(`<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
      <h3 style="margin:0;">${esc(t.subject)}</h3>${tkStatusTag(t.status)}
    </div>
    <div class="mini-help" style="margin:4px 0 12px;">${esc(TK_CATS[t.category] || t.category)} · par ${esc(t.author_name)} · ${fmtDateFR(t.created_at)}${t.page ? " · page : " + esc(t.page) : ""}</div>
    <div style="font-size:14px;white-space:pre-wrap;line-height:1.55;">${esc(t.description)}</div>
  </div>`);
  if (t.attachment) card.appendChild(el(`<img class="tk-shot" alt="Capture d'écran jointe" src="${esc(t.attachment)}">`));
  wrap.appendChild(card);

  if (d.is_admin) {
    const bar = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;"><span class="mini-help">Statut :</span></div>`);
    Object.keys(TK_STATUS).forEach(s => {
      const b = el(`<button class="btn secondary" ${t.status === s ? "disabled" : ""}>${esc(TK_STATUS[s])}</button>`);
      b.onclick = () => tkSetStatus(s);
      bar.appendChild(b);
    });
    wrap.appendChild(bar);
  }

  const thread = el(`<div style="margin-bottom:14px;"></div>`);
  d.messages.forEach(m => {
    const staff = m.author_role === "administrateur";
    thread.appendChild(el(`<div class="tk-bubble ${staff ? "staff" : ""}"><div class="who">${esc(m.author_name)}${staff ? " · administrateur" : ""} · ${fmtDateFR(m.created_at)}</div><div class="txt">${esc(m.body)}</div></div>`));
  });
  wrap.appendChild(thread);

  const box = el(`<div class="card"><label class="field-label" style="display:block;font-size:13px;font-weight:700;margin-bottom:6px;">${d.is_admin ? "Répondre" : "Ajouter un message"}</label></div>`);
  const ta = el(`<textarea class="tk-input" id="tkReply" rows="3" maxlength="4000" style="resize:vertical;" placeholder="Votre message…">${esc(TK.reply)}</textarea>`);
  ta.oninput = (e) => { TK.reply = e.target.value; };
  box.appendChild(ta);
  const send = el(`<button class="btn" ${TK.busy ? "disabled" : ""}>${TK.busy ? "Envoi…" : "Envoyer"}</button>`);
  send.onclick = tkSendReply;
  box.appendChild(send);
  if (!d.is_admin && (t.status === "resolu" || t.status === "ferme")) box.appendChild(el(`<p class="mini-help" style="margin:8px 0 0;">Un nouveau message rouvrira ce ticket.</p>`));
  wrap.appendChild(box);
  return wrap;
}

function renderMessages() {

  const c = el(`<div></div>`);
  c.appendChild(el(`<div class="page-header">${iconChip("mail", { color: "indigo" })}<div><div class="page-title">Messagerie</div><div class="page-sub">Échangez en privé avec ${isFormateur() ? "vos apprenants" : "vos formateurs"}. Seules les deux personnes de la conversation la voient. Les messages sont conservés ${LEGAL_MESSAGE_RETENTION}, puis supprimés automatiquement.</div></div></div>`));
  if (MSG.err) c.appendChild(el(`<div class="msg-err" style="margin:0 0 12px;">${esc(MSG.err)}</div>`));
  if (MSG.mode === "chat") c.appendChild(renderMsgChat());
  else if (MSG.mode === "new") c.appendChild(renderMsgNew());
  else c.appendChild(renderMsgList());
  return c;
}

function renderMsgList() {
  const wrap = el(`<div></div>`);
  const nw = el(`<button class="btn" style="margin-bottom:14px;">Nouveau message</button>`);
  nw.onclick = async () => {
    MSG.mode = "new"; MSG.q = ""; MSG.err = null; MSG.contacts = "loading"; render();
    const r = await rpc("app_msg_contacts", { p_token: state.auth.token });
    MSG.contacts = r && Array.isArray(r.contacts) ? r.contacts : { error: true };
    if (state.view === "messages" && MSG.mode === "new") render();
  };
  wrap.appendChild(nw);
  if (MSG.list == null) { wrap.appendChild(el(`<div class="card"><p class="mini-help" style="margin:0;">Chargement…</p></div>`)); return wrap; }
  if (!MSG.list.length) { wrap.appendChild(el(`<div class="card"><p class="mini-help" style="margin:0;">Aucune conversation. Utilisez « Nouveau message » pour écrire à ${isFormateur() ? "un apprenant" : "un formateur"}.</p></div>`)); return wrap; }
  MSG.list.forEach(cv => {
    const row = el(`<div class="card msg-row" style="cursor:pointer;display:flex;gap:12px;align-items:center;"><div style="flex:1;min-width:0;"><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;"><b>${esc(cv.other_name || "")}</b><span class="mini-help">${esc(msgRoleLabel(cv.other_role))} · ${esc(msgFmtTime(cv.last_message_at))}</span></div><div class="mini-help" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${cv.unread ? "font-weight:700;color:var(--text-primary);" : ""}">${cv.last_from_me ? "Vous : " : ""}${esc(cv.preview || "")}</div></div>${cv.unread ? `<span class="notif-badge" style="display:inline-flex;margin:0;">${cv.unread > 9 ? "9+" : cv.unread}</span>` : ""}</div>`);
    row.onclick = () => msgOpenConv(cv.id);
    wrap.appendChild(row);
  });
  return wrap;
}

function renderMsgNew() {
  const wrap = el(`<div></div>`);
  const back = el(`<button class="btn secondary" style="margin-bottom:14px;">← Retour</button>`);
  back.onclick = () => { MSG.mode = "list"; render(); };
  wrap.appendChild(back);
  const card = el(`<div class="card"><h3>Nouveau message</h3></div>`);
  if (MSG.contacts === "loading") { card.appendChild(el(`<p class="mini-help">Chargement…</p>`)); wrap.appendChild(card); return wrap; }
  if (!Array.isArray(MSG.contacts)) { card.appendChild(el(`<p class="msg-err">Liste indisponible.</p>`)); wrap.appendChild(card); return wrap; }
  const search = el(`<input class="inline-input" style="width:100%;margin-bottom:10px;" placeholder="Rechercher un nom">`);
  search.value = MSG.q;
  const list = el(`<div style="max-height:360px;overflow:auto;"></div>`);
  const paint = () => {
    list.innerHTML = "";
    const q = MSG.q.trim().toLowerCase();
    const items = MSG.contacts.filter(x => !q || (x.full_name || "").toLowerCase().includes(q));
    if (!items.length) list.appendChild(el(`<p class="mini-help">Aucun contact.</p>`));
    items.forEach(x => {
      const b = el(`<button type="button" class="btn secondary" style="display:flex;width:100%;justify-content:space-between;margin-bottom:6px;text-align:left;"><span>${esc(x.full_name || "")}</span><span class="mini-help">${esc(msgRoleLabel(x.role))}</span></button>`);
      b.onclick = async () => {
        const r = await rpc("app_msg_open", { p_token: state.auth.token, p_other: x.id });
        if (!r || !r.ok) { MSG.err = "Impossible d'ouvrir la conversation."; MSG.mode = "list"; render(); return; }
        await msgOpenConv(r.id);
      };
      list.appendChild(b);
    });
  };
  search.oninput = () => { MSG.q = search.value; paint(); };
  card.appendChild(search); card.appendChild(list); paint();
  wrap.appendChild(card);
  return wrap;
}

function msgPaintThread(stick) {
  const box = document.getElementById("msgThread");
  if (!box || !MSG.conv || MSG.conv === "loading") return;
  const nearBottom = stick || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = "";
  if (!MSG.conv.messages.length) box.appendChild(el(`<p class="mini-help" style="text-align:center;margin:24px 0;">Aucun message. Écrivez le premier ci-dessous.</p>`));
  MSG.conv.messages.forEach(m => {
    const bub = el(`<div class="msg-bubble ${m.mine ? "mine" : "theirs"}"></div>`);
    if (m.body) { const t = document.createElement("div"); t.style.cssText = "white-space:pre-wrap;word-break:break-word;"; t.textContent = m.body; bub.appendChild(t); }
    if (m.has_att) {
      const a = el(`<button type="button" class="msg-att">${svgIcon("folder", 14)}<span></span></button>`);
      a.querySelector("span").textContent = (m.att_mime === "application/pdf" ? "PDF" : "Photo") + " · " + (m.att_name || "fichier") + (m.att_size ? " (" + msgSize(m.att_size) + ")" : "");
      a.onclick = async () => {
        const r = await messagesFn("download_url", { message_id: m.id });
        if (!r || !r.ok || !/^https:\/\//.test(r.url || "")) { MSG.err = (r && r.message) || "Fichier indisponible."; render(); return; }
        window.open(r.url, "_blank", "noopener");
      };
      bub.appendChild(a);
    }
    const tm = document.createElement("div"); tm.className = "msg-time"; tm.textContent = msgFmtTime(m.created_at); bub.appendChild(tm);
    box.appendChild(bub);
  });
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function renderMsgChat() {
  const wrap = el(`<div></div>`);
  const bar = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"></div>`);
  const back = el(`<button class="btn secondary">← Conversations</button>`);
  back.onclick = () => { MSG.mode = "list"; MSG.conv = null; loadMsgList(true).then(render); render(); };
  bar.appendChild(back);
  wrap.appendChild(bar);
  if (MSG.conv === "loading" || !MSG.conv) { wrap.appendChild(el(`<div class="card"><p class="mini-help" style="margin:0;">Chargement…</p></div>`)); return wrap; }
  const cv = MSG.conv.conversation;
  const hide = el(`<button class="btn secondary">Masquer cette conversation</button>`);
  hide.onclick = async () => {
    if (!confirm("Masquer cette conversation de votre liste ? Aucun message n'est supprimé ; elle réapparaîtra si " + cv.other_name + " vous écrit.")) return;
    const r = await rpc("app_msg_hide", { p_token: state.auth.token, p_conv: cv.id });
    if (!r || !r.ok) { MSG.err = "Action impossible."; render(); return; }
    MSG.mode = "list"; MSG.conv = null; await loadMsgList(true); render();
  };
  bar.appendChild(hide);
  const card = el(`<div class="card"><h3 style="margin:0 0 2px;"></h3><div class="mini-help" style="margin-bottom:10px;"></div><div id="msgThread" class="msg-thread"></div></div>`);
  card.querySelector("h3").textContent = cv.other_name || "";
  card.querySelector(".mini-help").textContent = msgRoleLabel(cv.other_role);
  const form = el(`<div style="margin-top:12px;"></div>`);
  const ta = el(`<textarea class="inline-input" rows="3" maxlength="4000" style="width:100%;" placeholder="Votre message…"></textarea>`);
  ta.value = MSG.draft;
  ta.oninput = () => { MSG.draft = ta.value; };
  form.appendChild(ta);
  const row = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;"></div>`);
  const file = el(`<input type="file" accept="image/png,image/jpeg,image/webp,application/pdf" style="display:none;">`);
  const pick = el(`<button type="button" class="btn secondary">Joindre une photo / un PDF</button>`);
  pick.onclick = () => file.click();
  const chip = el(`<span class="mini-help"></span>`);
  const paintChip = () => { chip.textContent = MSG.att ? "Pièce jointe : " + MSG.att.name + " (" + msgSize(MSG.att.size) + ")" : "Photo ou PDF, 5 Mo maximum."; };
  paintChip();
  file.onchange = () => {
    const f = file.files && file.files[0]; if (!f) return;
    if (!MSG_MIMES.includes(f.type)) { MSG.err = "Format non accepté : photo (PNG, JPEG, WEBP) ou PDF."; MSG.att = null; render(); return; }
    if (f.size > 5242880) { MSG.err = "Le fichier dépasse 5 Mo."; MSG.att = null; render(); return; }
    MSG.err = null; MSG.att = f; paintChip();
  };
  const send = el(`<button class="btn" style="margin-left:auto;">Envoyer</button>`);
  send.onclick = () => msgSend(send);
  row.appendChild(pick); row.appendChild(chip); row.appendChild(send); row.appendChild(file);
  form.appendChild(row);
  card.appendChild(form);
  wrap.appendChild(card);
  setTimeout(() => msgPaintThread(true), 0);
  return wrap;
}

async function msgSend(btn) {
  if (MSG.busy || !MSG.conv || MSG.conv === "loading") return;
  const body = (MSG.draft || "").trim();
  if (!body && !MSG.att) return;
  const cid = MSG.conv.conversation.id;
  MSG.busy = true; MSG.err = null; if (btn) btn.disabled = true;
  let att = null;
  if (MSG.att) {
    const f = MSG.att;
    const init = await messagesFn("init_upload", { conversation_id: cid, file_name: f.name, mime_type: f.type, file_size: f.size });
    if (!init || !init.ok) { MSG.busy = false; MSG.err = (init && init.message) || "Envoi de la pièce jointe impossible."; render(); return; }
    try { await uploadFileToSignedUrl(init.upload_url, f); }
    catch (e) { MSG.busy = false; MSG.err = "Échec de l'envoi du fichier."; render(); return; }
    att = { path: init.path, mime: f.type, size: f.size, name: f.name };
  }
  const r = await rpc("app_msg_send", { p_token: state.auth.token, p_conv: cid, p_body: body, p_att: att });
  MSG.busy = false;
  if (!r || !r.ok) { MSG.err = "Message non envoyé" + (r && r.error ? " (" + r.error + ")" : "") + "."; render(); return; }
  MSG.draft = ""; MSG.att = null;
  const g = await rpc("app_msg_get", { p_token: state.auth.token, p_conv: cid });
  if (g && g.messages) MSG.conv = g;
  render();
  loadMsgList(true);
}

initAuth();

</script>
<div id="offline-banner" role="status">Connexion perdue — vos actions ne seront pas enregistrées tant que vous êtes hors ligne.</div>
<script>
(function(){
  try {
    var b = document.getElementById("offline-banner");
    function upd(){ b.classList.toggle("show", !navigator.onLine); }
    window.addEventListener("online", upd); window.addEventListener("offline", upd); upd();
    var m = { name:"MyPSE", short_name:"MyPSE", start_url:location.pathname, display:"standalone",
      background_color:"#0D1B2A", theme_color:"#0D1B2A", lang:"fr",
      icons:[{ src:document.querySelector('link[rel=icon]').href, sizes:"192x192", type:"image/svg+xml", purpose:"any" }] };
    var l = document.createElement("link"); l.rel="manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
    document.head.appendChild(l);
  } catch(e) {}
})();
</script>
