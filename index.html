async function goToSessions() {
  state.view = "sessions";
  state.sessions = "loading";
  render();
  const needDocs = !state.documents || state.documents === "loading" || state.documents.error;
  const [r, dr] = await Promise.all([
    rpc("app_list_sessions", { p_token: state.auth.token }),
    needDocs ? rpc("app_list_documents", { p_token: state.auth.token }) : Promise.resolve(null)
  ]);
  state.sessions = r && r.sessions ? r.sessions : { error: true };
  if (dr && dr.documents) state.documents = dr.documents;
  render();
}

function resetSessionForm() {
  state.sessionForm = { open: false, editingId: null, title: "", startsAt: "", fonction: "PSE1", theme: "", description: "", endsAt: "", location: "", animator: "", equipment: "", status: "prevue", report: "", quizEnabled: true, quizThemes: "all", quizDifficulties: ["moyen"], quizMode: "entrainement", quizCount: 15, busy: false, error: null };
}

// Ajouté le 20/08/2026 (soir) — point 15 de la liste du porteur de projet : ouvre le formulaire
// d'entraînement pré-rempli avec les valeurs d'une séance existante, pour la modifier directement
// (au lieu de devoir la supprimer puis la recréer).
function openEditSessionForm(session) {
  const qc = session.quiz_config || null;
  state.sessionForm = {
    open: true,
    editingId: session.id,
    title: session.title || "",
    startsAt: toDatetimeLocalValue(session.starts_at),
    fonction: session.fonction,
    theme: session.theme || "",
    description: session.description || "",
    endsAt: session.ends_at ? toDatetimeLocalValue(session.ends_at) : "",
    location: session.location || "",
    animator: session.animator_name || "",
    equipment: session.equipment || "",
    status: session.status || "prevue",
    report: session.report || "",
    quizEnabled: !!qc,
    quizThemes: qc && qc.themes ? qc.themes : "all",
    quizDifficulties: qc && qc.difficulties && qc.difficulties.length ? qc.difficulties : ["moyen"],
    quizMode: qc && qc.mode ? qc.mode : "entrainement",
    quizCount: qc && qc.count ? qc.count : 15,
    busy: false, error: null
  };
  render();
}

async function submitSessionForm() {
  const f = state.sessionForm;
  f.error = null;
  if (!f.title || !f.title.trim()) { f.error = "Merci d'indiquer un titre."; render(); return; }
  if (!f.startsAt) { f.error = "Merci d'indiquer une date."; render(); return; }
  const iso = new Date(f.startsAt).toISOString();
  const endIso = f.endsAt ? new Date(f.endsAt).toISOString() : null;
  if (endIso && new Date(endIso).getTime() <= new Date(iso).getTime()) { f.error = "L'heure de fin doit être postérieure à l'heure de début."; render(); return; }
  let quizConfig = null;
  if ((f.fonction === "PSE1" || f.fonction === "PSE2") && f.quizEnabled) {
    quizConfig = { themes: f.theme ? [f.theme] : "all", difficulties: f.quizDifficulties, mode: f.quizMode, count: f.quizCount };
  }
  f.busy = true; render();
  const payload = {
    p_token: state.auth.token, p_title: f.title, p_starts_at: iso, p_fonction: f.fonction,
    p_theme: f.theme, p_description: f.description, p_quiz_config: quizConfig
  };
  const r = f.editingId
    ? await rpc("app_update_session", Object.assign({ p_session_id: f.editingId }, payload))
    : await rpc("app_create_session", payload);
  if (!r || r.error) { f.busy = false; f.error = f.editingId ? "Impossible d'enregistrer les modifications." : "Impossible de créer cet entraînement."; render(); return; }
  // Module entraînements (11/10/2026) : fin, lieu, animateur, matériel, statut et compte rendu sont
  // enregistrés par une fonction dédiée (app_session_save_details), juste après la séance elle-même.
  const sessionId = f.editingId || r.id;
  const d = await rpc("app_session_save_details", {
    p_token: state.auth.token, p_session_id: sessionId, p_ends_at: endIso, p_location: f.location,
    p_animator_name: f.animator, p_equipment: f.equipment, p_status: f.status || "prevue", p_report: f.report
  });
  f.busy = false;
  if (!d || d.error) {
    // La séance existe : on bascule en mode édition pour qu'un nouvel essai ne crée pas de doublon.
    f.editingId = sessionId;
    f.error = "La séance est enregistrée, mais ses détails (fin, lieu, animateur, statut) n'ont pas pu l'être. Réessayez avec « Enregistrer les modifications ».";
    render();
    return;
  }
  resetSessionForm();
  goToSessions();
}

async function deleteSession(session) {
  if (!confirm("Supprimer « " + session.title + " » ? Cette action est définitive.")) return;
  const r = await rpc("app_delete_session", { p_token: state.auth.token, p_session_id: session.id });
  if (!r || r.error) { alert("Impossible de supprimer cet entraînement."); return; }
  goToSessions();
}

function startSessionQuiz(session) {
  if (!session.quiz_config) return;
  const qc = session.quiz_config;
  state.settings.level = session.fonction;
  state.settings.themes = qc.themes || "all";
  state.settings.difficulties = qc.difficulties && qc.difficulties.length ? qc.difficulties : ["moyen"];
  state.settings.mode = qc.mode || "entrainement";
  state.settings.count = qc.count || 15;
  beginQuiz();
}

function toggleTheme(id) {
  const s = state.settings;
  if (s.themes === "all") {
    s.themes = [id];
  } else if (s.themes.includes(id)) {
    s.themes = s.themes.filter(t => t !== id);
    if (s.themes.length === 0) s.themes = "all";
  } else {
    s.themes = s.themes.concat([id]);
  }
  render();
}
function selectAllThemes() { state.settings.themes = "all"; render(); }
function toggleDifficulty(id) {
  const s = state.settings;
  if (s.difficulties.includes(id)) {
    if (s.difficulties.length > 1) s.difficulties = s.difficulties.filter(d => d !== id);
  } else {
    s.difficulties = s.difficulties.concat([id]);
  }
  render();
}
function setMode(mode) { state.settings.mode = mode; render(); }
function setCount(n) { state.settings.count = n; render(); }

/* ============================================================
   MOTEUR DE QUIZ
   ============================================================ */
function normalizeAnswerText(s) {
  return String(s || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function beginQuiz() {
  let pool = filterPool();
  if (pool.length === 0) { alert("Aucune question ne correspond à ces filtres. Élargissez votre sélection."); return; }
  pool = shuffle(pool);
  const n = state.settings.count === "toutes" ? pool.length : Math.min(state.settings.count, pool.length);
  const questions = pool.slice(0, n).map(q => {
    const item = Object.assign({}, q);
    if (q.type === "order") {
      const order = shuffle(q.actions.map((a, i) => i));
      item.displayOrder = order;
    } else if (q.type === "short") {
      // pas de displayChoices/displayOrder : réponse libre
    } else {
      item.displayChoices = shuffle(q.choices.map((c, i) => i));
    }
    return item;
  });
  state.quiz = {
    questions,
    index: 0,
    validated: false,
    selected: [],
    currentOrder: null,
    shortAnswer: "",
    results: [],
    mode: state.settings.mode,
    timeLeft: state.settings.mode === "examen" ? questions.length * 45 : null,
    timerId: null
  };
  if (state.quiz.mode === "examen") startTimer();
  setupCurrentQuestion();
  state.view = "quiz";
  render();
}

function startTimer() {
  clearInterval(state.quiz.timerId);
  state.quiz.timerId = setInterval(() => {
    if (!state.quiz) return;
    state.quiz.timeLeft--;
    if (state.quiz.timeLeft <= 0) {
      clearInterval(state.quiz.timerId);
      state.quiz.timeLeft = 0;
      finishQuiz();
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const elx = document.getElementById("timerDisplay");
  if (!elx || !state.quiz) return;
  const t = state.quiz.timeLeft;
  const m = Math.floor(t / 60), s = t % 60;
  elx.textContent = m + ":" + String(s).padStart(2, "0");
  elx.classList.toggle("low", t <= 30);
}

function setupCurrentQuestion() {
  const q = state.quiz.questions[state.quiz.index];
  state.quiz.validated = false;
  state.quiz.shortAnswer = "";
  if (q.type === "order") {
    state.quiz.currentOrder = q.displayOrder.slice();
    state.quiz.selected = [];
  } else {
    state.quiz.currentOrder = null;
    state.quiz.selected = [];
  }
}

function isMultiAnswer(q) { return q.correct.length > 1; }

function selectChoice(originalIdx) {
  const quiz = state.quiz;
  if (quiz.validated) return;
  const q = quiz.questions[quiz.index];
  if (isMultiAnswer(q)) {
    if (quiz.selected.includes(originalIdx)) quiz.selected = quiz.selected.filter(i => i !== originalIdx);
    else quiz.selected = quiz.selected.concat([originalIdx]);
  } else {
    quiz.selected = [originalIdx];
  }
  render();
}

function moveOrderItem(pos, dir) {
  const quiz = state.quiz;
  if (quiz.validated) return;
  const arr = quiz.currentOrder;
  const newPos = pos + dir;
  if (newPos < 0 || newPos >= arr.length) return;
  [arr[pos], arr[newPos]] = [arr[newPos], arr[pos]];
  render();
}

function validateAnswer() {
  const quiz = state.quiz;
  const q = quiz.questions[quiz.index];
  let correct = false;
  if (q.type === "order") {
    correct = quiz.currentOrder.every((originalIdx, pos) => originalIdx === pos);
  } else if (q.type === "short") {
    const given = normalizeAnswerText(quiz.shortAnswer);
    correct = given.length > 0 && (q.answers || []).some(a => normalizeAnswerText(a) === given);
  } else {
    const chosenOriginal = quiz.selected.slice().sort();
    const expected = q.correct.slice().sort();
    correct = chosenOriginal.length === expected.length && chosenOriginal.every((v, i) => v === expected[i]);
  }
  quiz.validated = true;
  quiz.results.push({ q, correct });
  if (quiz.mode !== "examen") recordAnswerRemote(q, correct, quiz.mode);
  render();
}

function nextQuestion() {
  const quiz = state.quiz;
  if (quiz.index < quiz.questions.length - 1) {
    quiz.index++;
    setupCurrentQuestion();
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const quiz = state.quiz;
  if (quiz.timerId) clearInterval(quiz.timerId);
  if (quiz.mode === "examen") {
    quiz.results.forEach(r => recordAnswerRemote(r.q, r.correct, quiz.mode));
  }
  if (quiz.blanc) saveBlancResult(quiz);
  state.view = "result";
  render();
}

function restartSameSettings() { beginQuiz(); }

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
// Un <tr> ne peut pas être créé via div.innerHTML (le navigateur l'ignore silencieusement hors d'un
// <table> — "foster parenting" du parseur HTML). Nécessaire pour le tableau "Mes statistiques" (29/08/2026).
function elRow(html) { const t = document.createElement("table"); t.innerHTML = html.trim(); return t.querySelector("tr"); }
// Même contrainte pour un <td>/<th> isolé (hors <tr>) : doit être analysé dans un contexte <table><tr>.
function elCell(html) { const t = document.createElement("table"); t.innerHTML = "<tr>" + html.trim() + "</tr>"; return t.querySelector("td, th"); }

/* ============================================================
   ASSETS DE MARQUE — logo réel MyPSE (recadré depuis la charte
   graphique officielle fournie le 20/08/2026) et photo « univers
   visuel », encodés en base64 pour un fichier HTML autonome.
   - BRAND_LOGO_FULL  : logo complet (icône + « MyPSE » + accroche),
     tracés bleu marine / rouge, fond transparent — pour fonds clairs.
   - BRAND_LOGO_DARK  : logo complet en version « sur fond sombre »
     (blanc / rouge sur pastille bleu marine) — pour sidebar, topbar,
     écran de connexion.
   - BRAND_LOGO_ICON  : icône seule (livre + croix + ECG) sur pastille
     bleu marine arrondie — pour usages compacts.
   - BRAND_PHOTO_RCP  : photo « univers visuel » (gestes de premiers
     secours / RCP sur mannequin d'entraînement) — utilisée en fond plein
     panneau de l'écran de connexion, sous un dégradé bleu marine pour

function svgIcon(name, size) {
  const s = size || 20;
  const body = ICON_PATHS[name] || ICON_PATHS.star;
  return `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
// Logo MyPSE : livre ouvert stylisé, croix médicale rouge en haut, tracé ECG traversant l'ouverture du
// livre (cf. charte graphique MyPSE fournie le 20/08/2026). Rendu en couleurs fixes (pas "currentColor")
// pour que la croix reste toujours rouge et le tracé toujours blanc, quel que soit le fond utilisé.
function svgLogoMark(size) {
  const s = size || 22;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M3.5 6.2h6.1A2.3 2.3 0 0 1 11.9 8.5v10.6a2 2 0 0 0-2.1-1.3H3.5z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="9.4" y="1.4" width="5.2" height="5.2" rx="1.5" fill="#E63946"/>
    <path d="M12 2.6v2.8M10.6 4h2.8" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
  </svg>`;
}
function iconChip(name, opts) {
  opts = opts || {};
  const size = opts.size === "sm" ? "sm" : opts.size === "lg" ? "lg" : "";
  const color = opts.color || "";
  return `<div class="icon-chip ${size} ${color}">${svgIcon(name, opts.iconSize || (size === "lg" ? 24 : size === "sm" ? 16 : 19))}</div>`;
}

// Ex-"barre de confiance" MyPSE (Fiable / À jour / Accessible / Indispensable / Engagé), retirée le
// 29/08/2026 à la demande du porteur de projet ("ne sert pas à grand-chose") et remplacée sur l'accueil
// par les événements à venir et les modules en cours (widgets déjà existants, simplement remontés en
// haut de page — voir renderLearnerHomeContent). Fonction et constante supprimées, plus utilisées.

let _lastRenderedView = null;
function render() {
  const root = document.getElementById("app-root");
  root.innerHTML = "";

  if (state.view === "loading") {
    root.appendChild(el(`<div class="empty-state" style="padding-top:80px;">Chargement…</div>`));
    return;
  }
  if (state.view === "auth") {
    root.appendChild(renderAuthScreen());
    return;
  }

  const shell = el(`<div class="shell"></div>`);
  shell.appendChild(renderSidebar());
  if (state.mobileSidebarOpen) {
    const backdrop = el(`<div style="position:fixed;inset:0;background:rgba(6,10,20,0.5);z-index:35;"></div>`);
    backdrop.onclick = () => { state.mobileSidebarOpen = false; render(); };
    shell.appendChild(backdrop);
  }
  const content = el(`<div class="content"></div>`);
  content.appendChild(renderTopbar());
  const appDiv = el(`<div class="app"></div>`);
  if (state.view !== _lastRenderedView && state.view !== "quiz") appDiv.classList.add("page-enter");
  _lastRenderedView = state.view;
  if (state.view !== "quiz") appDiv.appendChild(renderDisclaimer());
  if (state.view === "home") appDiv.appendChild(renderHome());
  else if (state.view === "setup") appDiv.appendChild(renderWizard());
  else if (state.view === "quiz") appDiv.appendChild(renderQuiz());
  else if (state.view === "result") appDiv.appendChild(renderResult());
  else if (state.view === "progress") appDiv.appendChild(renderProgress());
  else if (state.view === "questionnaires") appDiv.appendChild(renderQuestionnaires());
  else if (state.view === "myProfile") appDiv.appendChild(renderMyProfile());
  else if (state.view === "personnelManagement") appDiv.appendChild(renderPersonnelManagement());
  else if (state.view === "formateur") appDiv.appendChild(renderFormateur());
  else if (state.view === "suiviPedago") appDiv.appendChild(renderSuiviPedago());
  else if (state.view === "personFile") appDiv.appendChild(renderPersonFile());
  else if (state.view === "documents") appDiv.appendChild(renderDocuments());
  else if (state.view === "admin") appDiv.appendChild(renderAdmin());
  else if (state.view === "createProfile") appDiv.appendChild(renderCreateProfilePage());
  else if (state.view === "questionsAdmin") appDiv.appendChild(renderQuestionsAdmin());
  else if (state.view === "myTraining") appDiv.appendChild(renderMyTraining());
  else if (state.view === "selfStudy") appDiv.appendChild(renderSelfStudy());
  else if (state.view === "selfStudyTrack") appDiv.appendChild(renderSelfStudyTrack());
  else if (state.view === "learnerTraining") appDiv.appendChild(renderLearnerTraining());
  else if (state.view === "trainingOverview") appDiv.appendChild(renderTrainingOverview());
  else if (state.view === "myFma") appDiv.appendChild(renderMyFma());
  else if (state.view === "fmaOverview") appDiv.appendChild(renderFmaOverview());
  else if (state.view === "learnerParcours") appDiv.appendChild(renderLearnerParcours());
  else if (state.view === "sessions") appDiv.appendChild(renderSessions());
  else if (state.view === "trainingStats") appDiv.appendChild(renderTrainingStats());
  else if (state.view === "personalisation") appDiv.appendChild(renderPersonalisation());
  else if (state.view === "formationSessions") appDiv.appendChild(renderFormationSessions());
  else if (state.view === "messages") appDiv.appendChild(renderMessages());
  else if (state.view === "tickets") appDiv.appendChild(renderTickets());
  appDiv.appendChild(renderFooter());
  content.appendChild(appDiv);
  shell.appendChild(content);
  root.appendChild(shell);

  if (state.docPreview) shell.appendChild(renderDocPreviewOverlay());
  if (state.notifs && state.notifs.open) shell.appendChild(renderNotifPanel());

  // Accessibilité clavier : cartes cliquables (div) focalisables + Entrée / Espace
  root.querySelectorAll('.level-card:not(.locked), .theme-row[style*="cursor:pointer"]').forEach(n => {
    n.tabIndex = 0; n.setAttribute("role", "button");
    n.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); } };
  });

  if (state.view === "quiz" && state.quiz.mode === "examen") updateTimerDisplay();
}

function renderTopbar() {
  const bar = el(`<div class="topbar"><div class="brand-mini"><img class="brand-logo-img" src="${BRAND_LOGO_DARK}" alt="MyPSE" /></div><div style="display:flex;align-items:center;"><button class="burger notif-top" aria-label="Notifications">${svgIcon("bell", 16)}<span class="notif-badge">0</span></button><button class="burger menu-burger" aria-label="Menu">☰</button></div></div>`);
  bar.querySelector(".menu-burger").onclick = () => { state.mobileSidebarOpen = !state.mobileSidebarOpen; render(); };
  bar.querySelector(".notif-top").onclick = () => { state.mobileSidebarOpen = false; toggleNotifPanel(); };
  const nb = bar.querySelector(".notif-badge"); const n = (state.notifs && state.notifs.unread) || 0;
  nb.textContent = n > 9 ? "9+" : String(n); nb.style.display = n > 0 ? "inline-flex" : "none";
  return bar;
}

function renderSidebar() {
  const aside = el(`<aside class="sidebar ${state.mobileSidebarOpen ? "open" : ""}">
    <div class="brand">
      <div class="mark"><img class="brand-logo-img" src="${BRAND_LOGO_ICON}" alt="MyPSE" /></div>
      <div>
        <div class="name">MyPSE</div>
        <div class="sub">Le carnet numérique du secouriste</div>
      </div>
    </div>
    <nav class="side-nav" id="navMain"></nav>
    <div class="nav-group-label">Mes formations</div>
    <nav class="side-nav" id="navTrack"></nav>
    <div class="nav-group-label">Questionnaires</div>
    <nav class="side-nav" id="navQuiz"></nav>
    <div class="nav-group-label">Ressources</div>
    <nav class="side-nav" id="navRes"></nav>
    ${isFormateur() ? '<div class="nav-group-label">Pédagogie</div><nav class="side-nav" id="navPedago"></nav>' : ""}
    ${isAdministrateur() ? '<div class="nav-group-label">Administration</div><nav class="side-nav" id="navAdmin"></nav>' : ""}
    <div class="spacer"></div>
    <div class="ref-badge">${esc(state.appSettings.referentiel_banner)}</div>
    <div class="account-box" id="accountBox"></div>
  </aside>`);

  const navMain = aside.querySelector("#navMain");
  const homeBtn = el(`<button class="${state.view === "home" ? "active" : ""}"><span class="ic">${svgIcon("home", 15)}</span>Accueil</button>`);
  homeBtn.onclick = () => { goToHome(); closeMobileSidebar(); render(); };
  navMain.appendChild(homeBtn);
  const notifBtn = el(`<button class="${state.notifs && state.notifs.open ? "active" : ""}"><span class="ic">${svgIcon("bell", 15)}</span>Notifications<span class="notif-badge">0</span></button>`);
  notifBtn.onclick = () => toggleNotifPanel();
  { const nb = notifBtn.querySelector(".notif-badge"); const n = (state.notifs && state.notifs.unread) || 0; nb.textContent = n > 9 ? "9+" : String(n); nb.style.display = n > 0 ? "inline-flex" : "none"; }
  navMain.appendChild(notifBtn);
  const msgBtn = el(`<button class="${state.view === "messages" ? "active" : ""}"><span class="ic">${svgIcon("mail", 15)}</span>Messagerie<span class="msg-badge">0</span></button>`);
  msgBtn.onclick = () => goToMessages();
  { const mb = msgBtn.querySelector(".msg-badge"); const n = MSG.unread || 0; mb.textContent = n > 9 ? "9+" : String(n); mb.style.display = n > 0 ? "inline-flex" : "none"; }
  navMain.appendChild(msgBtn);
  const supBtn = el(`<button class="${state.view === "tickets" ? "active" : ""}"><span class="ic">${svgIcon("help", 15)}</span>Support</button>`);
  supBtn.onclick = () => goToTickets();
  navMain.appendChild(supBtn);

  // "Formation initiale" détachée du groupe "Mes formations" le 29/08/2026, à la demande du porteur de
  // projet : c'est un carnet de suivi de scolarité (validation point par point par le formateur), pas
  // une révision par thème/fonction — placée ici en onglet à part entière juste sous "Accueil".
  // Position définitive dans le menu à revoir plus tard (non tranchée par le porteur de projet).
  const trainActive = ["myTraining", "trainingOverview"].includes(state.view);
  const trainBtn = el(`<button class="${trainActive ? "active" : ""}"><span class="ic">${svgIcon("cap", 15)}</span>Formation initiale</button>`);
  trainBtn.onclick = () => { (isFormateur() ? goToTrainingOverview : goToMyTraining)(); closeMobileSidebar(); };
  navMain.appendChild(trainBtn);

  // Auto-formation (lot 2, 24/11/2026) : quiz par module, "Terminé" automatique ; suivi côté formateur.
  const ssActive = ["selfStudy", "selfStudyTrack"].includes(state.view);
  const ssBtn = el(`<button class="${ssActive ? "active" : ""}"><span class="ic">${svgIcon("book", 15)}</span>${isFormateur() ? "Suivi auto-formation" : "Auto-formation"}</button>`);
  ssBtn.onclick = () => { (isFormateur() ? goToSelfStudyTrack : goToSelfStudy)(); closeMobileSidebar(); };
  navMain.appendChild(ssBtn);

  // Groupe "Mes formations" (réordonné le 29/08/2026 selon la demande du porteur de projet) : Ma
  // progression, puis les trois fonctions dans l'ordre PSC → Secouriste → Équipier Secouriste, puis
  // Recyclage (FMA) en dernier. Chaque bouton fonction lance directement une séance de révision
  // (comportement inchangé) — pour parcourir les thématiques par fonction avant de se lancer, voir le
  // nouveau groupe "Questionnaires" ci-dessous.
  const navTrack = aside.querySelector("#navTrack");
  const progBtn = el(`<button class="${state.view === "progress" ? "active" : ""}"><span class="ic">${svgIcon("chart", 15)}</span>Ma progression</button>`);
  progBtn.onclick = () => { goToProgress(); closeMobileSidebar(); };
  navTrack.appendChild(progBtn);

  // Ordre hiérarchique cumulatif : PSC (0) < Secouriste/PSE1 (1) < Équipier Secouriste/PSE2 (2).
  // Formateur/administrateur : tout est déverrouillé. Secouriste : sa fonction et tout ce qui est en
  // dessous sont déverrouillés, ce qui est au-dessus est affiché grisé avec un cadenas.
  const NAV_LEVELS = [
    { id: "PSC", icon: "cross" },
    { id: "PSE1", icon: "book" },
    { id: "PSE2", icon: "layers" }
  ];
  NAV_LEVELS.forEach(({ id, icon }) => {
    const unlocked = isLevelUnlocked(id);
    const isActive = state.settings.level === id && ["setup", "quiz", "result"].includes(state.view);
    const label = esc(niveauShortLabel(id));
    const btn = el(`<button class="${isActive ? "active" : ""}" ${unlocked ? "" : "disabled"}><span class="ic">${svgIcon(icon, 15)}</span>${label}${unlocked ? "" : '<span class="soon">🔒 Verrouillé</span>'}</button>`);
    if (unlocked) {
      btn.onclick = () => { goToLevelWizard(id); closeMobileSidebar(); render(); };
    } else {
      btn.title = "Fonction non accessible à votre niveau actuel.";
    }
    navTrack.appendChild(btn);
  });

  const fmaActive = ["myFma", "fmaOverview"].includes(state.view);
  const fmaBtn = el(`<button class="${fmaActive ? "active" : ""}"><span class="ic">${svgIcon("calendar", 15)}</span>Recyclage (FMA)</button>`);
  fmaBtn.onclick = () => { (isFormateur() ? goToFmaOverview : goToMyFma)(); closeMobileSidebar(); };
  navTrack.appendChild(fmaBtn);

  // Nouveau groupe "Questionnaires" (29/08/2026), pour l'ensemble des fonctions : un onglet par
  // fonction (PSC / Secouriste / Équipier Secouriste / Conduite), avec le même verrouillage visuel
  // (cadenas) que "Mes formations". Ouvre une page dédiée pour parcourir les thématiques de la fonction
  // choisie avant de lancer une révision (voir renderQuestionnaires) — le premier onglet accessible est
  // sélectionné par défaut.
  const navQuiz = aside.querySelector("#navQuiz");
  const QUIZ_TABS = [
    { id: "PSC", icon: "cross", label: "Premiers Secours Citoyen", unlocked: () => isLevelUnlocked("PSC") },
    { id: "PSE1", icon: "book", label: "Secouriste", unlocked: () => isLevelUnlocked("PSE1") },
    { id: "PSE2", icon: "layers", label: "Équipier Secouriste", unlocked: () => isLevelUnlocked("PSE2") },
    { id: "CONDUITE", icon: "star", label: "Conduite", unlocked: () => visibleFonctions().includes("CONDUITE") }
  ];
  QUIZ_TABS.forEach(({ id, icon, label, unlocked }) => {
    const ok = unlocked();
    const isActive = state.view === "questionnaires" && state.questionnairesTab === id;
    const btn = el(`<button class="${isActive ? "active" : ""}" ${ok ? "" : "disabled"}><span class="ic">${svgIcon(icon, 15)}</span>${esc(label)}${ok ? "" : '<span class="soon">🔒 Verrouillé</span>'}</button>`);
    if (ok) {
      btn.onclick = () => { goToQuestionnaires(id); closeMobileSidebar(); };
    } else {
      btn.title = "Fonction non accessible à votre niveau actuel.";
    }
    navQuiz.appendChild(btn);
  });

  // Groupe "Ressources" : Documents, Calendrier. "Personnels" déplacé vers "Pédagogie" et renommé
  // "Mes statistiques" le 29/08/2026 (point 18).
  const navRes = aside.querySelector("#navRes");
  const docBtn = el(`<button class="${state.view === "documents" ? "active" : ""}"><span class="ic">${svgIcon("folder", 15)}</span>Documents</button>`);
  docBtn.onclick = () => { goToDocuments(); closeMobileSidebar(); };
  navRes.appendChild(docBtn);
  const calBtn = el(`<button class="${state.view === "sessions" ? "active" : ""}"><span class="ic">${svgIcon("calendar", 15)}</span>Calendrier</button>`);
  calBtn.onclick = () => { goToSessions(); closeMobileSidebar(); };
  navRes.appendChild(calBtn);

  if (isFormateur()) {
    const navPedago = aside.querySelector("#navPedago");
    // (18) Renommé "Personnels" -> "Mes statistiques" et déplacé de "Ressources" vers "Pédagogie" le
    // 29/08/2026 — même page, même comportement (goToFormateur/renderFormateur inchangés), seuls le
    // libellé du bouton et son emplacement dans le menu changent.
    const statsBtn = el(`<button class="${state.view === "formateur" ? "active" : ""}"><span class="ic">${svgIcon("chart", 15)}</span>Mes statistiques</button>`);
    statsBtn.onclick = () => { goToFormateur(); closeMobileSidebar(); };
    const suiviBtn = el(`<button class="${state.view === "suiviPedago" ? "active" : ""}"><span class="ic">${svgIcon("users", 15)}</span>Suivi pédagogique</button>`);
    suiviBtn.onclick = () => { goToSuiviPedago(); closeMobileSidebar(); };
    navPedago.appendChild(suiviBtn);
    // Module entraînements (11/10/2026) : présences, heures et assiduité des secouristes.
    const tstatsBtn = el(`<button class="${state.view === "trainingStats" ? "active" : ""}"><span class="ic">${svgIcon("calendar", 15)}</span>Suivi des entraînements</button>`);
    tstatsBtn.onclick = () => { goToTrainingStats(); closeMobileSidebar(); };
    navPedago.appendChild(tstatsBtn);
    navPedago.appendChild(statsBtn);
    // "Gestion du personnel" (point 17) ouverte au formateur le 29/08/2026 (suite) : les réglages de
    // compte (fonction/difficulté/qualifications) y ont été déplacés depuis "Mes statistiques", qui
    // devient une page de lecture seule — il fallait donc que le formateur garde l'accès à ces réglages,
    // qu'il pouvait déjà modifier avant cette réorganisation.
    const personnelBtn = el(`<button class="${state.view === "personnelManagement" ? "active" : ""}"><span class="ic">${svgIcon("users", 15)}</span>Gestion du personnel</button>`);
    personnelBtn.onclick = () => { goToPersonnelManagement(); closeMobileSidebar(); };
    navPedago.appendChild(personnelBtn);
    const questionsBtn = el(`<button class="${state.view === "questionsAdmin" ? "active" : ""}"><span class="ic">${svgIcon("help", 15)}</span>Questionnaires</button>`);
    questionsBtn.onclick = () => { goToQuestionsAdmin(); closeMobileSidebar(); };
    navPedago.appendChild(questionsBtn);
    const fsBtn = el(`<button class="${state.view === "formationSessions" ? "active" : ""}"><span class="ic">${svgIcon("clipboard", 15)}</span>Sessions de formation</button>`);
    fsBtn.onclick = () => { goToFormationSessions(); closeMobileSidebar(); };
    navPedago.appendChild(fsBtn);
  }

  if (isAdministrateur()) {
    const navAdmin = aside.querySelector("#navAdmin");
    const adminBtn = el(`<button class="${state.view === "admin" ? "active" : ""}"><span class="ic">${svgIcon("gear", 15)}</span>Administration</button>`);
    adminBtn.onclick = () => { goToAdmin(); closeMobileSidebar(); };
    navAdmin.appendChild(adminBtn);
    const createProfileBtn = el(`<button class="${state.view === "createProfile" ? "active" : ""}"><span class="ic">${svgIcon("users", 15)}</span>Créer un profil</button>`);
    createProfileBtn.onclick = () => { goToCreateProfile(); closeMobileSidebar(); };
    navAdmin.appendChild(createProfileBtn);
  }

  const accountBox = aside.querySelector("#accountBox");
  const fullName = state.auth.account.full_name || "";
  const initials = fullName.split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const who = el(`<div class="who" style="cursor:pointer;"><div class="avatar">${initials}</div><div><div class="name">${fullName}</div><div class="role">${esc(mergedRoleLabel(state.auth.account))}</div></div></div>`);
  who.title = "Mon profil";
  who.onclick = () => { goToMyProfile(); closeMobileSidebar(); };
  accountBox.appendChild(who);
  // Photo de profil (point 5, 29/08/2026) : si l'utilisateur en a défini une, elle remplace les
  // initiales dans la pastille de la barre latérale.
  if (state.auth.account.photo_url) {
    const avatarEl = who.querySelector(".avatar");
    avatarEl.textContent = "";
    avatarEl.style.backgroundImage = `url('${state.auth.account.photo_url}')`;
    avatarEl.style.backgroundSize = "cover";
    avatarEl.style.backgroundPosition = "center";
  }
  const profileLink = el(`<a style="display:block;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;padding:0 8px 8px;">Mon profil</a>`);
  profileLink.onclick = () => { goToMyProfile(); closeMobileSidebar(); };
  accountBox.appendChild(profileLink);
  const customLink = el(`<a style="display:block;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;padding:0 8px 8px;">Personnalisation</a>`);
  customLink.onclick = () => { goToPersonalisation(); };
  accountBox.appendChild(customLink);
  const logoutBtn = el(`<button>Déconnexion</button>`);
  logoutBtn.onclick = doLogout;
  accountBox.appendChild(logoutBtn);

  return aside;
}

const LEGAL_UPDATED = "15/10/2026";
const LEGAL_MESSAGE_RETENTION = "12 mois";
function openLegal() {
  if (document.getElementById("legalOverlay")) return;
  const ov = el(`<div class="legal-overlay" id="legalOverlay" role="dialog" aria-modal="true" aria-label="Politique de confidentialité"></div>`);
  const card = el(`<div class="legal-card">
    <button class="btn secondary legal-close" id="legalCloseBtn">Fermer</button>
    <h2>Politique de confidentialité</h2>
    <div class="legal-meta">MyPSE — Le carnet numérique du secouriste · Dernière mise à jour : ${LEGAL_UPDATED}</div>
    <p>Cette page explique quelles données personnelles MyPSE utilise, pourquoi, avec qui elles sont partagées et combien de temps elles sont conservées.</p>

    <h3>1. Qui est responsable de vos données ?</h3>
    <p>L'organisation qui vous a ouvert votre compte (par exemple l'ASSDCA) décide de l'usage de vos données pour ses activités de formation et de secourisme : elle en est responsable. MyPSE est édité par <strong>Vitalform76</strong> (entreprise individuelle, SIRET 948 654 132 00034, 19 Place de la Résistance, 76380 Canteleu), qui héberge et fait fonctionner l'application pour le compte de cette organisation.</p>

    <h3>2. Quelles données sont utilisées ?</h3>
    <ul>
      <li><strong>Compte</strong> : nom, adresse e-mail, mot de passe (stocké sous forme chiffrée irréversible), rôle (secouriste, formateur, administrateur) et niveau de formation.</li>
      <li><strong>Profil</strong> (facultatif) : photo, date de naissance, adresse postale.</li>
      <li><strong>Formation et révision</strong> : réponses aux questionnaires, progression, suivi des formations, entraînements et présences, annotations des formateurs.</li>
      <li><strong>Documents administratifs de formation</strong> (sessions, attestations) lorsque votre organisation les gère dans MyPSE.</li>
      <li><strong>Messagerie</strong> : messages échangés entre un apprenant et un formateur.</li>
      <li><strong>Support</strong> : tickets de signalement de problème (titre, description, capture d'écran facultative, échanges avec les administrateurs). Ils ne sont visibles que par leur auteur et par les administrateurs de l'organisation.</li>
      <li><strong>Technique</strong> : informations de connexion nécessaires à la sécurité du compte (sessions, tentatives de connexion échouées).</li>
    </ul>

    <h3>3. Pourquoi ?</h3>
    <ul>
      <li>Créer et sécuriser votre compte.</li>
      <li>Vous permettre de réviser et de suivre votre progression, et à vos formateurs de vous accompagner.</li>
      <li>Organiser les entraînements, formations et documents de votre organisation.</li>
      <li>Permettre des échanges privés avec vos formateurs.</li>
    </ul>
    <p>Ces usages sont nécessaires au fonctionnement du service demandé par votre organisation et par vous. Vos données ne sont ni vendues, ni utilisées pour de la publicité ou du profilage commercial.</p>

    <h3>4. Qui peut voir vos données ?</h3>
    <ul>
      <li><strong>Vous</strong> : toutes vos données.</li>
      <li><strong>Les formateurs et administrateurs de votre organisation</strong> : votre profil, votre progression et vos présences. Ils n'ont pas accès aux autres organisations, et inversement.</li>
      <li><strong>Une conversation de la messagerie</strong> n'est visible que par les deux personnes concernées.</li>
      <li><strong>Prestataires techniques</strong> : Supabase (base de données et fichiers, hébergés dans l'Union européenne, région de Francfort) et GitHub Pages (affichage du site). Lorsque l'envoi d'e-mails est activé, un prestataire d'envoi (Resend) reçoit l'adresse e-mail et le contenu du message à transmettre ; un transfert hors de l'Union européenne peut alors avoir lieu, encadré par les garanties prévues par le RGPD.</li>
    </ul>

    <h3>5. Combien de temps ?</h3>
    <ul>
      <li><strong>Messages : ${LEGAL_MESSAGE_RETENTION}</strong>. Les messages sont supprimés automatiquement et définitivement au-delà de cette durée.</li>
      <li><strong>Compte, profil et progression</strong> : tant que votre compte est actif, puis supprimés à votre demande ou à celle de votre organisation.</li>
      <li><strong>Tickets de support</strong> : tant que le compte existe ; ils sont supprimés avec lui.</li>
      <li><strong>Documents administratifs de formation</strong> : selon les obligations légales applicables à l'organisme de formation concerné.</li>
      <li><strong>Sessions de connexion</strong> : elles expirent automatiquement ; vous pouvez vous déconnecter à tout moment.</li>
    </ul>

    <h3>6. Sécurité</h3>
    <p>Les échanges sont chiffrés (HTTPS), les mots de passe sont stockés sous forme chiffrée, les accès sont limités selon le rôle et l'organisation, et le compte est temporairement bloqué après plusieurs tentatives de connexion échouées. Vous pouvez changer votre mot de passe depuis « Mon profil ».</p>

    <h3>7. Cookies et stockage local</h3>
    <p>MyPSE n'utilise ni cookie publicitaire ni outil de mesure d'audience. Le navigateur conserve uniquement ce qui est nécessaire au fonctionnement : votre session de connexion et vos préférences d'affichage.</p>

    <h3>8. Vos droits</h3>
    <p>Vous pouvez demander l'accès à vos données, leur rectification, leur effacement, la limitation ou l'opposition à leur traitement, ainsi que leur portabilité. Adressez-vous d'abord à votre organisation (formateur ou administrateur), ou écrivez à <strong>contact@vitalform76.com</strong>. Une réponse vous sera apportée dans un délai d'un mois. Vous pouvez aussi saisir la CNIL (<strong>cnil.fr</strong>) si vous estimez que vos droits ne sont pas respectés.</p>

    <h3>9. Modifications</h3>
    <p>Cette politique peut évoluer ; la date de mise à jour est indiquée en haut de cette page.</p>
  </div>`);
  ov.appendChild(card);
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  card.querySelector("#legalCloseBtn").onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
  document.addEventListener("keydown", onKey);
  document.body.appendChild(ov);
  card.querySelector("#legalCloseBtn").focus();
}
function legalLinkEl(label) {
  const b = el(`<button type="button" class="legal-link">${esc(label || "Politique de confidentialité")}</button>`);

function renderAuthFormCard() {
  const container = el(`<div></div>`);
  const f = state.authForm;

  container.appendChild(el(`<div style="margin-bottom:20px;">
    <div class="page-title" style="margin-bottom:2px;">${f.mode === "login" ? "Se connecter" : "Créer un compte"}</div>

  const tabs = el(`<nav style="display:flex;gap:6px;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;">
    <button id="tabLogin" style="flex:1;border:none;font-weight:700;font-size:13px;padding:8px;border-radius:7px;cursor:pointer;"></button>
    <button id="tabSignup" style="flex:1;border:none;font-weight:700;font-size:13px;padding:8px;border-radius:7px;cursor:pointer;"></button>
  </nav>`);
  const tabLogin = tabs.querySelector("#tabLogin");
  const tabSignup = tabs.querySelector("#tabSignup");
  tabLogin.textContent = "Connexion";
  tabSignup.textContent = "Inscription";
  tabLogin.style.background = f.mode === "login" ? "var(--blue)" : "transparent";
  tabLogin.style.color = f.mode === "login" ? "#fff" : "var(--text-secondary)";
  tabSignup.style.background = f.mode === "signup" ? "var(--blue)" : "transparent";

// Choisit automatiquement le thème le plus pertinent pour "Lancer ma révision recommandée" :
// priorité aux thématiques jamais travaillées (parmi les fonctions accessibles au compte), puis, si
// tout a déjà été essayé au moins une fois, au thème le moins maîtrisé (taux de réussite le plus bas).
// Reprend la même logique que le widget "Modules en cours" déjà en place.
// Rappels personnalisés (accueil apprenant) : séances proches + thématiques à réviser (ancienneté ou score bas).
// Calculés côté application ; une rappel masqué reste masqué jusqu'au lendemain (localStorage, par appareil).
function readDismissedReminders() { try { return JSON.parse(localStorage.getItem("demo_mypse_reminders_dismissed") || "{}"); } catch (e) { return {}; } }
function dismissReminder(id) {
  const d = readDismissedReminders(); d[id] = new Date().toISOString().slice(0, 10);
  try { localStorage.setItem("demo_mypse_reminders_dismissed", JSON.stringify(d)); } catch (e) {}
  render();
}
function buildReminders() {
  const out = [];
  const today = new Date().toISOString().slice(0, 10);
  const dismissed = readDismissedReminders();
  const now = Date.now();
  const sessions = Array.isArray(state.sessions) ? state.sessions : [];
  sessions.forEach(s => {
    const t = new Date(s.starts_at).getTime();
    if (t >= now && t - now <= 7 * 86400000) {
      const when = new Date(s.starts_at).toLocaleDateString("fr-FR", { weekday: "long", day: "2-digit", month: "2-digit" });
      out.push({ id: "s-" + s.id, icon: "calendar", text: "Entraînement « " + s.title + " » — " + when, action: { label: "Voir le calendrier", fn: goToSessions } });
    }
  });
  const levels = visibleFonctions().filter(id => HOME_LEVEL_ORDER.includes(id));
  const byTheme = (state.myProgress && state.myProgress.by_theme) || [];
  byTheme.forEach(st => {
    const th = THEMES.find(t => t.id === st.theme);
    if (!th || !levels.includes(th.level) || !st.total) return;
    const days = st.last_at ? Math.floor((now - new Date(st.last_at).getTime()) / 86400000) : null;
    const pct = Math.round(st.correct / st.total * 100);
    if (days !== null && days >= 30) {
      out.push({ id: "old-" + th.id, icon: "clock", text: "« " + th.label + " » : dernière révision il y a " + days + " jours", action: { label: "Réviser", fn: () => quickStartTheme(th.level, th.id) } });
    } else if (st.total >= 5 && pct < 50) {
      out.push({ id: "low-" + th.id, icon: "chart", text: "« " + th.label + " » : " + pct + " % de réussite, à consolider", action: { label: "Réviser", fn: () => quickStartTheme(th.level, th.id) } });
    }
  });
  return learnerRecycleReminders().concat(out).filter(r => dismissed[r.id] !== today).slice(0, 5);
}
function renderHomeRemindersCard() {
  const list = buildReminders();
  if (!list.length) return null;
  const card = el(`<div class="card accent" style="margin-bottom:20px;"><h3 style="margin:0 0 10px;">Rappels (${list.length})</h3></div>`);
  list.forEach(r => {
    const row = el(`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap;"><span class="ic">${svgIcon(r.icon, 16)}</span><span style="flex:1;min-width:200px;font-size:13.5px;">${esc(r.text)}</span></div>`);

/* ---------- Régularité, badges, objectifs ---------- */
function computeStreak(days) {
  const set = new Set(days || []);
  let cur = new Date();
  if (!set.has(localISO(cur))) cur = new Date(Date.now() - 86400000);
  let n = 0;
  while (set.has(localISO(cur))) { n++; cur = new Date(cur.getTime() - 86400000); }
  return n;
}
function computeBadges(days, byTheme) {
  const total = (byTheme || []).reduce((s, t) => s + (t.total || 0), 0);
  const streak = computeStreak(days);
  // la meilleure série sur la période connue
  const sorted = (days || []).slice().sort();
  let best = 0, run = 0, prev = null;
  sorted.forEach(d => {
    if (prev && Math.round((new Date(d) - new Date(prev)) / 86400000) === 1) run++; else run = 1;
    best = Math.max(best, run); prev = d;
  });
  best = Math.max(best, streak);
  const mastered = (byTheme || []).filter(t => t.total >= 10 && t.correct / t.total >= 0.8).length;
  const tried = (byTheme || []).filter(t => t.total > 0).length;
  return [
    { label: "Première réponse", ok: total >= 1 },
    { label: "100 réponses", ok: total >= 100 },
    { label: "500 réponses", ok: total >= 500 },
    { label: "Série de 3 jours", ok: best >= 3 },
    { label: "Série de 7 jours", ok: best >= 7 },
    { label: "Série de 30 jours", ok: best >= 30 },
    { label: "Thème maîtrisé (≥ 80 %)", ok: mastered >= 1 },
    { label: "Polyvalent (5 thèmes)", ok: tried >= 5 }
  ];
}
function renderHomeStreakCard() {
  const days = EXTRAS.days || [];
  const byTheme = (state.myProgress && state.myProgress.by_theme) || [];
  const streak = computeStreak(days);
  const weekStart = localISO(new Date(Date.now() - 6 * 86400000));
  const week = days.filter(d => d >= weekStart).length;
  const goal = 3;
  const pct = Math.min(100, Math.round(week / goal * 100));
  const badges = computeBadges(days, byTheme);
  const card = el(`<div class="card" style="margin-bottom:20px;"><h3 style="margin:0 0 10px;">Ma régularité</h3>
    <div class="stat-grid">
      <div class="stat-tile"><div class="val">${streak}</div><div class="lbl">Jour${streak > 1 ? "s" : ""} d'affilée</div></div>
      <div class="stat-tile"><div class="val">${week}/${goal}</div><div class="lbl">Jours actifs (7 derniers jours)</div></div>
    </div>
    <div style="margin:10px 0 4px;font-size:12.5px;color:var(--text-muted);">Objectif de la semaine : réviser ${goal} jours différents</div>

    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;"></div></div>`);
  const wrap = card.lastElementChild;

  return card;
}

/* ---------- Alertes de recyclage ---------- */
function recycleAlertsFromSteps(steps) {
  const out = []; const now = Date.now();
  (steps || []).forEach(s => {
    if (s.step_type === "recyclage_fc" && s.status !== "valide" && s.target_date) {
      const d = Math.ceil((new Date(s.target_date).getTime() - now) / 86400000);
      if (d < 0) out.push({ sev: 2, text: "Recyclage « " + s.label + " » : échéance dépassée de " + (-d) + " jour" + (-d > 1 ? "s" : "") });
      else if (d <= 60) out.push({ sev: 1, text: "Recyclage « " + s.label + " » : échéance dans " + d + " jour" + (d > 1 ? "s" : "") });
    }
  });
  const valid = (steps || []).filter(s => s.status === "valide" && s.validated_date && (s.step_type === "formation_initiale" || s.step_type === "recyclage_fc") && (s.niveau === "PSE1" || s.niveau === "PSE2"));
  if (valid.length) {
    const last = Math.max.apply(null, valid.map(s => new Date(s.validated_date).getTime()));
    const planned = (steps || []).some(s => s.step_type === "recyclage_fc" && s.status !== "valide");
    const months = (now - last) / (86400000 * 30.44);
    if (!planned && months >= 10) out.push({ sev: months >= 12 ? 2 : 1, text: "Dernière validation il y a " + Math.floor(months) + " mois : recyclage annuel à planifier (indicatif)" });
  }
  return out;
}

  const steps = state.myParcours && state.myParcours.steps;

async function openAttendance(s) {
  EXTRAS.att = { session: s, loading: true };

    const statuses = {};
    (r.statuses || []).forEach(x => { statuses[x.account_id] = x.status; });

  } else {
    EXTRAS.att = { session: s, error: true };
  }

}
// Marque une séance comme "Réalisée" en conservant ses autres informations (module entraînements).
async function markSessionDone(session) {
  const r = await rpc("app_session_save_details", {
    p_token: state.auth.token, p_session_id: session.id, p_ends_at: session.ends_at || null,
    p_location: session.location || "", p_animator_name: session.animator_name || "",
    p_equipment: session.equipment || "", p_status: "realisee", p_report: session.report || ""
  });
  if (!r || r.error) return false;
  session.status = "realisee";
  return true;
}
function printAttendanceSheet(att) {

function renderAttendancePanel() {
  const att = EXTRAS.att;
  if (!att) return null;
  const card = el(`<div class="card accent" style="margin-bottom:16px;"></div>`);
  card.appendChild(el(`<h3 style="margin:0 0 6px;">Présence — ${esc(att.session.title)}</h3>`));
  card.appendChild(el(`<div class="mini-help" style="margin-bottom:8px;">${esc(formatSessionRange(att.session))}</div>`));
  if (att.loading) { card.appendChild(el(`<div class="mini-help">Chargement…</div>`)); return card; }
  if (att.error) { card.appendChild(el(`<div class="mini-help">Impossible de charger la liste.</div>`)); }
  else {
    // P = présent, A = absent, E = excusé. Une case non pointée n'est pas enregistrée.
    const META = {
      present: { key: "P", label: "Présent", bg: "var(--good)" },
      absent: { key: "A", label: "Absent", bg: "var(--critical)" },
      excuse: { key: "E", label: "Excusé", bg: "var(--warning)" }
    };
    const count = el(`<div style="font-weight:700;font-size:13px;margin:6px 0;"></div>`);
    const buttons = [];
    const paint = () => {
      const n = { present: 0, absent: 0, excuse: 0 };
      att.learners.forEach(l => { const st = att.statuses[l.id]; if (st && n[st] !== undefined) n[st]++; });
      const marked = n.present + n.absent + n.excuse;
      count.textContent = n.present + " présent(s) · " + n.absent + " absent(s) · " + n.excuse + " excusé(s) · " + (att.learners.length - marked) + " non pointé(s)";
      buttons.forEach(b => {
        const on = att.statuses[b.id] === b.status;
        b.btn.style.background = on ? META[b.status].bg : "var(--surface-1)";
        b.btn.style.color = on ? "#fff" : "var(--text-primary)";
        b.btn.style.borderColor = on ? "transparent" : "var(--border)";
      });
    };
    const search = el(`<input type="text" placeholder="Rechercher un nom" style="width:100%;margin-bottom:8px;padding:9px 12px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);font-family:inherit;">`);
    const allPresent = el(`<button class="btn secondary" style="font-size:12px;padding:5px 10px;margin-bottom:8px;">Marquer présents les non pointés</button>`);
    allPresent.onclick = () => { att.learners.forEach(l => { if (!att.statuses[l.id]) att.statuses[l.id] = "present"; }); paint(); };
    const list = el(`<div style="max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:4px 10px;"></div>`);
    att.learners.forEach(l => {
      const row = el(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span style="flex:1;min-width:150px;">${esc(l.full_name || "")}</span><span class="tag">${esc(l.niveau || "")}</span></div>`);
      row.dataset.name = (l.full_name || "").toLowerCase();
      const grp = el(`<span style="display:flex;gap:4px;"></span>`);
      ["present", "absent", "excuse"].forEach(st => {
        const btn = el(`<button type="button" title="${META[st].label}" style="border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;">${META[st].key}</button>`);
        btn.onclick = () => { att.statuses[l.id] = st; paint(); };
        buttons.push({ id: l.id, status: st, btn });
        grp.appendChild(btn);
      });
      row.appendChild(grp);
      list.appendChild(row);
    });
    search.oninput = () => { const q = search.value.trim().toLowerCase(); list.querySelectorAll("[data-name]").forEach(r => { r.style.display = (!q || r.dataset.name.includes(q)) ? "" : "none"; }); };
    paint();
    card.appendChild(count); card.appendChild(search); card.appendChild(allPresent); card.appendChild(list);
    const msg = el(`<div class="mini-help" style="margin-top:6px;"></div>`);
    const doneWrap = el(`<div style="margin-top:8px;"></div>`);
    const save = el(`<button class="btn" style="margin-top:10px;">Enregistrer la présence</button>`);
    save.onclick = async () => {
      const payload = {};
      att.learners.forEach(l => { if (att.statuses[l.id]) payload[l.id] = att.statuses[l.id]; });
      const n = Object.keys(payload).length;
      if (!n) { msg.textContent = "Aucune présence pointée pour le moment."; return; }
      save.disabled = true;
      const r = await rpc("app_session_attendance_set_v2", { p_token: state.auth.token, p_session: att.session.id, p_statuses: payload });
      save.disabled = false;
      if (!r || !r.ok) { msg.textContent = "Enregistrement impossible pour le moment."; return; }
      msg.textContent = "Présence enregistrée (" + n + " pointé(s)).";
      doneWrap.innerHTML = "";
      if (att.session.status !== "realisee") {
        const done = el(`<button class="btn secondary" style="font-size:12.5px;">Marquer la séance « Réalisée »</button>`);
        done.onclick = async () => {
          done.disabled = true;
          const ok = await markSessionDone(att.session);
          if (ok) { render(); } else { done.disabled = false; msg.textContent = "Impossible de changer le statut de la séance."; }
        };
        doneWrap.appendChild(el(`<div class="mini-help" style="margin-bottom:6px;">Seules les séances « Réalisées » comptent dans les heures et l'assiduité.</div>`));
        doneWrap.appendChild(done);
      }
    };
    const pr = el(`<button class="btn secondary" style="margin-top:10px;margin-left:8px;">Imprimer la feuille</button>`);
    pr.onclick = () => printAttendanceSheet(att);
    card.appendChild(save); card.appendChild(pr); card.appendChild(msg); card.appendChild(doneWrap);
  }
  const close = el(`<button class="btn secondary" style="margin-top:10px;">Fermer</button>`);
  close.onclick = () => { EXTRAS.att = null; render(); };
  card.appendChild(close);
  return card;
}
function appendPastSessions(container) {
  if (!isFormateur() || !Array.isArray(state.sessions)) return;
  const now = Date.now();
  const past = state.sessions.filter(s => new Date(s.starts_at).getTime() < now - 3600000).sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 12);
  if (!past.length) return;
  const card = el(`<div class="card" style="margin-top:16px;"><h3 style="margin:0 0 10px;">Séances passées (présence)</h3></div>`);

async function exportMonthlyReport(month) {
  const r = await rpc("app_formateur_monthly_report", { p_token: state.auth.token, p_month: month + "-01" });
  if (!r || r.error) { alert("Impossible de générer le bilan pour le moment."); return; }
  const lines = [
    ["Bilan mensuel MyPSE", month],
    ["Séances d'entraînement", r.sessions],
    ["Présences enregistrées", r.presences],
    ["Réponses aux quizz", r.answers],
    ["Bonnes réponses", r.correct],
    ["Taux de réussite %", r.answers ? Math.round(r.correct / r.answers * 100) : ""],
    ["Secouristes actifs dans le mois", r.active_accounts],
    ["Comptes secouristes", r.accounts],
    [],
    ["Séance", "Date", "Fonction", "Présents"]
  ].concat((r.sessions_list || []).map(s => [s.title, fmtDateFR(s.starts_at), s.fonction, s.present]));
  const csv = "﻿" + lines.map(l => l.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(";")).join("\r\n");

      if (EXTRAS.pfMedia && EXTRAS.pfMedia.mediaBusy) { err.textContent = "Patientez : l'envoi de la photo est en cours."; return; }
      payload.media = mediaPayloadOf(EXTRAS.pfMedia || {});
      send.disabled = true;
      const r = await rpc("app_propose_question", { p_token: state.auth.token, p_payload: payload });
      if (r && r.ok) { EXTRAS.pfMedia = null; EXTRAS.pfOpen = false; EXTRAS.pfMsg = "Proposition envoyée."; await loadProposals(); render(); }
      else { send.disabled = false; err.textContent = (r && r.error === "invalid_media") ? "Média invalide : crédit obligatoire, texte alternatif pour les photos, 4 médias maximum." : "Envoi impossible pour le moment."; }
    };
    f.appendChild(send); card.appendChild(f);
  }
  if (EXTRAS.pfMsg) card.appendChild(el(`<div class="help">${esc(EXTRAS.pfMsg)}</div>`));
  const P = EXTRAS.proposals;
  if (P === "loading" || P === null) { card.appendChild(el(`<div class="help">Chargement…</div>`)); return card; }
  const items = P.items.filter(x => x.status === "en_attente").concat(P.items.filter(x => x.status !== "en_attente").slice(0, 5));
  if (!items.length) card.appendChild(el(`<div class="help">Aucune proposition pour le moment.</div>`));
  items.forEach(it => {
    const q = it.payload || {};
    const st = it.status === "en_attente" ? "En attente" : (it.status === "validee" ? "Validée" : "Refusée");
    const row = el(`<div style="padding:10px 0;border-top:1px solid var(--border);">
      <div style="font-size:12px;color:var(--text-muted);">${esc(st)} · ${esc(it.author || "")} · ${fmtDateFR(it.created_at)} · ${esc(themeLabel(q.theme_id))} · ${esc(q.type || "")}</div>
      <div style="font-weight:600;font-size:13.5px;margin-top:3px;">${esc(q.q || q.scenario || "")}</div>
      ${q.choices ? `<div style="font-size:12.5px;margin-top:3px;">${q.choices.map((c, i) => (q.correct || []).includes(i) ? "<b>✔ " + esc(c) + "</b>" : esc(c)).join(" · ")}</div>` : ""}
      ${q.answers ? `<div style="font-size:12.5px;margin-top:3px;"><b>Réponses :</b> ${q.answers.map(esc).join(" · ")}</div>` : ""}
      <div style="font-size:12.5px;color:var(--text-secondary);margin-top:3px;">${esc(q.explanation || "")}</div>
      ${it.review_note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:3px;">Note : ${esc(it.review_note)}</div>` : ""}
    </div>`);
    const pMedia = renderQuestionMedia(q.media);
    if (pMedia) { pMedia.style.marginTop = "8px"; row.appendChild(pMedia); }
    if (it.status === "en_attente") {
      const own = P.me && it.proposed_by === P.me && !isAdministrateur();
      if (own) row.appendChild(el(`<div class="help" style="margin-top:6px;">À valider par un autre formateur.</div>`));
      else {
        const rv = async (acc) => {
          let note = null;
          if (!acc) { note = prompt("Motif du refus (facultatif) :"); if (note === null) return; }
          const r = await rpc("app_review_question_proposal", { p_token: state.auth.token, p_id: it.id, p_accept: acc, p_note: note });
          if (r && r.ok) {
            // Proposition refusée : on supprime ses photos du stockage.
            if (!acc) questionFormCleanupMediaFiles((q.media || []).map(m => m.path));
            await loadProposals(); if (acc) await goToQuestionsAdmin(); else render();
          }
          else alert("Action impossible : " + ((r && r.error) || "erreur"));
        };
        const ok = el(`<button class="btn" style="font-size:12px;padding:5px 10px;margin-top:6px;">Valider et publier</button>`);
        ok.onclick = () => rv(true);
        const no = el(`<button class="btn secondary" style="font-size:12px;padding:5px 10px;margin-top:6px;margin-left:6px;">Refuser</button>`);
        no.onclick = () => rv(false);
        row.appendChild(ok); row.appendChild(no);
      }
    }
    card.appendChild(row);
  });
  return card;
}


function pickRecommendedTheme() {
  const levels = visibleFonctions().filter(id => HOME_LEVEL_ORDER.includes(id));
  const candidateThemes = THEMES.filter(t => levels.includes(t.level));
  if (candidateThemes.length === 0) return null;

  const byTheme = (state.myProgress && state.myProgress.by_theme) || [];
  const statsByTheme = {};
  byTheme.forEach(t => { statsByTheme[t.theme] = t; });

  const neverTried = candidateThemes.filter(t => !statsByTheme[t.id] || !statsByTheme[t.id].total);
  if (neverTried.length > 0) {
    return neverTried[Math.floor(Math.random() * neverTried.length)];
  }

  // Priorité = score bas ET ancienneté de la dernière révision (plus c'est ancien, plus c'est prioritaire).
  const now = Date.now();
  const ranked = candidateThemes
    .map(t => {
      const st = statsByTheme[t.id];
      const days = st.last_at ? Math.max(0, (now - new Date(st.last_at).getTime()) / 86400000) : 0;
      const pct = st.correct / st.total;
      return Object.assign({}, t, { pct, priority: pct * 100 - Math.min(days, 60) * 0.5 });
    })
    .sort((a, b) => a.priority - b.priority);
  return ranked[0];
}

function goToRecommendedRevision() {
  const t = pickRecommendedTheme();
  if (!t) return;
  quickStartTheme(t.level, t.id);
}

  if (themesForLevel.length === 0) {
    card.appendChild(el(`<div class="empty-state">Contenu en cours de préparation pour cette fonction. Revenez bientôt !</div>`));

  const attempted = new Set(((state.myProgress && state.myProgress.by_theme) || []).filter(t => t.total > 0).map(t => t.theme));

  container.appendChild(el(`<div class="page-header">${iconChip("users", { color: "" })}<div><div class="page-title">Mon profil</div><div class="page-sub">Photo, identité et coordonnées — visibles par votre formateur.</div></div></div>`));

  const photoRow = el(`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;"></div>`);

  const initials = fullName.split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();

  const avatar = photoSrc
    ? el(`<img src="${esc(photoSrc)}" style="width:72px;height:72px;border-radius:999px;object-fit:cover;border:2px solid var(--border);flex:none;" />`)
    : el(`<div style="${avatarStyle}">${esc(initials)}</div>`);
  photoRow.appendChild(avatar);
  const photoCol = el(`<div></div>`);
  const fileLabel = el(`<label class="btn secondary" style="cursor:pointer;">Changer la photo<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" /></label>`);
  fileLabel.querySelector("input").onchange = (e) => onProfilePhotoSelected(e.target.files[0]);
  photoCol.appendChild(fileLabel);
  photoCol.appendChild(el(`<p class="help" style="margin-top:6px;">PNG, JPEG, WEBP ou GIF, 5 Mo maximum.</p>`));
  if (f.busy && f.photoFile) {
    photoCol.appendChild(el(`<p class="help">Envoi en cours… ${f.uploadProgress}%</p>`));

  photoRow.appendChild(photoCol);
  side.appendChild(photoRow);
  side.appendChild(el(`<div class="pname">${esc(fullName)}</div>`));
  side.appendChild(el(`<div class="prole"><span class="tag tag-blue">${esc(niveauShortLabel(state.auth.account.niveau))}</span></div>`));
  grid.appendChild(side);
  const two = el(`<div class="profile-two"></div>`);

  const nameField = el(`<div class="field"><label class="field-label">Nom complet</label></div>`);
  const nameInput = el(`<input type="text" style="${inputStyle}" value="${esc(f.full_name)}" placeholder="Prénom Nom" />`);
  nameInput.oninput = (e) => { f.full_name = e.target.value; };
  nameField.appendChild(nameInput);
  two.appendChild(nameField);

  const dateField = el(`<div class="field"><label class="field-label">Date de naissance</label></div>`);
  const dateInput = el(`<input type="date" style="${inputStyle}" value="${esc(f.date_naissance || "")}" />`);
  dateInput.oninput = (e) => { f.date_naissance = e.target.value; };
  dateField.appendChild(dateInput);
  two.appendChild(dateField);

  const addrField = el(`<div class="field"><label class="field-label">Adresse</label></div>`);
  const addrInput = el(`<textarea rows="2" style="${inputStyle}" placeholder="Numéro, rue, code postal, ville">${esc(f.adresse || "")}</textarea>`);
  addrInput.oninput = (e) => { f.adresse = e.target.value; };
  addrField.appendChild(addrInput);
  card.appendChild(two);
  card.appendChild(addrField);

  if (f.error) card.appendChild(el(`<p class="error-text" style="margin-bottom:10px;color:var(--critical);font-size:13px;">${esc(f.error)}</p>`));
  if (f.message && !f.error) card.appendChild(el(`<p class="help" style="color:var(--good);margin-bottom:10px;">✓ ${esc(f.message)}</p>`));

  const saveBtn = el(`<button class="btn primary block" ${f.busy ? "disabled" : ""}>${f.busy ? "Enregistrement…" : "Enregistrer"}</button>`);
  saveBtn.onclick = submitMyProfileForm;
  card.appendChild(saveBtn);

  grid.appendChild(card);

  // Changement de mot de passe (Phase 4 — 15/10/2026)
  const pf = PW_FORM;
  container.appendChild(el(`<div class="section-title">Sécurité</div>`));
  const pwCard = el(`<div class="card" style="max-width:520px;"><h3>Changer mon mot de passe</h3></div>`);

  [["old", "Mot de passe actuel", "current-password"], ["nw", "Nouveau mot de passe (8 caractères minimum)", "new-password"], ["conf", "Confirmer le nouveau mot de passe", "new-password"]].forEach(([k, label, ac]) => {
    const fld = el(`<div class="field"><label class="field-label">${label}</label><input type="password" autocomplete="${ac}" style="${pwStyle}" value="${esc(pf[k])}"></div>`);
    fld.querySelector("input").oninput = (e) => { pf[k] = e.target.value; };
    pwCard.appendChild(fld);
  });
  if (pf.error) pwCard.appendChild(el(`<p class="error-text" style="margin-bottom:10px;color:var(--critical);font-size:13px;">${esc(pf.error)}</p>`));
  if (pf.ok) pwCard.appendChild(el(`<p class="help" style="color:var(--good);margin-bottom:10px;">✓ Mot de passe modifié. Vos autres appareils ont été déconnectés.</p>`));
  const pwBtn = el(`<button class="btn primary block" ${pf.busy ? "disabled" : ""}>${pf.busy ? "Modification…" : "Changer le mot de passe"}</button>`);
  pwBtn.onclick = submitPasswordChange;
  pwCard.appendChild(pwBtn);
  container.appendChild(pwCard);
  return container;
}

/* ============================================================

  container.appendChild(el(`<div class="kpi-strip" style="margin-bottom:16px;">
    <div class="kpi teal"><div class="kv">${list.length}</div><div class="kl">Comptes secouristes</div></div>
    <div class="kpi"><div class="kv">${nb("PSC")}</div><div class="kl">Premiers Secours Citoyen</div></div>
    <div class="kpi indigo"><div class="kv">${nb("PSE1")}</div><div class="kl">Secouristes</div></div>
    <div class="kpi indigo"><div class="kv">${nb("PSE2")}</div><div class="kl">Équipiers-Secouristes</div></div>

  </div>`));

  const bar = el(`<div class="card filter-bar"></div>`);
  const sel = el(`<select>${[["all", "Toutes les fonctions"], ["PSC", "Premiers Secours Citoyen"], ["PSE1", "Secouriste"], ["PSE2", "Équipier-Secouriste"]].map(([v, l]) => `<option value="${v}" ${PERS_UI.niveau === v ? "selected" : ""}>${l}</option>`).join("")}</select>`);
  sel.onchange = (e) => { PERS_UI.niveau = e.target.value; render(); };
  const search = el(`<input type="text" class="grow" placeholder="Rechercher un nom ou un e-mail" value="${esc(PERS_UI.q)}">`);

  const tableWrap = el(`<div class="stats-table-wrap"><table class="stats-table">
    <thead><tr>
      <th>Secouriste</th><th>Né(e) le</th><th>Adresse</th><th>Fonction</th><th>Difficulté recommandée</th><th>Qualifications</th>
    </tr></thead>

  </table></div>`);
  const tbody = tableWrap.querySelector("tbody");
  shown.forEach(sr => appendPersonnelRow(tbody, sr));
  if (!shown.length) tbody.appendChild(elRow(`<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:18px;">Aucun secouriste ne correspond à ces filtres.</td></tr>`));
  container.appendChild(tableWrap);
  container.appendChild(el(`<div class="section-title">Inviter un formateur</div>`));
  container.appendChild(el(`<div class="card">
    <h3>Code formateur</h3>

    <div style="font-family:monospace;font-weight:700;font-size:14px;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:inline-block;">${esc(state.formateurCode || "…")}</div>
  </div>`));

function appendPersonnelRow(tbody, sr) {

    <div style="display:flex;align-items:center;gap:10px;">

        <div class="name">${esc(sr.full_name)}</div>

    <option value="difficile" ${sr.difficulty === "difficile" ? "selected" : ""}>Difficile</option>
  </select>`);

  row.appendChild(diffTd);

  const qualTd = elCell(`<td style="white-space:nowrap;"></td>`);

  conduitePill.onclick = () => toggleConduiteModule(sr.id, !sr.has_conduite_module);

  tbody.appendChild(row);
